const QUESTIONS=[{"questionId":1,"category":"비공개 개인 사실","difficulty":1,"questionText":"구본윤이 실제로 사용하는 휴대전화의 뒷면에 부착된 뽁뽁이 형태의 스티커를 관찰했을 때, 해당 스티커를 이루는 개별 뽁뽁이의 총개수는 정확히 몇 개인가?","options":["18개","20개","24개","26개","30개"],"correctAnswer":2,"detailedExplanation":"정답은 24개입니다.\n\n이 정답은 사용자가 해당 물체의 개수를 24개라고 직접 제공한 정보를 기준으로 설정했습니다. 공개된 논문이나 인터넷 자료를 바탕으로 독립 검증한 사실은 아닙니다.\n\n지문만으로 개수를 계산할 수 있는 수치·배열 조건이나 사진이 제공되지 않았으므로, 일반적인 수학 계산 또는 학술 지식만으로 이 값을 도출할 수는 없습니다. 직접 관찰하거나 해당 비공개 정보를 알고 있어야 합니다.","wrongOptionExplanations":["사용자가 제공한 개수 24개와 다릅니다.","사용자가 제공한 개수 24개와 다릅니다.","사용자가 직접 제공한 24개와 일치합니다.","사용자가 제공한 개수 24개와 다릅니다.","사용자가 제공한 개수 24개와 다릅니다."],"sourceReferences":[{"title":"사용자가 직접 제공한 비공개 사실","url":"","note":"공개 출처 또는 독립 관찰에 의해 검증한 정보가 아닙니다."}],"verified":false,"estimatedDifficulty":"비공개 관찰 정보가 필요한 문항","verification":{"method":"사용자 제공 정보로 답안 설정","result":"24개라는 사용자 진술을 사용. 독립 검증하지 않음."}},{"localId":"M-1","category":"수학","difficulty":3,"questionText":"정수의 합동 조건을 이용하는 검증 장치가 다음과 같이 작동한다. 장치의 내부 상태는 정수 \\(x\\)로 기록되며, 서로 다른 상태를 같은 나머지류로 합치지 않기 위해 대표값의 범위를 \\(0\\le x\u003c21600\\)으로 고정한다. 첫 번째 검사에서는 \\(x^2\\equiv1\\pmod{21600}\\)인 상태만 통과한다. 여기서 모듈러스는 \\(21600=2^5\\cdot3^3\\cdot5^2\\)이고, 각 소수 거듭제곱에서 구한 해를 결합할 때에는 세 조건을 모두 동시에 만족해야 한다.\n\n두 번째 검사에서는 첫 번째 검사를 통과한 대표값 자체를 7로 나눈 나머지를 조사하여 \\(x\\equiv2\\pmod7\\)인 상태만 남긴다. 특히 두 번째 조건을 적용한 뒤 대표값에 21600을 더하거나 빼서 새로운 상태를 추가해서는 안 된다. 21600은 7의 배수가 아니므로 첫 번째 검사에서의 나머지류와 두 번째 검사에서의 나머지류를 무심코 혼동하면 결과가 달라진다.\n\n최종 점수는 살아남은 상태의 개수가 아니라 그 대표값들의 합으로 정의한다. 계산 과정에서는 홀수 소수의 거듭제곱에서 생기는 두 부호 선택뿐 아니라, 2의 거듭제곱에서 추가로 생기는 제곱근도 빠짐없이 고려해야 한다. 또 동일한 대표값이 서로 다른 결합 경로에서 중복 계산되지 않았는지 확인해야 한다. 이 규칙으로 얻는 최종 점수는 얼마인가?","options":["43,200","41,201","35,801","64,800","48,002"],"correctAnswer":1,"detailedExplanation":"① 27과 25에서는 \\((x-1)(x+1)\\)의 두 인수가 서로소인 홀수 부분을 나누므로 해는 각각 \\(\\pm1\\)이다. 32에서는 직접 인수의 2진 지수를 비교하면 \\(1,15,17,31\\)의 네 해를 얻는다.\n\n② 세 모듈러스는 서로소이다. 중국인의 나머지 정리에 따라 총 \\(4\\cdot2\\cdot2=16\\)개의 대표값이 있다. 실제 결합에는 \\(E_{32}=7425\\), \\(E_{27}=6400\\), \\(E_{25}=7776\\)을 사용할 수 있다. 각각 자신의 모듈러스에서는 1, 나머지 두 모듈러스에서는 0이다. 따라서 \\(x\\equiv aE_{32}+bE_{27}+cE_{25}\\pmod{21600}\\)로 계산한다.\n\n③ 작은 순서로 나열하면 \\(1,1999,4049,4751,6049,6751,8801,10799,10801,12799,14849,15551,16849,17551,19601,21599\\)이다. 이 목록은 부호 대칭 \\(x\\leftrightarrow21600-x\\)도 만족한다.\n\n④ 이 중 7로 나눈 나머지가 2인 대표값은 \\(8801=7\\cdot1257+2\\), \\(14849=7\\cdot2121+2\\), \\(17551=7\\cdot2507+2\\)이다. 합은 \\(8801+14849+17551=41201\\)이다. Python은 전체 21600개 정수를 직접 검사해 같은 세 값을 확인했다.","wrongOptionExplanations":["모든 제곱근은 합이 21600인 쌍을 이루지만, 7에 대한 추가 조건은 그 쌍을 보존하지 않습니다.","위 풀이와 일치합니다.","2의 거듭제곱에서 두 개의 추가 제곱근을 빠뜨리면 필터에 들어오는 대표값이 달라집니다.","개수나 평균에 근거한 추정으로는 7에 대한 잔여류 분포를 결정할 수 없습니다.","7에 대한 조건을 적용한 뒤에도 21600에 대한 부호 대칭이 남는다고 가정한 값입니다."],"sourceReferences":[{"title":"MIT 18.781: Chinese Remainder Theorem","url":"https://ocw.mit.edu/courses/18-781-theory-of-numbers-spring-2012/resources/mit18_781s12_lec5/","note":"서로소 모듈러스 결합 원리 참고. 수치와 복합 조건은 독자 구성."}],"verified":true,"estimatedDifficulty":"대학 수학 심화 · 3단계","verification":{"method":"0≤x\u003c21600 전수 대입으로 두 합동식 동시 검증","result":"PASS: 독립 Python 정확 계산 및 구조·분량 검사 통과. 계산값 41201","expected":"41201","correctOption":"41,201"},"questionId":2},{"localId":"M-2","category":"수학","difficulty":4,"questionText":"가법군 \\(G=(\\mathbb Z/72\\mathbb Z)^3\\)의 원소를 열벡터로 쓰고, 정수 행렬\n\\[A=\\begin{pmatrix}4&22&18\\\\0&18&18\\\\4&4&0\\end{pmatrix}\\]\n가 정의하는 준동형 \\(T:G\\to G\\), \\(T(v)=Av\\)를 생각한다. 행렬의 각 성분과 벡터의 각 좌표에 대한 계산은 모두 72를 법으로 한다. 영벡터로 보내지는 원소들이 이루는 부분군을 \\(K=\\ker T\\)라 하자. 이 문제에서 원소의 위수는 행렬의 곱셈 위수가 아니라 가법군에서의 위수이다.\n\n즉 \\(v\\in G\\)의 위수는 \\(mv=0\\)이 되는 가장 작은 양의 정수 \\(m\\)이다. 세 좌표 중 하나가 72와 서로소라고 해서만 위수가 72인 것은 아니며, 서로 다른 좌표가 각각 필요한 소수 거듭제곱 성분을 제공할 수도 있다. 반대로 행렬이 유리수체 위에서 계수 2라는 이유만으로 핵의 원소 수를 72라고 계산하는 것도 허용되지 않는다.\n\n정수 기본행·열 연산 중 행렬식이 \\(\\pm1\\)인 연산은 이 모듈러스 위에서도 가역이므로, 이러한 연산으로 좌표계를 바꾸어 계산할 수 있다. 다만 핵의 전체 크기를 구한 뒤에는 위수가 72보다 작은 원소를 별도로 제외해야 한다. 이 점들을 모두 반영할 때, \\(K\\) 안에서 가법 위수가 정확히 72인 원소는 몇 개인가?","options":["4,608","1,728","2,304","2,592","5,184"],"correctAnswer":2,"detailedExplanation":"① 모든 성분의 최대공약수는 2이다. 2차 소행렬식의 최대공약수는 72이다. 실제 비영 소행렬식은 부호를 제외하면 72의 배수이며, 값 72도 나타난다. 전체 행렬식은 0이고 계수는 2이므로 스미스 표준형은 \\(\\operatorname{diag}(2,36,0)\\)이다.\n\n② 정수에서 가역인 좌표변환은 72를 법으로 해도 가역이고 가법 위수를 보존한다. 따라서 핵은 \\(2u=0\\), \\(36v=0\\), \\(0w=0\\)인 좌표들의 군과 동형이다. 각 좌표 해의 수는 \\(\\gcd(2,72)=2\\), \\(\\gcd(36,72)=36\\), 72이고, 추상군으로는 \\(C_2\\oplus C_{36}\\oplus C_{72}\\)이다.\n\n③ 이 군에서 위수가 \\(d\\mid72\\)의 약수인 원소 수는 \\(N(d)=\\gcd(2,d)\\gcd(36,d)\\gcd(72,d)\\)이다. 위수가 정확히 72가 아니면 최대 소수 거듭제곱 성분 하나가 빠지므로 위수는 36 또는 24의 약수이다.\n\n④ 포함배제를 적용하면 \\(N(72)-N(36)-N(24)+N(12)\\)이다. 각각 \\(2\\cdot36\\cdot72=5184\\), \\(2\\cdot36\\cdot36=2592\\), \\(2\\cdot12\\cdot24=576\\), \\(2\\cdot12\\cdot12=288\\)이므로 답은 \\(5184-2592-576+288=2304\\)이다. 별도 검증은 원래 좌표의 \\(72^3\\)개 벡터를 직접 검사했다.","wrongOptionExplanations":["두 종류의 결손을 단순히 절반씩 처리할 수 없습니다. 부분군의 교집합을 계산해야 합니다.","유리수 위의 계수만으로 모듈러 핵의 크기를 정할 수 없고, 위수 조건도 남습니다.","위 풀이와 일치합니다.","2진 성분이 부족한 원소만 제외하고 3진 성분이 부족한 원소를 제외하지 않은 값입니다.","이 값은 핵 전체의 크기이며 정확한 위수가 72라는 조건을 적용하지 않았습니다."],"sourceReferences":[{"title":"MIT Algebra II, Lecture 21: Smith Normal Form","url":"https://ocw.mit.edu/courses/res-18-012-algebra-ii-student-notes-spring-2022/resources/mit18_702s22_lect21/","note":"정수 행렬의 불변인자 원리. 행렬·위수 조건은 독자 구성."}],"verified":true,"estimatedDifficulty":"대학 수학 심화 · 4단계","verification":{"method":"72^3 벡터에 원래 합동 행렬식과 가법 위수 직접 검사","result":"PASS: 독립 Python 정확 계산 및 구조·분량 검사 통과. 계산값 2304","expected":"2304","correctOption":"2,304"},"questionId":3},{"localId":"M-4","category":"수학","difficulty":4,"questionText":"실함수 \\(f\\)는 닫힌 구간 \\([0,1]\\)에서 절대연속이고, 거의 모든 점에서 존재하는 도함수 \\(f'\\)가 제곱적분 가능하다고 하자. 끝점과 두 모멘트에 다음 조건을 부과한다.\n\\[f(0)=f(1)=0,\\qquad \\int_0^1f(x)\\,dx=1,\\qquad\\int_0^1x f(x)\\,dx=\\frac23.\\]\n이 조건을 모두 만족하는 함수들의 집합에서 에너지 \\(E(f)=\\int_0^1(f'(x))^2\\,dx\\)의 가능한 최솟값을 구하려 한다. 함수의 값은 음수가 되어도 좋으며, 두 번째 모멘트를 확률밀도의 평균처럼 해석하여 비음수 조건을 추가해서는 안 된다.\n\n허용 함수는 다항식으로 제한되어 있지 않다. 따라서 특정 차수의 다항식 후보를 찾아 그 에너지를 계산하는 것만으로는 최솟값을 증명할 수 없다. 후보가 모든 허용 방향의 변화에 대해 에너지의 일차항을 없앤다는 사실과, 남은 이차항이 음이 될 수 없다는 사실을 함께 확인해야 한다. 절대연속이라는 가정은 끝점 값과 부분적분을 정당하게 사용하는 데 필요하다.\n\n두 적분 조건은 서로 독립이며, \\(\\int f=1\\)만을 사용하면 얻는 대칭적인 함수는 주어진 \\(\\int xf=2/3\\)을 만족하지 않는다. 반대로 선형함수는 끝점 조건 때문에 두 모멘트를 만들 수 없다. 끝점 조건과 두 모멘트 조건을 동시에 만족시키면서 전체 함수 공간에서 달성되는 에너지의 정확한 최솟값은 다음 중 무엇인가?","options":["12","48","32","40","24"],"correctAnswer":2,"detailedExplanation":"① 끝점이 0인 두 함수 \\(u=x(1-x)\\), \\(v=x(1-x)(2x-1)\\)를 이용한다. 직접 적분하면 \\(\\int u=1/6\\), \\(\\int v=0\\), \\(\\int xu=1/12\\), \\(\\int xv=1/60\\)이다.\n\n② \\(f_*=au+bv\\)에 모멘트를 적용하면 \\(a/6=1\\), \\(a/12+b/60=2/3\\)이므로 \\(a=6,b=10\\)이다. 따라서 \\(f_*=-20x^3+24x^2-4x\\), \\(f_*'=-60x^2+48x-4\\), \\(f_*''=-120x+48\\)이다.\n\n③ 임의의 다른 허용함수를 \\(f=f_*+h\\)로 쓰면 \\(h(0)=h(1)=0\\), \\(\\int h=\\int xh=0\\)이다. 부분적분으로 \\(\\int f_*'h'=-\\int f_*''h=120\\int xh-48\\int h=0\\)이다. 그러므로 \\(E(f)=E(f_*)+\\int(h')^2\\ge E(f_*)\\). 등호이면 h'=0이고 끝점 조건에 의해 h=0이다.\n\n④ 마지막 적분의 제곱을 전개하면 \\(3600x^4-5760x^3+2784x^2-384x+16\\)이다. 적분값은 \\(720-1440+928-192+16=32\\). 따라서 최솟값은 32이며 실제로 유일한 함수에서 달성된다. 검증 코드는 다항식 계수의 모든 교차항을 유리수로 적분했다.","wrongOptionExplanations":["첫 번째 모멘트만 있을 때의 최솟값입니다. 이 경우 대칭함수 6x(1-x)의 에너지가 12입니다.","선형항의 부호나 제곱 전개의 교차항을 잘못 합산한 값입니다.","위 풀이와 일치합니다.","허용함수 후보를 잘못 정규화하면 이 값이 나올 수 있으나 두 모멘트를 동시에 확인해야 합니다.","두 모멘트가 만드는 에너지 항의 교차항을 임의로 가정하면 안 됩니다."],"sourceReferences":[{"title":"MIT: Calculus of Variations lecture notes","url":"https://ocw.mit.edu/courses/18-s096-matrix-calculus-for-machine-learning-and-beyond-january-iap-2023/pages/lecture-notes-and-readings/","note":"변분법의 배경 자료. 최소성은 본 해설에서 직접 증명."}],"verified":true,"estimatedDifficulty":"대학 수학 심화 · 4단계","verification":{"method":"도함수 다항식의 에너지를 Fraction으로 정확 적분; 직교성 증명 별도 제시","result":"PASS: 독립 Python 정확 계산 및 구조·분량 검사 통과. 계산값 32","expected":"32","correctOption":"32"},"questionId":4},{"localId":"physics-03","category":"물리학","difficulty":4,"questionText":"강체 용기 안에 각각 놓인 두 유한한 열저장체 A, B가 있다. 용기 변형이나 상전이는 없고, 각 저장체는 과정 내내 내부 열평형을 유지하며 온도만 변한다. 절대온도 T에 대한 전체 열용량은 \\(C_A(T)=aT\\), \\(a=0.0200\\,\\mathrm{J\\,K^{-2}}\\), \\(C_B(T)=b\\), \\(b=8.00\\,\\mathrm{J\\,K^{-1}}\\)로 주어진다. 이는 몰열용량이 아니라 각 물체 전체의 열용량이며 주어진 온도 구간에서 정확하다. 초기 온도는 \\(T_{A0}=600\\,\\mathrm K\\), \\(T_{B0}=200\\,\\mathrm K\\)이다. 두 저장체와 열기관을 둘러싼 바깥 경계는 완전히 단열되어 있다.\n\n두 저장체 사이에 이상적인 가역 열기관을 연결하고 순간적인 두 온도를 고온원과 저온원의 온도로 사용하여 극미소 사이클을 계속 수행한다. 기관은 매 사이클 처음의 내부 상태로 돌아오며, 기관 자체의 에너지·엔트로피 축적은 없다. 외부로 전달되는 것은 순수한 기계적 일뿐이고, 에너지를 공급하는 제3의 저장체나 전지는 없다. 두 물체의 온도가 같아져 더 이상 일을 꺼낼 수 없을 때 작동을 멈춘다. 이 절차로 외부에 얻을 수 있는 최대 총일 W는 얼마인가? 최종 온도는 에너지 평균이 아니라 총엔트로피 보존으로 결정해야 하며, 모든 상수는 명시한 값 그대로 사용한다. 답은 마지막 단계에서만 가장 가까운 \\(0.1\\,\\mathrm J\\)로 반올림하여 고르시오.","options":["\\(1066.7\\,\\mathrm J\\)","\\(600.0\\,\\mathrm J\\)","\\(988.7\\,\\mathrm J\\)","\\(800.0\\,\\mathrm J\\)","\\(1200.0\\,\\mathrm J\\)"],"correctAnswer":2,"detailedExplanation":"1. 강체 저장체에서 \\(dU=C(T)dT\\), 가역 엔트로피 변화는 \\(dS=C(T)dT/T\\)이다. 전체 과정은 가역·단열이고 기계적 일은 엔트로피를 운반하지 않으므로 두 물체의 총엔트로피가 보존된다.\n\n2. 공통 최종 온도 \\(T_f\\)에 대해 \\(a(T_f-600)+b\\ln(T_f/200)=0\\)이다. 좌변의 미분 \\(a+b/T_f>0\\)이므로 양의 온도에서 해가 유일하다. 200 K에서 음수, 600 K에서 양수인 이 식을 이분법으로 풀면 \\(T_f=362.3180165965\\,\\mathrm K\\)이다.\n\n3. A의 에너지 감소량은 \\(\\int_{T_f}^{600}aT\\,dT=a(600^2-T_f^2)/2\\), B의 증가량은 \\(b(T_f-200)\\)이다. 기관의 축적에너지가 0이므로 차이가 외부 일이다.\n\n4. \\(W=0.0100(600^2-T_f^2)-8.00(T_f-200)=988.7124157239\\,\\mathrm J\\)이므로 반올림하면 988.7 J이다. 비가역 과정은 엔트로피를 증가시켜 같은 최종 온도 조건에서 더 많은 에너지를 물체에 남기므로 이 가역값이 최대이다.","wrongOptionExplanations":["이 일을 에너지 보존식에 넣으면 최종 온도가 357.185578 K가 되어 두 물체의 총엔트로피 변화가 -0.216784 J/K로 계산된다. 주어진 가역·단열 과정은 총엔트로피 변화 0을 요구하므로 이 값은 허용되지 않는다.","이 일을 에너지 보존식에 넣으면 최종 온도가 387.400787 K가 되어 두 물체의 총엔트로피 변화가 +1.037155 J/K로 계산된다. 주어진 가역·단열 과정은 총엔트로피 변화 0을 요구하므로 이 값은 허용되지 않는다.","정답이다. 엔트로피 보존의 해와 전체 에너지 감소량으로 얻는 값이다.","이 일을 에너지 보존식에 넣으면 최종 온도가 374.596669 K가 되어 두 물체의 총엔트로피 변화가 +0.512194 J/K로 계산된다. 주어진 가역·단열 과정은 총엔트로피 변화 0을 요구하므로 이 값은 허용되지 않는다.","이 일을 에너지 보존식에 넣으면 최종 온도가 348.331477 K가 되어 두 물체의 총엔트로피 변화가 -0.594673 J/K로 계산된다. 주어진 가역·단열 과정은 총엔트로피 변화 0을 요구하므로 이 값은 허용되지 않는다."],"sourceReferences":[{"title":"David Tong, Statistical Physics","url":"https://www.damtp.cam.ac.uk/user/tong/statphys/sp.pdf","note":"엔트로피, 정준 분배함수와 변동 공식 확인. 문항의 모형·매개변수·계산은 독자 구성."}],"verified":true,"estimatedDifficulty":"대학 상급: 가변 열용량 엔트로피 적분과 단조 초월방정식","verification":{"method":"160점 Gauss–Legendre로 두 엔트로피를 수치 적분하고 이분법으로 온도 결정; 에너지 적분을 별도로 수행","result":"Tf=362.318016596491 K; entropy residual=-1.78e-15 J/K; W=988.712415723917 J; rounded=988.7 J","computedValue":988.7124157239173,"correctChoiceCount":1,"nearestWrongChoiceDistance":77.98758427608277},"questionId":5},{"localId":"M-3","category":"수학","difficulty":4,"questionText":"서로 구별되는 작업 \\(0,1,\\ldots,7\\)을 서로 구별되는 처리기 \\(0,1,\\ldots,7\\)에 하나씩 배정한다. 각 처리기는 정확히 한 작업을 맡아야 하므로 배정은 순열 \\(\\pi\\)로 나타낼 수 있으며, \\(\\pi(i)\\)는 작업 \\(i\\)를 맡는 처리기의 번호이다. 작업 번호와 처리기 번호가 같으면 자체 검증이 불가능하고, 처리기 번호가 작업 번호의 바로 다음 번호이면 통신 충돌이 발생한다.\n\n따라서 모든 \\(i\\in\\{0,\\ldots,7\\}\\)에 대해 \\(\\pi(i)\\ne i\\)이고 \\(\\pi(i)\\ne i+1\\pmod8\\)이어야 한다. 두 번째 조건에서 작업 7의 금지 처리기는 0이다. 원형으로 번호를 적었지만 번호는 고정되어 있으므로 회전이나 반사로 얻어진 배정도 서로 다른 순열로 센다. 순열의 짝홀이나 순환 분해의 형태에는 추가 제한이 없다.\n\n금지 칸은 각 행과 각 열에 두 개씩 존재한다. 두 금지 조건을 독립인 사건으로 취급하여 두 개의 교란순열 수를 곱하거나, 각 작업이 여섯 처리기를 선택한다고 보아 \\(6^8\\)로 계산하면 전단사 조건을 반영하지 못한다. 포함배제로 접근한다면, 동시에 강제할 수 있는 금지 배정의 개수는 서로 같은 행이나 열을 공유하지 않는 금지 칸 선택에 의해 결정된다. 이러한 중첩을 정확히 반영한 유효 배정의 총수는 얼마인가?","options":["14,833","5,040","5,792","4,738","4,320"],"correctAnswer":3,"detailedExplanation":"① 금지 칸을 이분그래프의 간선으로 해석한다. 왼쪽 정점은 작업, 오른쪽 정점은 처리기이다. 각 작업 i가 처리기 i와 i+1에 연결되므로 이 그래프는 길이 16의 하나의 순환이다.\n\n② 동시에 성립할 수 있는 k개의 금지 배정은 이 순환에서 크기 k인 매칭이다. 길이 n 순환에서 매칭 수는 \\(\\binom{n-k}{k}+\\binom{n-k-1}{k-1}=\\frac n{n-k}\\binom{n-k}{k}\\)이다. 첫 식은 특정 간선을 쓰지 않는 경우와 쓰는 경우로 나눈 것이다.\n\n③ n=16을 넣으면 룩 수 \\(r_0,\\ldots,r_8\\)은 \\(1,16,104,352,660,672,336,64,2\\)이다. 선택한 k개 금지 배정을 강제한 뒤에는 남은 작업을 \\((8-k)!\\)가지로 배정할 수 있다.\n\n④ 따라서 포함배제 합은 \\(8!-16\\cdot7!+104\\cdot6!-352\\cdot5!+660\\cdot4!-672\\cdot3!+336\\cdot2!-64\\cdot1!+2\\cdot0!\\)이다. 수치로는 \\(40320-80640+74880-42240+15840-4032+672-64+2=4738\\)이다. 원형 대칭으로 나누는 단계는 없다. 모든 \\(8!\\) 순열을 별도 열거한 검증에서도 4738개가 남는다.","wrongOptionExplanations":["이 값은 일반 교란순열 !8이며, 바로 다음 처리기 금지 조건을 적용하지 않았습니다.","7!은 한 작업의 처리기를 고정하는 경우의 수이며 두 종류의 금지 조건을 반영하지 않습니다.","원형 금지 구조를 선형 구조로 풀면 끝점 연결에 관한 보정이 사라집니다.","위 풀이와 일치합니다.","일부 금지 사건의 교집합을 빠뜨리면 이처럼 작은 값이 나오지만 금지 그래프의 매칭 수와 맞지 않습니다."],"sourceReferences":[{"title":"MIT 18.212 Algebraic Combinatorics","url":"https://math.mit.edu/~apost/courses/18.212_2023/","note":"포함배제·매칭·순열 열거의 배경 자료. 해당 배정 문제는 독자 구성."}],"verified":true,"estimatedDifficulty":"대학 수학 심화 · 4단계","verification":{"method":"8! 순열 전수 열거로 두 금지 조건 직접 확인","result":"PASS: 독립 Python 정확 계산 및 구조·분량 검사 통과. 계산값 4738","expected":"4738","correctOption":"4,738"},"questionId":6},{"localId":"physics-06","category":"물리학","difficulty":5,"questionText":"질량 m인 비상대론적 입자 하나가 실수축 전체에서 움직이며, 처음에는 \\(H_i=p^2/(2m)-g\\delta(x)\\), \\(g>0\\)의 유일한 정규화된 결합상태에 있다. 외부 장치가 t=0에서 결합세기를 순간적으로 두 배로 바꾸어 그 뒤 해밀토니언은 \\(H_f=p^2/(2m)-2g\\delta(x)\\)가 된다. 델타의 위치는 움직이지 않고 급변 동안 입자 파동함수는 그대로 유지된다. 스핀, 다른 자유도, 외부 환경 및 이후 시간 의존성은 없다. g의 단위는 에너지 곱하기 길이이며 초기 결합에너지 크기를 \\(E_0=mg^2/(2\\hbar^2)>0\\)로 정의한다.\n\n급변 직후 최종 해밀토니언의 이상적인 에너지 측정을 시행하여 음의 결합상태 에너지가 나오면 그 시행을 버리고 E≥0의 연속 스펙트럼이 나온 시행만 남긴다. 연속상태의 좌우 산란 채널과 모든 양의 에너지는 빠짐없이 합산한다. 전체 시행 중 남는 확률을 \\(P_c\\), 남긴 시행의 측정값에 대한 조건부 평균을 \\(\\overline E_c\\)라 한다. 에너지 영점은 무한히 먼 곳의 퍼텐셜 0으로 고정한다. 급변 직후 상태가 \\(H_f\\)의 연산자 정의역에 속한다고 가정할 필요는 없으며, 평균에너지는 유한한 이차형식 \\(\\int(\\hbar^2/2m)|\\psi'|^2dx-2g|\\psi(0)|^2\\) 또는 동등한 스펙트럼 첫 모멘트로 계산한다. \\((P_c,\\overline E_c/E_0)\\)의 정확한 값은 어느 것인가? 겹침 진폭과 그 제곱인 확률을 구별하고, 음의 전체 평균이 양의 연속 채널 조건부 평균과 양립할 수 있음을 에너지 장부에 반영하시오.","options":["\\((1/9,5)\\)","\\((1/3,5)\\)","\\((8/9,5)\\)","\\((1/9,1)\\)","\\((1/9,32/9)\\)"],"correctAnswer":0,"detailedExplanation":"1. 원점 밖의 지수 감쇠와 델타 우물의 도함수 점프 조건에서 \\(\\kappa=mg/\\hbar^2\\), \\(\\psi_i=\\sqrt\\kappa e^{-\\kappa|x|}\\)이다. 초기 에너지는 \\(-\\hbar^2\\kappa^2/(2m)=-E_0\\)이다. 최종 우물의 감쇠상수는 2κ, 유일한 결합상태 에너지는 \\(-4E_0\\)이다.\n\n2. 급변은 상태를 바꾸지 않으므로 최종 결합상태 진폭은 \\(\\sqrt2\\kappa\\int_{-\\infty}^\\infty e^{-3\\kappa|x|}dx=2\\sqrt2/3\\)이다. 제곱하면 \\(P_b=8/9\\), 완전성에서 \\(P_c=1-P_b=1/9\\)이다.\n\n3. 초기 상태의 운동에너지 평균은 \\(\\int(\\hbar^2/2m)|\\psi_i'|^2dx=E_0\\), 원점 밀도는 κ이다. 최종 퍼텐셜 평균은 \\(-2g\\kappa=-4E_0\\)이므로 급변 직후 \\(\\langle H_f\\rangle=-3E_0\\)이다. 이차형식은 유한하므로 연산자 정의역 문제 없이 이 첫 모멘트를 사용할 수 있다.\n\n4. 스펙트럼 분해에서 \\(-3E_0=(8/9)(-4E_0)+(1/9)\\overline E_c\\)이다. 9를 곱하면 \\(-27E_0=-32E_0+\\overline E_c\\)이어서 \\(\\overline E_c=5E_0\\)이다. 확률이 큰 더 낮은 결합상태 때문에 전체 평균은 음수여도 연속 채널의 평균은 양수일 수 있다.","wrongOptionExplanations":["정답이다. 겹침 완전성과 스펙트럼 첫 모멘트를 함께 사용한 값이다.","겹침 진폭과 확률을 혼동했다. 결합확률은 (2√2/3)²=8/9이다.","8/9는 최종 결합상태 확률이다. 남기는 채널은 E≥0이다.","확률은 맞지만 연속 채널이 전체 평균에 +5E0/9를 기여해야 한다는 장부를 만족시키지 못한다.","32E0/9는 결합상태가 전체 평균에 주는 음의 기여의 절댓값이다. 연속 채널의 조건부 평균이 아니다."],"sourceReferences":[{"title":"Doron Cohen, Lecture Notes in Quantum Mechanics","url":"https://arxiv.org/abs/quant-ph/0605180","note":"급변 근사·스펙트럼 확률·일차원 결합상태의 원리 확인. 조건부 에너지 장부는 독자 계산."}],"verified":true,"estimatedDifficulty":"대학원 입문: 급변·연속 완전성·이차형식 에너지 장부","verification":{"method":"최종 우물의 정규화된 짝수 산란상태 겹침 밀도 |a(k)|²와 (k²/2)|a(k)|²를 k=tanθ로 직접 수치 적분","result":"continuum probability=0.11111111111111; unconditioned continuum energy=0.27777777777778; Econt/E0=5.000000000000","computedValue":[0.11111111111111127,4.999999999999987],"correctChoiceCount":1,"nearestWrongChoiceDistance":0.22222222222222204},"questionId":7},{"localId":"M-6","category":"수학","difficulty":5,"questionText":"단순 무방향 그래프 G의 정점집합을 \\(A=\\{a_1,a_2,a_3\\}\\), \\(B=\\{b_0,b_1,b_2,b_3\\}\\)의 서로소 합으로 둔다. A의 각 정점과 B의 각 정점 사이에는 간선이 하나씩 있으므로, 두 집합 사이의 부분그래프는 \\(K_{3,4}\\)이다. 여기에 A 안의 세 간선 \\(a_1a_2,a_2a_3,a_3a_1\\)을 추가하고, B 안에는 네 간선 \\(b_0b_1,b_1b_2,b_2b_3,b_3b_0\\)만 추가한다. B의 두 대각선 간선은 존재하지 않는다.\n\nG의 생성나무는 일곱 정점을 모두 포함하는 연결된 비순환 부분그래프이므로 정확히 여섯 간선을 가진다. 이 문제에서는 A 내부의 삼각형 간선을 정확히 한 개, B 내부의 사각형 간선을 정확히 두 개 포함하는 생성나무만 센다. 따라서 나머지 세 간선은 반드시 A와 B 사이에서 선택된다. 정점과 간선의 이름은 모두 고정되어 있고, 회전이나 정점 치환에 대한 동형류로 나누지 않는다.\n\nA 내부에서 한 간선을 고르는 방법과 B 내부에서 두 간선을 고르는 방법을 단순히 곱하는 것으로는 생성나무의 수가 나오지 않는다. 나머지 간선의 선택에 따라 연결성이 달라지고 순환이 생길 수도 있기 때문이다. 한 방법은 두 종류의 내부 간선에 각각 변수 t와 s를 붙여 가중 생성나무 다항식의 계수를 추출하는 것이다. 이 조건을 모두 만족하는 서로 다른 생성나무의 정확한 개수는 얼마인가?","options":["1,575","1,260","1,440","1,080","4,200"],"correctAnswer":2,"detailedExplanation":"① A 내부 간선에 가중치 t, B 내부 간선에 가중치 s, 두 집합 사이 간선에 가중치 1을 붙인다. 생성나무 다항식의 \\(t^1s^2\\) 계수가 답이다.\n\n② 가중 라플라시안을 A에서 좌표합이 0인 2차원 공간에 제한하면, K_{3,4} 부분은 4I이고 삼각형 라플라시안은 3tI이므로 고유값은 \\(4+3t\\) 두 개이다. B의 좌표합이 0인 공간에서는 K_{3,4}가 3I이고 사각형의 비영 고유값이 \\(2s,2s,4s\\)이므로 \\(3+2s\\) 두 개와 \\(3+4s\\) 하나를 얻는다.\n\n③ 각 집합에서 상수인 벡터들의 2차원 공간에는 전체 상수벡터의 고유값 0과, 두 집합 사이에서 변하는 벡터의 고유값 7이 남는다. 가중 행렬나무 정리에 의해 비영 고유값 곱을 정점 수 7로 나누면 \\(\\mathcal T(t,s)=(4+3t)^2(3+2s)^2(3+4s)\\)이다.\n\n④ 첫 인자의 t 계수는 \\(2\\cdot4\\cdot3=24\\)이다. 나머지는 \\((9+12s+4s^2)(3+4s)=27+72s+60s^2+16s^3\\)이다. 따라서 필요한 계수는 \\(24\\cdot60=1440\\)이다. 검증 코드는 19개 간선의 모든 6원소 부분집합에서 종류별 개수를 확인한 뒤, 서로소집합 자료구조로 순환 유무를 직접 판정했다.","wrongOptionExplanations":["이는 B 간선에 모두 가중치 1을 넣은 뒤 A 간선 두 개를 고르는 계수입니다.","비영 고유값의 중복도 또는 s² 계수의 교차항을 누락한 값입니다.","위 풀이와 일치합니다.","B 내부 두 간선의 인접 여부에 따라 나머지 연결 방법이 달라지는 효과를 반영해야 합니다.","이는 A 간선 한 개만 제한하고 B 간선 수 제한은 없앤 경우의 수입니다."],"sourceReferences":[{"title":"MIT: The Matrix Tree Theorem","url":"https://ocw.mit.edu/courses/18-314-combinatorial-analysis-fall-2014/resources/mit18_314f14_mt/","note":"가중 행렬나무 정리와 라플라시안 소행렬식. 그래프와 계수 조건은 독자 구성."}],"verified":true,"estimatedDifficulty":"대학 수학 심화 · 5단계","verification":{"method":"19개 간선 중 6개를 직접 선택해 종류별 개수와 비순환성 검사","result":"PASS: 독립 Python 정확 계산 및 구조·분량 검사 통과. 계산값 1440","expected":"1440","correctOption":"1,440"},"questionId":8},{"localId":"M-5","category":"수학","difficulty":5,"questionText":"공정한 동전을 독립적으로 계속 던지고, 앞면은 H, 뒷면은 T로 기록한다. 기록된 문자열의 끝에 네 글자 패턴 A=HTHH 또는 패턴 B=HHTH 중 하나가 처음 완성되는 즉시 실험을 멈춘다. 정지시각 \\(\\tau\\)는 실험을 시작한 뒤 던진 동전의 총개수이며, 패턴이 완성된 마지막 던짐도 포함한다. 두 패턴은 서로 다르므로 같은 시각에 동시에 완성될 수 없다.\n\n이번에는 A가 B보다 먼저 완성되었다는 사실을 알고 있는 관찰자에게 실험의 평균 길이를 묻는다. 구하려는 값은 무조건부 평균 \\(\\mathbb E[\\tau]\\)도, B를 무시하고 A만 기다리는 평균도 아니며, 사건 \\(W=\\{A\\text{가 먼저 완성됨}\\}\\)에 대한 조건부 평균 \\(\\mathbb E[\\tau\\mid W]\\)이다. 처음에는 아무 동전도 던지지 않았고, 관찰 전에 이미 일치한 접두사는 없다.\n\n패턴 사이에는 접두사와 접미사의 겹침이 있다. 예를 들어 HHT 뒤에 T가 나오면 단순히 처음으로 돌아가는 것이 아니라, 새로운 문자열의 끝에 HT가 남아 다음 패턴 형성에 영향을 준다. 따라서 네 번 던지기를 독립적인 한 묶음으로 나누어 성공확률을 계산할 수 없다. 현재까지의 문자열에서 두 패턴의 접두사와 일치하는 가장 긴 접미사만 상태로 보존하여, 승리확률과 승리 사건을 가중한 정지시간을 함께 계산할 때 얻는 정확한 조건부 평균은 얼마인가?","options":["14","16","12","11","13"],"correctAnswer":4,"detailedExplanation":"① 아직 흡수되지 않은 상태를 \\(\\varnothing,H,HT,HTH,HH,HHT\\) 순서로 둔다. H와 T에 대한 다음 상태는 각각 (H,∅), (HH,HT), (HTH,∅), (A,HT), (HH,HHT), (B,HT)이다. 이 표에서 겹치는 접미사를 보존했다.\n\n② 상태 s에서 A가 이길 확률을 p_s라 하면 흡수상태 p_A=1,p_B=0이고, 각 비흡수상태에서는 두 다음 상태 확률의 평균이다. 연립방정식을 풀면 \\(p=(2/5,2/5,3/5,4/5,1/5,1/5)\\)이다. 특히 빈 상태에서 A가 이길 확률은 2/5이다.\n\n③ \\(h_s=\\mathbb E_s[\\tau\\mathbf1_W]\\)로 둔다. 앞으로 한 번 던지는 시간은 이기는 경로에서만 기여하므로 \\(h_s=p_s+\\frac12h_{s_H}+\\frac12h_{s_T}\\)이고 흡수상태의 h는 0이다. 구체적으로 \\(h_0=p_0+(h_H+h_0)/2\\), \\(h_H=p_H+(h_{HH}+h_{HT})/2\\), \\(h_{HT}=p_{HT}+(h_{HTH}+h_0)/2\\), \\(h_{HTH}=p_{HTH}+h_{HT}/2\\), \\(h_{HH}=p_{HH}+(h_{HH}+h_{HHT})/2\\), \\(h_{HHT}=p_{HHT}+h_{HT}/2\\)이다.\n\n④ 해는 \\(h=(26/5,22/5,24/5,16/5,16/5,14/5)\\)이다. 따라서 \\(\\mathbb E[\\tau\\mid W]=h_0/p_0=(26/5)/(2/5)=13\\). 검증은 유리수 가우스 소거로 두 선형계를 따로 풀었다.","wrongOptionExplanations":["HHT 뒤의 T에서 남는 HT를 버리면 전이표와 시간 평균이 달라집니다.","A만 단독으로 기다리는 문제와 두 패턴의 경쟁을 혼동한 값입니다.","네 번씩 독립인 시행으로 나누는 계산은 중첩 패턴을 보존하지 않습니다.","승리 조건에 따른 경로 가중을 빠뜨리면 무조건부 시간에 가까운 값을 얻게 됩니다.","위 풀이와 일치합니다."],"sourceReferences":[{"title":"MIT 18.445: Hitting Times","url":"https://ocw.mit.edu/courses/18-445-introduction-to-stochastic-processes-spring-2015/pages/lecture-notes/","note":"흡수시각과 첫 단계 분석의 배경. 패턴 및 조건부 계산은 독자 구성."}],"verified":true,"estimatedDifficulty":"대학 수학 심화 · 5단계","verification":{"method":"6상태 접미사 자동자로 승리확률과 승리가중 시간 선형계를 정확 계산","result":"PASS: 독립 Python 정확 계산 및 구조·분량 검사 통과. 계산값 13","expected":"13","correctOption":"13"},"questionId":9},{"localId":"LOG-01","category":"복합 추론·논리·정보이론","difficulty":5,"questionText":"어떤 희귀 상태 H의 사전확률은 1/3이다. 두 감지기 S₁,S₂는 같은 장비함을 사용한다. 장비함의 잠재 고장 F는 H와 독립이며 P(F=1)=1/4이다. F=0일 때 두 감지기는 H를 조건으로 서로 독립이고 각각 민감도와 특이도가 모두 3/4이다. 반면 F=1이면 실제 H의 값과 무관하게 두 감지기가 모두 양성 1을 출력한다. 한 대상에서 두 감지기 출력이 모두 1인 것을 이미 관측하였다. 고장 여부 자체는 관측하지 못하며, 두 양성을 독립적인 증거로 간주할 수 없다.\n\n이 관측 이후 의사결정자는 실제 상태가 H인지 아닌지 이진 결정을 내려야 한다. H가 아닌데 H라고 선언하면 손실 4, H인데 아니라고 선언하면 손실 1을 지불한다. 올바른 선언의 손실은 0이다. 선언을 보류하는 행동은 없다. 추가 검사 T를 한 차례 구입하는 선택지도 있다. 이 검사는 주어진 H를 조건으로 F 및 두 감지기와 독립이고 민감도와 특이도가 모두 9/10이다. 검사는 양성과 음성을 모두 그대로 보고하며 선택적 보고나 누락은 없다.\n\n검사를 구입하면 결과를 본 뒤 위 손실을 최소화하는 선언을 할 수 있다. 검사비 c는 실제 H나 검사 결과와 무관하게 항상 지불하는 확정 손실이다. 검사하지 않는 경우에는 현재 정보만으로 최적 선언을 한다. 목적은 반복 대상 전체에 대한 조건부 기대 총손실의 최소화이며 정확도 자체의 최대화가 아니다. 추가 검사에 대한 의사결정은 이미 두 양성을 본 집단 안에서 이루어지므로, 검사비를 비교할 때 원래 전체 모집단에서 두 양성이 나올 확률을 다시 곱하지 않는다. 현재 H의 사후확률과 추가 검사가 엄격하게 유리해지는 c의 범위를 함께 올바르게 제시한 것은?","options":["P(H|11)=43/81; 0≤c\u003c47/162","P(H|11)=9/11; 0≤c\u003c47/162","P(H|11)=43/81; 0≤c\u003c47/648","P(H|11)=43/81; 0≤c\u003c13/54","P(H|11)=43/81; 0≤c\u003c43/81"],"correctAnswer":0,"detailedExplanation":"1단계: H일 때 두 양성의 우도는 1/4+(3/4)(3/4)²=43/64이다. H가 아닐 때는 1/4+(3/4)(1/4)²=19/64이다. 잠재 고장을 먼저 주변화해야 한다. 베이즈 정리로 P(H|11)=(43/3)/(43/3+38/3)=43/81이다.\n\n2단계: 사후확률이 p일 때 H 선언의 손실은 4(1−p), 부정 선언은 p이다. H 선언의 임계값은 p>4/5이다. 현재 p=43/81이므로 검사 없이 부정 선언하며 위험은 43/81이다.\n\n3단계: T가 양성이면 사후확률은 (43×9)/(43×9+38)=387/425>4/5이므로 H를 선언한다. T가 음성이면 43/(43+38×9)=43/385\u003c4/5이므로 부정 선언한다.\n\n4단계: 검사 후 오류 손실을 현재 조건부 분포에서 합치면 거짓 양성 기여 4×(38/81)(1/10), 거짓 음성 기여 (43/81)(1/10)이다. 합은 13/54이다. 따라서 검사비 전 위험 감소는 43/81−13/54=47/162이다.\n\n5단계: 총위험은 c+13/54이므로 c\u003c47/162일 때만 엄격하게 더 작다. 경계에서는 두 행동이 무차별하다.","wrongOptionExplanations":["정답이다. 명시된 확률 모형과 최적화 조건을 모두 만족한다.","고장이 없다고 잘못 가정한 독립 감지기 모형의 사후확률이다. 공통 고장은 두 양성을 동시에 만들어 양성의 증거력을 낮춘다.","현재 조건은 이미 11 관측 집단이다. 장비 고장확률 등을 검사 가치에 다시 곱할 근거가 없다.","13/54은 검사 후의 잔여 오류 위험이다. 지불 가능한 검사비는 검사 전 위험과 검사 후 위험의 차이다.","검사 후 오류가 완전히 사라진다고 가정한 값이다. T도 10%의 오류가 있어 잔여 위험이 남는다."],"sourceReferences":[{"title":"Information Theory — MIT OpenCourseWare, lecture notes","url":"https://ocw.mit.edu/courses/6-441-information-theory-spring-2016/pages/lecture-notes/","note":"확률적 추론과 이진 가설검정 원리를 공식 대학원 강의 자료로 확인했다. 고장 모형과 비용 수치는 독자적으로 설정했다."}],"verified":true,"estimatedDifficulty":"최상위권 대학원 수준의 다단계 확률·정보 추론","verification":{"method":"독립 Python 검산: 정확분수·전수 열거·모멘트 방정식·오목 최적화 및 지문 길이/스키마 점검","result":"posterior=43/81; test value=47/162; residual risk=13/54"},"questionId":10},{"localId":"M-8","category":"수학","difficulty":5,"questionText":"한 점에 세 개의 방향 있는 원을 붙여 만든 공간을 출발점으로 삼고, 세 원의 방향 있는 폐곡선을 각각 a,b,c라 한다. 여기에 네 개의 2차원 원판을 붙여 유한 CW 복합체 X를 만든다. 각 원판 경계의 부착사상은 다음 네 단어로 지정한다.\n\\[a^4b^6,\\qquad a^2b^8,\\qquad c^3[a,b],\\qquad a^6b^{14}c^3.\\]\n여기서 \\([a,b]=aba^{-1}b^{-1}\\)이며, 양의 지수는 정해진 방향으로 그 원을 도는 횟수, 음의 지수는 반대 방향으로 도는 횟수를 뜻한다. 3차원 이상의 셀은 붙이지 않는다.\n\n계수는 정수이고, \\(H_1(X;\\mathbb Z)\\), \\(H_2(X;\\mathbb Z)\\)를 아벨군의 동형류로 구한다. 원판을 붙였다는 사실만으로 두 번째 호몰로지가 0이 되는 것은 아니며, 서로 다른 원판들의 정수 선형결합이 경계가 없는 2차원 사슬을 만들 수 있다. 반대로 부착 단어의 교환자 부분은 기본군에는 영향을 주지만 1차원 셀 경계의 지수합에는 기여하지 않는다.\n\n이 문제의 보기에서 \\(\\mathbb Z/m\\)은 정수의 m을 법으로 한 순환군을, \\(\\mathbb Z\\)는 무한순환군을 나타낸다. 두 군의 자유계수만 비교하지 말고, 유한 위수 원소들이 이루는 부분군까지 구별해야 한다. 또한 계수체를 유리수나 유한체로 바꾸면 정수 호몰로지의 꼬임 정보가 사라질 수 있다. 주어진 셀 구조를 그대로 사용했을 때 올바른 순서쌍 \\((H_1,H_2)\\)는 무엇인가?","options":["(ℤ/60, ℤ)","(ℤ/2 ⊕ ℤ/30, 0)","(ℤ/2 ⊕ ℤ/10, ℤ)","(ℤ ⊕ ℤ/30, ℤ²)","(ℤ/2 ⊕ ℤ/30, ℤ)"],"correctAnswer":4,"detailedExplanation":"① 세 1차원 셀의 양 끝은 같은 0차원 셀이므로 \\(\\partial_1=0\\). 2차원 경계는 부착 단어에서 각 글자의 지수합이다. 교환자는 각 지수합이 0이므로\n\\[\\partial_2=\\begin{pmatrix}4&2&0&6\\\\6&8&0&14\\\\0&0&3&3\\end{pmatrix}.\\]\n네 번째 열은 첫 세 열의 합이다. 첫 세 열의 행렬식은 \\((4\\cdot8-2\\cdot6)\\cdot3=60\\ne0\\)이므로 계수는 3이다.\n\n② \\(C_2\\cong\\mathbb Z^4\\)에서 경계가 0인 관계는 정확히 \\((-1,-1,-1,1)\\)의 정수배이다. 3차원 셀이 없으므로 이 관계는 더 높은 경계로 사라지지 않아 \\(H_2\\cong\\mathbb Z\\)이다.\n\n③ 첫 세 열의 몫을 생각하면 a,b 부분의 2×2 행렬은 성분 최대공약수 2, 행렬식 20이므로 불변인자가 2와 10이다. c 부분은 독립적으로 \\(\\mathbb Z/3\\)을 준다. 따라서 \\(H_1\\cong\\mathbb Z/2\\oplus\\mathbb Z/10\\oplus\\mathbb Z/3\\).\n\n④ 10과 3은 서로소이므로 중국인의 나머지 정리에 의해 마지막 두 항의 합은 \\(\\mathbb Z/30\\)과 동형이다. 답은 \\((\\mathbb Z/2\\oplus\\mathbb Z/30,\\mathbb Z)\\). 전체 경계행렬의 소행렬식 최대공약수도 1,2,60이므로 스미스 불변인자는 1,2,30이다. 검증 코드는 이 세 최대공약수를 모든 소행렬식에서 직접 계산했다.","wrongOptionExplanations":["유한군의 크기가 60이라고 해서 반드시 순환군은 아닙니다. 실제 군에는 독립인 2차 꼬임 성분이 두 개 있습니다.","네 번째 2셀 경계가 첫 세 경계의 합이므로 비자명한 2차원 순환이 하나 남습니다.","c에 대한 세 번 감기는 부착 조건이 만드는 ℤ/3 성분을 누락했습니다.","경계행렬의 계수가 3이므로 H₁의 자유부분은 없고 H₂의 자유계수는 4−3=1입니다.","위 풀이와 일치합니다."],"sourceReferences":[{"title":"Allen Hatcher, Algebraic Topology, Chapter 2","url":"https://pi.math.cornell.edu/~hatcher/AT/AT.pdf","note":"셀 호몰로지 및 부착사상의 경계 계산 참고. 네 부착 단어는 독자 구성."}],"verified":true,"estimatedDifficulty":"대학 수학 심화 · 5단계","verification":{"method":"모든 1·2·3차 소행렬식의 gcd로 불변인자 검증; 열 관계로 H2 계수 확인","result":"PASS: 독립 Python 정확 계산 및 구조·분량 검사 통과. 계산값 (1, 2, 30, 1)","expected":"(1, 2, 30, 1)","correctOption":"(ℤ/2 ⊕ ℤ/30, ℤ)"},"questionId":11},{"localId":"M-7","category":"수학","difficulty":5,"questionText":"길이가 \\(L=e^\\pi-1\\)인 구간에서 실수 매개변수 \\(\\lambda\\)와 영함수가 아닌 실함수 \\(y\\in C^2([0,L])\\)를 찾는다. 함수는 구간 내부에서 다음 미분방정식과 양 끝점의 서로 다른 종류의 경계조건을 만족해야 한다.\n\\[-\\frac{d}{dx}\\bigl((1+x)^2y'(x)\\bigr)=\\lambda y(x),\\qquad y(0)=0,\\qquad y'(L)+\\frac{y(L)}{2(1+L)}=0.\\]\n추가로 내부의 지정된 점 \\(x_*=e^{2\\pi/5}-1\\)에서 \\(y(x_*)=0\\)이어야 한다. 이 내부 조건은 새로운 구간의 끝점 조건을 별도로 적용한다는 뜻이 아니라, 위의 같은 함수가 그 점에서도 0이 된다는 뜻이다.\n\n모든 조건을 만족하는 실수 \\(\\lambda\\)들을 중복 없이 작은 순서로 나열한다. 하나의 \\(\\lambda\\)에 대해 상수배가 서로 다른 해들이 존재해도 \\(\\lambda\\)는 한 번만 센다. 이 목록에서 두 번째 값을 묻는다. 미분방정식의 계수 \\((1+x)^2\\) 때문에 사인함수의 주파수만 보고 바로 답할 수는 없으며, 변수변환에서 도함수에 생기는 항과 오른쪽 경계조건의 변화를 함께 추적해야 한다.\n\n특히 내부 영점 조건을 적용하기 전의 전체 스펙트럼에서 두 번째 값을 고르는 것과, 내부 영점 조건을 적용하여 남은 스펙트럼에서 두 번째 값을 고르는 것은 다른 문제이다. 또한 진동하지 않는 지수형 해가 목록의 앞부분에 끼어들 가능성도 검토해야 한다. 이 정의에 따른 두 번째 \\(\\lambda\\)의 정확한 값은 얼마인가?","options":["13/2","25/4","113/2","225/4","57/2"],"correctAnswer":2,"detailedExplanation":"① \\(t=\\log(1+x)\\), \\(u(t)=y(e^t-1)\\)로 놓으면 t 구간은 [0,π]이다. \\(y'=e^{-t}u'\\)이고 \\(((1+x)^2y')'=u''+u'\\)이므로 \\(-u''-u'=\\lambda u\\)이다.\n\n② \\(u=e^{-t/2}v\\)를 대입하면 \\(-v''+v/4=\\lambda v\\)가 된다. 왼쪽 경계는 v(0)=0이고 오른쪽 경계는 \\(e^{-\\pi}(u'(\\pi)+u(\\pi)/2)=0\\), 곧 v'(π)=0이다. 내부 조건은 v(2π/5)=0이다.\n\n③ 부분적분으로 \\(\\int_0^\\pi(v')^2=(\\lambda-1/4)\\int_0^\\pi v^2\\)이다. 비영함수에 대해 좌변은 양수이므로 \\(\\lambda>1/4\\). 따라서 \\(k=\\sqrt{\\lambda-1/4}>0\\)로 두고 v=C sin(kt)로 쓸 수 있다. v'(π)=0에서 \\(k=n+1/2\\), n≥0이다.\n\n④ 내부 조건은 \\(2k/5=m\\)이 양의 정수라는 뜻이다. \\(2n+1=5m\\)이므로 m은 홀수이다. 따라서 허용되는 k는 \\(5/2,15/2,25/2,\\ldots\\)이고 두 번째는 15/2이다. \\(\\lambda=(15/2)^2+1/4=226/4=113/2\\). Fraction 검증은 반정수 주파수들을 열거하고 내부 조건을 정확한 유리수 나눗셈으로 검사했다.","wrongOptionExplanations":["이는 첫 번째 허용 주파수 5/2에서 얻는 첫 번째 λ입니다.","첫 번째 허용 주파수를 제곱했지만 변수변환에서 생기는 1/4을 더하지 않았습니다.","위 풀이와 일치합니다.","두 번째 허용 주파수 15/2의 제곱이며, 1/4의 퍼텐셜 보정을 빠뜨렸습니다.","내부 영점 조건을 전체 반정수 주파수 조건과 동시에 적용해야 합니다."],"sourceReferences":[{"title":"NIST DLMF §1.13 Differential Equations","url":"https://dlmf.nist.gov/1.13","note":"Sturm–Liouville 문제와 정규형 변환 참고. 본 미분방정식은 직접 변환해 풀이."}],"verified":true,"estimatedDifficulty":"대학 수학 심화 · 5단계","verification":{"method":"반정수 주파수에서 2k/5가 정수인 항을 정확 열거","result":"PASS: 독립 Python 정확 계산 및 구조·분량 검사 통과. 계산값 113/2","expected":"113/2","correctOption":"113/2"},"questionId":12},{"localId":"physics-04","category":"물리학","difficulty":5,"questionText":"반지름 \\(R=0.200\\,\\mathrm m\\)인 수직 원통형 용기에 서로 섞이지 않는 비압축성 유체 두 층이 담겨 있다. 위층 밀도는 \\(\\rho_1=1000\\,\\mathrm{kg\\,m^{-3}}\\), 아래층은 \\(\\rho_2=2000\\,\\mathrm{kg\\,m^{-3}}\\)이다. 각 층 부피는 고정되어 있고, 원통 밑면적으로 나눈 평균 깊이는 각각 \\(h_1=0.100\\,\\mathrm m\\), \\(h_2=0.200\\,\\mathrm m\\)이다. 바닥은 z=0, 아래쪽 중력가속도는 \\(g=10.0\\,\\mathrm{m\\,s^{-2}}\\)이다. 자유표면은 일정한 대기압에 노출되며 원통은 넘치지 않을 만큼 높다.\n\n점성, 표면장력, 압축성은 무시하고 계면에서는 압력만 연속이다. 벽과 계면의 접선 미끄럼을 허용한 축대칭 정상 오일러 해의 계열을 고려한다. 위층은 각속도 \\(\\Omega\\), 아래층은 \\(\\sqrt3\\Omega\\)로 각각 강체 회전하며 반경 및 수직 유속은 0이다. 비축대칭 섭동의 동적 안정성은 판단 대상에서 제외한다. \\(\\Omega=0\\)에서 출발한 이 정상해 계열에서 Ω를 높여 가며 각 층이 모든 반경에서 양의 두께를 갖는 범위를 찾는다. 처음으로 한 층의 두께가 어느 위치에서 0에 접근하는 경계 각속도를 \\(\\Omega_*\\)라 한다. 그 경계에서 바닥 중심의 대기압 대비 압력을 \\(p_c\\)라 할 때 \\((\\Omega_*,p_c)\\)는 어느 것인가? 아래층의 중심 노출과 위층의 벽면 소실 조건을 모두 비교해야 하며, 경계값은 정상해의 연속적인 극한으로 정의한다.","options":["\\((5.00\\,\\mathrm{s^{-1}},3500\\,\\mathrm{Pa})\\)","\\((\\sqrt{40}\\,\\mathrm{s^{-1}},2600\\,\\mathrm{Pa})\\)","\\((5.00\\,\\mathrm{s^{-1}},5000\\,\\mathrm{Pa})\\)","\\((10.0\\,\\mathrm{s^{-1}},1000\\,\\mathrm{Pa})\\)","\\((\\sqrt{20}\\,\\mathrm{s^{-1}},3800\\,\\mathrm{Pa})\\)"],"correctAnswer":0,"detailedExplanation":"1. 정상 오일러 식은 층별로 \\(\\partial_rp=\\rho\\Omega_i^2r,\\partial_zp=-\\rho g\\)이다. 자유표면 f(r)는 등압면이어서 \\(f'=\\Omega^2r/g\\)이다.\n\n2. 계면 s(r)의 압력 연속을 접선 방향으로 미분하면 \\(\\rho_1(\\Omega^2r-gs')=\\rho_2(3\\Omega^2r-gs')\\)이다. 따라서 \\(s'=(3\\rho_2-\\rho_1)\\Omega^2r/[(\\rho_2-\\rho_1)g]=5\\Omega^2r/g\\)이다.\n\n3. 원판 평균 \\(\\langle r^2\\rangle=R^2/2\\)와 두 부피 조건으로\n\\(f=h_1+h_2+\\Omega^2(r^2-R^2/2)/(2g)\\),\n\\(s=h_2+5\\Omega^2(r^2-R^2/2)/(2g)\\)이다.\n아래층 최소는 중심의 \\(s(0)=h_2-5\\Omega^2R^2/(4g)\\), 위층 최소는 벽의 \\(f(R)-s(R)=h_1-\\Omega^2R^2/g\\)이다.\n\n4. 두 접촉 후보는 각각 \\(\\Omega^2=4gh_2/(5R^2)=40\\,\\mathrm{s^{-2}}\\), \\(\\Omega^2=gh_1/R^2=25\\,\\mathrm{s^{-2}}\\)이다. 먼저 위층이 벽에서 소실하므로 \\(\\Omega_*=5\\,\\mathrm{s^{-1}}\\)이다.\n\n5. 그때 \\(f(0)=0.300-25(0.0400)/40=0.275\\) m, \\(s(0)=0.200-5(25)(0.0400)/40=0.0750\\) m이다. 수직 압력 적분은 \\(p_c=\\rho_1g[f(0)-s(0)]+\\rho_2gs(0)=2000+1500=3500\\) Pa를 준다.","wrongOptionExplanations":["정답이다. 위층의 벽 소실이 먼저이며 그 극한의 중심 압력은 3500 Pa이다.","아래층 중심 노출의 두 번째 후보를 택했다. 그 전에 위층 벽 두께가 0이 되므로 같은 해의 허용범위를 이미 벗어난다.","회전 중에도 정지 상태의 중심 높이를 사용한 압력이다. 자유표면과 계면의 중심은 모두 내려간다.","두 최소두께 조건을 만족시키지 못한다. 계면 곡률을 자유표면 곡률과 같게 놓을 수 없다.","Ω²=20은 아직 위층의 벽 두께가 0.0200 m 남은 중간 상태이다. 해당 압력을 최초 경계와 혼동했다."],"sourceReferences":[{"title":"MIT OpenCourseWare, Fluid Dynamics 2.06","url":"https://ocw.mit.edu/courses/2-06-fluid-dynamics-spring-2013/","note":"정상 오일러 방정식과 정수압 원리 확인. 다른 회전율 계면과 존재 경계는 직접 유도."}],"verified":true,"estimatedDifficulty":"대학원 입문: 계면 압력·부피 제약·경쟁 접촉 경계의 5단계","verification":{"method":"압력 기울기·두 부피 조건의 4×4 선형식 직접 풀이, 최소두께 근 찾기, 원판/수직 압력 수치적분","result":"omega=5.000000000000/s; f(0)=0.275000000000 m; s(0)=0.075000000000 m; p=3500.000000000 Pa; mean depths=0.100000000000,0.200000000000 m","computedValue":[5,3500],"correctChoiceCount":1,"nearestWrongChoiceDistance":300},"questionId":13},{"localId":"LOG-05","category":"복합 추론·논리·정보이론","difficulty":6,"questionText":"무작위로 배정한 이진 장려 변수 Z와 실제 처치 D, 이진 결과 Y가 있는 무한 모집단을 생각한다. 각 개인은 잠재 처치 D(0),D(1) 및 잠재 결과 Y(0),Y(1)를 가진다. Z는 이 네 잠재 변수 전체와 독립이고, 실제 D=D(Z), 실제 Y=Y(D)이다. 따라서 Z는 D를 통해서만 Y에 영향을 주며 개인별 직접 효과는 없다. 모집단의 어떤 개인도 장려를 받았다는 이유로 처치를 오히려 중단하지 않는다는 단조성 D(1)≥D(0)을 가정한다.\n\n관측 확률을 (D=0,Y=0), (D=0,Y=1), (D=1,Y=0), (D=1,Y=1)의 순서로 나열하면 Z=0에서 (0.42,0.28,0.12,0.18), Z=1에서 (0.18,0.12,0.28,0.42)이다. 이들은 반올림이나 표본오차가 없는 정확한 조건부 확률이고 각 행의 합은 1이다. 서로 다른 Z 집단의 개인을 짝지어 관측한 자료가 아니므로 잠재 결과의 결합분포를 관측표만으로 직접 읽을 수 없다.\n\n여기에 처치가 어떤 개인의 결과도 악화시키지 않는다는 개인별 결과 단조성 Y(1)≥Y(0)을 추가한다. 두 단조성은 별개 가정이며 평균 효과가 음수가 아니라는 약한 조건만으로 대체할 수 없다. 관심 모수는 순응자만의 효과가 아니라 전체 모집단 평균 처치효과 τ=E[Y(1)−Y(0)]이다. 미관측 잠재 결과의 분포에는 위 독립성·배제제약·두 단조성 외의 동질성이나 선형성 가정을 두지 않는다. 예컨대 항상 처치를 받는 사람의 미처치 결과와 끝까지 처치를 받지 않는 사람의 처치 결과는 관측되지 않는다. 이런 미관측량을 가능한 모든 방식으로 채울 때 달성 가능한 τ의 정확한 최소·최대 구간은 무엇인가? 단순히 Wald 비율 하나를 전체 평균 효과로 선언하는 방식은 허용되지 않는다.","options":["[0, 0.44]","[0.08, 0.44]","[0.20, 0.20]","[0.08, 0.20]","[−0.16, 0.44]"],"correctAnswer":1,"detailedExplanation":"1단계: 처치 단조성에 따라 집단은 항상 처치자 A, 순응자 C, 비처치자 N으로 나뉜다. P(A)=P(D=1|Z=0)=0.30, P(N)=P(D=0|Z=1)=0.30, P(C)=0.40이다.\n\n2단계: 항상 처치자의 관측된 처치 결과 평균은 0.18/0.30=0.6이고 비처치자의 미처치 결과 평균은 0.12/0.30=0.4이다. 순응자의 미처치 결과 평균은 (0.28−0.12)/0.40=0.4, 처치 결과 평균은 (0.42−0.18)/0.40=0.6이다. 따라서 순응자 효과 0.2가 전체 효과에 0.40×0.2=0.08을 기여한다.\n\n3단계: 항상 처치자의 미관측 Y(0) 평균을 u, 비처치자의 미관측 Y(1) 평균을 v라 하면 전체 효과는 τ=0.08+0.30(0.6−u)+0.30(v−0.4)이다.\n\n4단계: 결과 단조성 때문에 0≤u≤0.6, 0.4≤v≤1이다. 따라서 최소는 u=0.6,v=0.4에서 0.08, 최대는 u=0,v=1에서 0.08+0.18+0.18=0.44이다.\n\n5단계: 두 끝점은 달성 가능하다. 최소에서는 A와 N의 개인별 결과를 처치 유무와 같게 하고, 최대에서는 A의 Y(0)를 모두 0, N의 Y(1)를 모두 1로 놓는다. 순응자는 (Y(0),Y(1))=(0,0),(0,1),(1,1)의 비율을 0.4,0.2,0.4로 두면 두 결과 평균을 맞춘다. 따라서 구간은 느슨한 외곽 경계가 아니라 정확한 식별 구간이다.","wrongOptionExplanations":["순응자 중 개인별 효과가 1인 비율이 모집단 기준 0.08로 이미 식별된다. 다른 집단의 효과는 결과 단조성 아래 이를 상쇄할 수 없다.","정답이다. 명시된 확률 모형과 최적화 조건을 모두 만족한다.","0.2는 순응자 평균효과이다. 항상 처치자와 비처치자가 전체의 60%여서 전체 평균효과는 점 식별되지 않는다.","전체 평균효과가 순응자 효과보다 클 수 없다는 가정은 없다. A와 N의 미관측 결과를 바꾸면 최대 0.44까지 가능하다.","결과 단조성을 추가하기 전에는 이 구간이 나온다. 추가 가정은 항상 처치자와 비처치자의 평균 효과도 음수가 되지 못하게 한다."],"sourceReferences":[{"title":"MIT 14.387: Instrumental Variables — Causal Effects","url":"https://ocw.mit.edu/courses/14-387-applied-econometrics-mostly-harmless-big-data-fall-2014/02fdeb479fb5683f9d723db7b289a9d0_MIT14_387F14_Causaleffects.pdf","note":"무작위 도구변수·배제제약·처치 단조성과 LATE의 구분을 공식 강의 자료로 확인했다. 전체 효과의 경계는 관측표에서 독자적으로 유도한다."}],"verified":true,"estimatedDifficulty":"최상위권 대학원 수준의 다단계 확률·정보 추론","verification":{"method":"독립 Python 검산: 정확분수·전수 열거·모멘트 방정식·오목 최적화 및 지문 길이/스키마 점검","result":"sharp ATE interval=[2/25,11/25]; all four corners reproduce observed tables"},"questionId":14},{"localId":"BIO-07","category":"생물학","difficulty":6,"questionText":"세포 신호전달계의 활성 수용체 농도 X, 하위 전달체 농도 Y, 억제인자 농도 Z가 다음 무차원 결정론적 식을 따른다. 외부 입력 u는 양의 상수이고 k>0은 조절 이득이다. dX/dt=u−ZX, dY/dt=X−Y, dZ/dt=k(Y−1)Z이다. 모든 초기 농도는 양수이다. Z는 수용체를 제거하며 Y가 기준값 1보다 높으면 증식하고 낮으면 감소한다. 따라서 Z의 증감은 단순히 일정한 생성률과 분해상수의 차이로 주어지지 않는다.\n\n연구자는 양의 평형에서 Y가 입력과 무관하게 1로 돌아온다는 성질만 확인하고, k를 크게 할수록 항상 더 빨리 안정하게 적응한다고 주장한다. 이 주장을 검토하기 위해 k=4로 고정하고 입력 u를 천천히 바꾸되, 각 입력에서 평형의 선형 국소 안정성만 조사한다. 평형의 존재와 안정성은 구분하며, 선형화에서 실수부가 0인 고유값이 나타나는 경계는 점근 안정으로 세지 않는다. 변수들은 어떤 인산화 상태의 절대 농도가 아니라 주어진 모형의 연속 상태량이며 총량 보존 제약은 없다. u=2와 u=4에서의 안정성, 두 영역을 가르는 양의 입력 u_c 및 경계의 순허수 고유값 크기 ω_c를 올바르게 나열한 것은?","options":["두 입력 모두 점근 안정; 경계 없음","u=2 점근 안정, u=4 불안정; u_c=3, ω_c=√3","u=2 불안정, u=4 점근 안정; u_c=4, ω_c=2","u=2 불안정, u=4 점근 안정; u_c=3, ω_c=3","u=2 불안정, u=4 점근 안정; u_c=3, ω_c=√3"],"correctAnswer":4,"detailedExplanation":"1단계: 양의 평형에서는 dZ/dt=0과 Z>0이므로 Y*=1이다. dY/dt=0에서 X*=1이고 dX/dt=0에서 Z*=u이다. 정상상태 출력은 완전 적응하지만 안정성이 자동으로 따라오지는 않는다.\n\n2단계: 평형에서 야코비안은 J=[[-u,0,−1],[1,−1,0],[0,ku,0]]이다. 각 편미분은 X 제거항 −ZX와 Z의 곱셈형 조절항에서 나온다. 특성다항식은 λ³+(u+1)λ²+uλ+ku이다.\n\n3단계: 양의 계수를 가진 삼차식 λ³+aλ²+bλ+c의 모든 근이 음의 실수부를 가지려면 Routh–Hurwitz 조건 ab>c가 필요충분하다. 여기서는 (u+1)u>ku, 즉 k\u003cu+1이다. k=4이면 u>3에서만 점근 안정이다. 따라서 u=2는 불안정, u=4는 안정이다.\n\n4단계: 경계 u=3에서는 다항식이 λ³+4λ²+3λ+12=(λ+4)(λ²+3)으로 인수분해된다. 고유값은 −4와 ±i√3이므로 ω_c=√3이다. 이 계산은 선형 안정 경계를 정할 뿐 비선형 주기궤도의 방향까지 주장하지 않는다.","wrongOptionExplanations":["평형의 입력 독립성은 평형 주변 복귀를 보장하지 않는다. 특성다항식의 Routh 조건을 추가로 확인해야 한다.","안정성 부등식의 방향을 뒤집었다. 이 모형에서는 이득 k가 너무 크면 적응 피드백이 불안정해진다.","경계를 k=u로 잘못 놓았다. 전달체의 이완항 −Y 때문에 λ² 계수는 u+1이다.","경계에서 허수 주파수의 제곱이 u이다. ω_c²=3이므로 ω_c=√3이다.","정답이다. 단계별 모형 해석과 수치 검산을 모두 만족한다."],"sourceReferences":[{"title":"Robust perfect adaptation in bacterial chemotaxis through integral feedback control","url":"https://www.pnas.org/doi/10.1073/pnas.97.9.4649","note":"적분 피드백과 완전 적응의 연결을 확인했다. 본문의 세 변수 방정식은 검산 가능한 독자적 모형이다."}],"verified":true,"estimatedDifficulty":"최상위권 대학원 수준의 다단계 모형 추론","verification":{"method":"독립 Python 검산: 정확분수·전수 열거·모멘트 방정식·오목 최적화 및 지문 길이/스키마 점검","result":"u=2 unstable; u=4 stable; boundary u=3, omega=1.732050807569"},"questionId":15},{"localId":"M-9","category":"수학","difficulty":6,"questionText":"고전적인 참·거짓 두 값의 명제논리에서 63개의 명제 \\(p_0,p_1,\\ldots,p_{62}\\)를 생각한다. 첨자는 모두 63을 법으로 읽는다. 기호 \\(\\oplus\\)는 배타적 논리합으로, 두 진릿값이 다를 때만 참이며, 세 항의 배타적 논리합은 참인 항의 개수가 홀수일 때 참이다. 다음 63개 제약식을 동시에 만족하는 진릿값 배정을 찾는다.\n\\[p_i\\oplus p_{i+1}\\oplus p_{i+6}=\\mathrm{거짓}\\qquad(0\\le i\u003c63).\\]\n특히 끝부분의 제약식에는 처음의 명제들이 다시 나타나므로, 처음 여섯 진릿값으로 점화식을 진행한 뒤 마지막 경계 일치 조건을 확인해야 한다.\n\n추가로 \\(p_0\\)는 참, \\(p_1\\)은 거짓이어야 하며, 63개 명제 전체에서 참인 명제의 개수는 정확히 32개여야 한다. 첨자가 붙은 명제는 모두 서로 구별된다. 따라서 배정 하나를 순환이동하여 다른 배정을 얻으면, 두 배정이 우연히 좌표마다 같지 않은 한 서로 다른 것으로 센다. 명제 이름을 바꾸는 동형이나 회전에 의한 몫은 취하지 않는다.\n\n진릿값을 \\(0,1\\in\\mathbb F_2\\)로 표현하면 제약식은 선형이지만, 정확히 32개가 참이라는 조건은 일반적으로 선형조건이 아니다. 그러므로 선형계의 차원만 구한 뒤 나머지 조건이 독립이라고 가정해서는 안 된다. 점화식의 주기와 모든 비영 배정의 참 개수 구조를 함께 분석했을 때, 모든 조건을 만족하는 배정은 정확히 몇 개인가?","options":["32","16","24","31","8"],"correctAnswer":1,"detailedExplanation":"① 참을 1, 거짓을 0으로 쓰면 \\(a_{i+6}=a_i+a_{i+1}\\)이다. 여섯 초기값은 이후를 유일하게 결정한다. 특성다항식은 \\(f(X)=X^6+X+1\\)이다.\n\n② \\(\\gcd(f,X^4+X)=\\gcd(f,X^8+X)=1\\)이다. 실제로 차수 1 인자는 없고, 차수 2의 유일한 기약다항식 \\(X^2+X+1\\)로 나눈 나머지는 X, 차수 3의 두 기약다항식 \\(X^3+X+1\\), \\(X^3+X^2+1\\)로 나눈 나머지는 각각 \\(X^2+X\\), \\(X^2+1\\)이다. 따라서 차수 6 다항식의 가능한 1·2·3차 인자가 모두 없어 f는 기약이다.\n\n③ \\(\\alpha=X\\bmod f\\)를 \\(\\mathbb F_{64}\\)의 원소로 보면 반복 제곱 계산으로 \\(\\alpha^{63}=1\\), \\(\\alpha^{21}\\ne1\\), \\(\\alpha^9\\ne1\\)이다. 63의 소인수는 3,7뿐이므로 α의 위수는 63이다. 비영 상태벡터 63개는 이 선형 점화식의 한 순환을 이룬다. 따라서 어떤 초기 여섯 값도 63번 후 돌아와 경계 조건을 만족한다.\n\n④ 비영 배정에서 연속 여섯 값으로 만든 상태는 0이 아닌 모든 6비트 벡터를 한 번씩 지난다. 첫 좌표가 1인 상태는 \\(2^5=32\\)개이므로 모든 비영 배정의 참 개수는 정확히 32이다. p₀=1,p₁=0이면 영배정은 이미 배제되고 나머지 네 초기값이 자유이므로 \\(2^4=16\\)개이다. Python 검증은 64개 초기값을 모두 진행하여 순환 경계와 참 개수를 직접 확인했다.","wrongOptionExplanations":["p₀만 고정하면 32개이지만 p₁=거짓이라는 추가 독립 조건도 적용해야 합니다.","위 풀이와 일치합니다.","정확히 32개의 참 조건을 독립적인 확률 사건으로 처리할 수 없습니다.","63개의 순환이동을 짝지어 나누어서는 안 되며, 명제 첨자가 고정되어 있습니다.","p₀와 p₁ 외에 실제로 독립이지 않은 제약을 하나 더 부과한 값입니다."],"sourceReferences":[{"title":"MIT Algebra II, Lecture 26: Finite Fields","url":"https://ocw.mit.edu/courses/res-18-012-algebra-ii-student-notes-spring-2022/resources/mit18_702s22_lect26/","note":"유한체의 곱셈군과 기약다항식 참고. 명제 제약식은 독자 구성."}],"verified":true,"estimatedDifficulty":"대학 수학 심화 · 6단계","verification":{"method":"초기 6비트 64개를 전수 열거해 63주기 경계와 해밍 무게 확인","result":"PASS: 독립 Python 정확 계산 및 구조·분량 검사 통과. 계산값 16","expected":"16","correctOption":"16"},"questionId":16},{"localId":"BIO-03","category":"생물학","difficulty":6,"questionText":"무한히 큰 반수체 집단에서 두 좌위 A/a와 B/b를 추적한다. 세대 시작 시 네 일배체형 AB, Ab, aB, ab의 빈도는 각각 2/5, 1/10, 1/10, 2/5이다. 한 세대의 생활사는 생존 선택, 무작위 접합과 감수분열에 의한 재조합, 외부 집단과의 혼합 순서로 진행된다. 생존 선택 단계의 상대 적합도는 AB와 ab가 2이고 Ab와 aB가 1이다. 선택 직후 생존자 빈도를 합이 1이 되도록 정규화한다.\n\n접합은 무작위이고 두 좌위 사이의 재조합률은 1/5이다. 선택 직후의 연관불평형을 D_s=x_AB x_ab−x_Ab x_aB로 정의하면 재조합 단계는 AB와 ab에서 각각 rD_s만큼을 빼고 Ab와 aB에 각각 같은 양을 더한다. 그 뒤 최종 집단의 1/4을 오직 Ab만 가진 외부 집단으로 대체한다. 이주는 빈도 혼합이며 선택이나 접합이 한 차례 더 일어나는 과정이 아니다. 돌연변이와 표본오차는 없다. 최종 집단에서 A의 주변빈도와 연관불평형 D=x_AB−p_A p_B를 함께 구한 것으로 옳은 것은? 단순히 재조합 뒤의 D에 3/4를 곱하는 방식은 외부 집단과 주민 집단의 주변빈도 차이를 별도로 검토해야 한다.","options":["p_A=1/2, D=67/960","p_A=5/8, D=7/80","p_A=3/8, D=−67/960","p_A=5/8, D=7/60","p_A=5/8, D=67/960"],"correctAnswer":4,"detailedExplanation":"1단계: 평균 적합도는 2×(4/5)+1×(1/5)=9/5이다. 선택 뒤 빈도는 (4/9,1/18,1/18,4/9)이다.\n\n2단계: D_s=(4/9)²−(1/18)²=7/36이다. 따라서 rD_s=7/180이고 재조합 뒤 빈도는 (73,17,17,73)/180이다. 각 주변빈도는 여전히 1/2이다.\n\n3단계: 주민 비중이 3/4이고 이주자는 전부 Ab이므로 혼합 뒤 빈도는 (73,77,17,73)/240이다. 이주자와 주민의 혼합에서 Ab에만 추가 1/4이 들어간다.\n\n4단계: p_A=(73+77)/240=5/8, p_B=(73+17)/240=3/8이다. 따라서 D=73/240−(5/8)(3/8)=67/960이다. 교차곱 정의로도 (73×73−77×17)/240²=67/960이 나온다. 두 정의의 일치는 정규화와 생활사 순서를 검산한다.","wrongOptionExplanations":["재조합이 주변빈도를 보존한다는 사실을 이주 단계까지 확장했다. Ab만 유입되므로 A는 늘고 B는 줄어든다.","생존 선택을 생략하거나 혼합 단계의 분모를 잘못 정한 값이다. 선택은 먼저 네 일배체형을 재가중한다.","A와 B를 바꾸면 주변빈도는 달라지지만 D의 부호는 바뀌지 않는다. 실제 D는 양수이다.","재조합 뒤 D=(1−1/5)×7/36=7/45에 주민 비중 3/4만 곱한 값이다. 혼합으로 생기는 주변빈도 차이 항을 빠뜨렸다.","정답이다. 상세 해설의 상태 합산과 조건부 계산을 모두 만족한다."],"sourceReferences":[{"title":"Limits to the relationship among recombination, disequilibrium and epistasis in two-locus models","url":"https://pubmed.ncbi.nlm.nih.gov/3710143/","note":"선택·재조합·상위성의 이좌위 모형을 다루는 원논문. 문제의 갱신식과 생활사는 본문에서 명시했다."}],"verified":true,"estimatedDifficulty":"최상위권 대학원 수준의 다단계 모형 추론","verification":{"method":"독립 Python 검산: 정확분수·전수 열거·모멘트 방정식·오목 최적화 및 지문 길이/스키마 점검","result":"final=[Fraction(73, 240), Fraction(77, 240), Fraction(17, 240), Fraction(73, 240)]; pA=5/8; D=67/960"},"questionId":17},{"localId":"physics-10","category":"물리학","difficulty":6,"questionText":"평면파가 무한히 넓고 평행한 두 유전체 박막을 차례로 통과한다. 입사 반공간과 출사 반공간은 모두 진공이고 첫 박막의 굴절률은 \\(n_1=\\sqrt2\\), 둘째는 \\(n_2=\\sqrt5\\)이다. 모든 매질은 선형·등방·무손실·비자성이며 선택한 단색 주파수 \\(\\omega\\)에서 굴절률은 이 값으로 정확히 일정하다. 경계에 자유 표면전하나 자유 표면전류는 없다. 진공 파수는 \\(k_0=\\omega/c\\), 진공 입사각은 법선에 대해 \\(\\theta_0=\\pi/4\\)이다. 전기장은 입사면에 수직인 TE 편광이며 진공→첫 박막→둘째 박막→진공 순으로 진행한다.\n\n박막 두께 \\(d_1,d_2>0\\)는 \\(k_0n_1d_1\\cos\\theta_1=\\pi/2\\), \\(k_0n_2d_2\\cos\\theta_2=\\pi/4\\)를 만족한다. 내부 각은 스넬 법칙 \\(n_j\\sin\\theta_j=\\sin\\theta_0\\)로 정하며, 두께 조건은 경계 법선 방향의 위상이다. 모든 다중 반사는 위상이 유지된 채 합산되고 산란·흡수·주파수 평균은 없다. 정상상태에서 전체 입사 평균 포인팅 벡터의 법선 성분에 대한 최종 진공 출사파 평균 포인팅 벡터 법선 성분의 비 T는 얼마인가? 전기장 진폭비의 제곱과 에너지 투과율의 관계를 확인하고, 중간 매질의 경계 어드미턴스를 TE 편광에 맞게 사용하여 정확한 값으로 고르시오. 첫 층이 4분의 1 파장 위상을 갖는다는 이유만으로 뒤의 층을 무시하거나 완전 반사방지 조건을 가정할 수 없다.","options":["\\(3/4\\)","\\(16/25\\)","\\(8/9\\)","\\(1\\)","\\(1/4\\)"],"correctAnswer":0,"detailedExplanation":"1. 공통 진공 상수를 제외한 TE 어드미턴스는 \\(y_j=n_j\\cos\\theta_j=\\sqrt{n_j^2-\\sin^2\\theta_0}\\)이다. 입사 진공의 값으로 나누면 \\(y_0=y_3=1,y_1=\\sqrt3,y_2=3\\)이다.\n\n2. 어드미턴스 y, 법선 위상 δ인 층이 부하 Y를 볼 때 접선 E,H 연속과 전후파의 위상으로부터 \\(Y_{\\rm in}=y(Y+iy\\tan\\delta)/(y+iY\\tan\\delta)\\)이다. 시간 위상 관례를 뒤집으면 복소켤레가 되지만 반사율은 같다.\n\n3. 둘째 층은 δ₂=π/4, 부하 1이므로 \\(Y_2=3(1+3i)/(3+i)=9/5+12i/5\\)이다. 첫 층 δ₁=π/2의 한계에서는 \\(Y_{\\rm all}=y_1^2/Y_2=3/(9/5+12i/5)=3/5-4i/5\\)이다.\n\n4. 반사계수는 \\(r=(1-Y_{\\rm all})/(1+Y_{\\rm all})\\)이다. 따라서 \\(R=|r|^2=[(2/5)^2+(4/5)^2]/[(8/5)^2+(4/5)^2]=(20/25)/(80/25)=1/4\\)이다.\n\n5. 무손실 에너지 보존은 T+R=1을 주므로 T=3/4이다. 또한 입출사 반공간의 굴절률과 각도가 같아 포인팅 변환 인자가 같으므로 이 경우 T=|t|²이다.","wrongOptionExplanations":["정답이다. 전체 입력 어드미턴스가 3/5−4i/5여서 R=1/4이다.","단일 경계 계수나 n만을 어드미턴스로 사용한 값이다. TE 경사 입사에는 cosθ가 필요하다.","둘째 층의 π/4 위상을 없애거나 실수 경계만 순차 합산한 값이다. 위상 간섭을 유지해야 한다.","4분의 1 파장 첫 층만 보고 정합을 가정했다. 둘째 층이 복소 입력 어드미턴스를 만든다.","반사율 R=1/4을 투과율로 답했다. 두 값의 합은 1이다."],"sourceReferences":[{"title":"MIT 6.013, Electromagnetics and Applications","url":"https://ocw.mit.edu/courses/6-013-electromagnetics-and-applications-spring-2009/d3be4ea78b036a6362230fb41780cf54_MIT6_013S09_notes.pdf","note":"유전체 경계조건, 전기역학 에너지 및 평면파 전달 법칙 확인. 조건과 계산은 독자 구성."}],"verified":true,"estimatedDifficulty":"대학원: 경사 TE 경계·복소 다층 전달·에너지 흐름의 5단계","verification":{"method":"세 경계의 접선 E,H 연속을 전후파 진폭 6개의 복소 선형 연립식으로 직접 풀이","result":"r=(-1.1102230246251565e-16-0.5j); t=(-0.6123724356957946+0.6123724356957946j); R=0.25000000000000; T=0.75000000000000; R+T=1.00000000000000","computedValue":0.7500000000000001,"correctChoiceCount":1,"nearestWrongChoiceDistance":0.1100000000000001},"questionId":18},{"localId":"R05","category":"희귀 사실","difficulty":6,"questionText":"GFAJ-1 균주가 인산염 대신 비산염을 DNA 골격에 넣는다는 주장을 재검토할 때는 세포 전체에서 검출된 비소와 정제 DNA에 공유결합한 비산염을 구별해야 한다. Reaves 등의 2012년 재실험에서는 인산염 제한 조건의 성장에 비산염이 기여하지 않았고, 풍부한 비산염 아래서 얻어 정제한 DNA도 비산 에스터라면 예상될 자발적 가수분해를 나타내지 않았다. 질량분석에서는 미량의 자유 비산염은 있었으나 공유결합한 비산염은 검출되지 않았다. 아래는 그 실험논리를 사용한 가상 후속 판독이지 새로운 관측 보고가 아니다.\n\n같은 DNA 시료를 세 부분으로 나눈다. P에서는 비소를 포함한 세포 성분 전체의 신호를 읽는다. Q에서는 저분자 자유 이온을 제거한 뒤 DNA를 완전히 효소분해하여 비산염이 결합한 뉴클레오타이드를 찾는다. R에서는 가수분해에 취약한 골격 결합의 존재가 예측하는 시간의존적 DNA 절단을 조사한다. 각 검출법의 양성 대조군은 정상 작동하고 검출한계는 사전에 제시되어 있다. P는 양성, Q는 검출한계 미만, R은 대조 DNA와 구별되지 않는 안정성을 보였다고 하자.\n\n이 결과가 정당화하는 결론을 고를 때, '검출되지 않음'을 정확한 0과 동일시하지 않으면서도 주장에 필요한 화학적 위치와 기능을 모두 평가한 것은?","options":["세포의 비소 신호는 DNA 골격 편입의 증거가 아니지만, R의 안정성만으로 비산 에스터 골격이 입증된다.","세포의 비소 신호는 DNA 골격 편입의 증거가 아니며, Q의 음성은 비산염이 성장을 반드시 촉진함을 뜻한다.","세포의 비소 신호는 DNA 골격 편입의 증거이며, Q의 음성은 기존 DNA의 인산염이 모두 제거되었음을 뜻한다.","세포의 비소 신호는 DNA 골격 편입의 증거이며, 공유결합 비산염은 모든 가능한 농도에서 정확히 0이다.","세포의 비소 신호는 DNA 골격 편입의 증거가 아니며, 검출한계 이상의 안정적 골격 대체는 지지되지 않는다."],"correctAnswer":4,"detailedExplanation":"P는 비소의 존재를 알려줄 뿐 그 위치가 DNA인지, 결합이 공유결합인지 판정하지 못한다. Q의 적절한 정제·분해·양성대조는 검출한계 이상의 공유결합 편입을 시험하고, R은 비산 에스터 골격 가설이 예상하는 불안정성을 별도로 시험한다. Q 음성과 R의 안정성은 함께 대규모 골격 대체 주장을 지지하지 않는다. 다만 측정 한계 아래의 모든 가능성까지 수학적으로 0이라고 확정하지는 않는다. 성장 촉진 여부는 성장실험이 다룰 별도 주장이다. 이 구분은 [Reaves 등의 원연구](https://arxiv.org/abs/1201.6643)와 [최종 출판 DOI](https://doi.org/10.1126/science.1219861)의 성장·정제·가수분해·질량분석 결과에 근거한다.","wrongOptionExplanations":["R의 안정성은 취약한 비산 에스터 골격을 지지하는 방향이 아니다. 가설이 예측하는 절단이 나타나지 않은 것이다.","성장 촉진은 Q가 측정하지 않는 별도 결과다. 실제 원연구도 인산염 제한에서 비산염의 성장 기여를 찾지 못했다.","세포 전체 신호로 DNA 결합을 특정할 수 없고, 비산염 결합 뉴클레오타이드 음성은 인산염 완전 제거를 뜻하지 않는다.","세포 전체 신호를 과잉 해석한 데다 검출한계 미만을 가능한 모든 농도의 정확한 0으로 바꾸었다.","정답. 원소 검출의 위치 특정 한계, 공유결합 검출한계, 독립적 안정성 검증을 모두 유지했다."],"sourceReferences":[{"title":"Reaves et al. (2012), Absence of arsenate in DNA from arsenate-grown GFAJ-1 cells","url":"https://arxiv.org/abs/1201.6643","note":"원연구 v2 초록: 성장 비기여, 예상 자발적 가수분해 부재, 자유 비산염 미량, 공유결합 비산염 미검출."},{"title":"Reaves et al. (2012), Absence of Detectable Arsenate in DNA from Arsenate-Grown GFAJ-1 Cells","url":"https://doi.org/10.1126/science.1219861","note":"Science 최종 출판 원논문. 역사적 주장을 인용하되 그 주장을 사실로 채택하지 않음."}],"verified":true,"estimatedDifficulty":"최상: 원소 검출·공유결합·골격 안정성·성장 기여의 증거 위계를 결합하는 분석화학 추론","verification":{"method":"저자 제출 원논문 v2의 세 독립 결과를 직접 열람하고 최종 출판 초록과 대조했다.","result":"P의 양성만으로 DNA 골격 대체를 추론하는 선택지 배제. 한계 이상의 대체 비지지가 유일한 정답."},"questionId":19},{"localId":"LOG-02","category":"복합 추론·논리·정보이론","difficulty":6,"questionText":"독립적으로 반복되는 한 시행마다 U와 V는 서로 독립인 공정한 비트이고, N은 이들과 독립인 Bernoulli(1/4) 비트이다. 세 단말은 각각 X=U, Y=V, Q=U⊕V⊕N을 관측한다. ⊕는 2를 법으로 한 덧셈이다. 별도의 보조 단말은 N을 지우기 채널로 보낸다. 독립인 공정한 지우기 플래그 E를 뽑아 E=0이면 Z=N을, E=1이면 Z=⊥를 출력한다. ⊥는 0 및 1과 구별되는 기호이며 지우기가 일어났다는 사실은 수신자가 안다. 따라서 Z는 단순히 N에 공정한 잡음을 더한 비트와 다르다. E는 U,V,N 모두와 독립이다.\n\n연구팀은 두 종류의 의존성을 비교한다. 첫째는 Q와 Z를 함께 공개했을 때 X와 Y 사이에 새로 드러나는 조건부 상호정보량 I(X;Y|Q,Z)이다. 둘째는 Q를 공개하지 않고 Z만 공개했을 때의 I(X;Y|Z)이다. 모든 엔트로피는 밑이 2인 로그를 사용한다. 이 두 양의 차이는 원래 X,Y가 독립이라는 사실만으로 결정되지 않으며 조건을 추가할 때 상호정보량이 반드시 감소하는 것도 아니다.\n\n이와 별개로, 매우 긴 독립 시행열에서 X만 관측하는 부호기가 메시지 하나를 보낸다. 복호기는 대응하는 전체 Y열, Q열, Z열을 부가정보로 이미 가진다. 부호기는 그 부가정보를 보지 못하고 수신자로부터 피드백도 받지 않는다. 블록길이를 무한히 늘렸을 때 블록오류확률이 0으로 수렴하도록 허용하되 모든 유한 블록에서의 무오류는 요구하지 않는다. 시행당 평균 이진 전송률의 하한에 임의로 접근할 수 있다. 이때 h₂(p)=−p log₂p−(1−p)log₂(1−p)라 하고, 위 두 상호정보량과 최소 점근 전송률의 하한 R*를 순서대로 나열한 것은?","options":["0, 0, 1","1−h₂(1/4)/2, 0, 1","1−h₂(1/4)/2, 0, h₂(1/4)/2","1−h₂(1/4)/2, 1/2, h₂(1/4)/2","1−h₂(1/4), 0, h₂(1/4)"],"correctAnswer":2,"detailedExplanation":"1단계: Z는 U,V와 독립인 N과 E만의 함수이다. 따라서 Z를 조건으로 해도 X와 Y는 독립 공정 비트이므로 I(X;Y|Z)=0이다.\n\n2단계: Y를 알지 못하면 Q=U⊕V⊕N의 V가 일회용 패드 역할을 한다. 따라서 X는 Q,Z를 알고도 공정하고 H(X|Q,Z)=1이다.\n\n3단계: Y와 Q를 모두 알면 X⊕N=Y⊕Q를 안다. X가 공정하므로 이 관측 자체는 N에 대한 새 정보를 주지 않는다. 따라서 H(X|Y,Q,Z)=H(N|Z)이다. Z가 N을 공개하는 확률은 1/2이므로 H(N|Z)=(1/2)×0+(1/2)h₂(1/4)이다.\n\n4단계: 조건부 상호정보량의 정의 I(X;Y|Q,Z)=H(X|Q,Z)−H(X|Y,Q,Z)를 적용하면 1−h₂(1/4)/2이다. 주변 독립과 조건부 의존은 양립한다.\n\n5단계: 복호기만 부가정보를 가지는 무손실 점근 부호화의 Slepian–Wolf 한계는 H(X|Y,Q,Z)이다. 따라서 R*=h₂(1/4)/2이다. 오류확률이 0으로 수렴한다는 조건이 중요하다. 모든 유한 블록에 대한 무오류를 요구하면 지우기 구간의 잡음이 양쪽 값을 모두 가질 수 있어 별도 문제가 된다.","wrongOptionExplanations":["Q가 주어지면 X와 Y 사이의 패리티 관계가 드러난다. X와 Y의 무조건부 독립만으로 조건부 상호정보량을 0이라고 할 수 없다.","부호기가 부가정보를 몰라도 점근 부호화에서 조건부 엔트로피 한계에 접근할 수 있다. 전송률 1은 유한 블록 무오류 제약과 혼동한 값이다.","정답이다. 명시된 확률 모형과 최적화 조건을 모두 만족한다.","Z는 X와 Y 모두와 독립이므로 Z만으로 양자 사이의 의존성이 생기지 않는다. 두 번째 양은 0이다.","지우기로 N을 정확히 아는 시행이 절반이라는 사실을 빠뜨렸다. 잔여 잡음 엔트로피는 원래 값의 절반이다."],"sourceReferences":[{"title":"MIT 6.441 lecture notes: Slepian–Wolf and information measures","url":"https://ocw.mit.edu/courses/6-441-information-theory-spring-2016/pages/lecture-notes/","note":"조건부 엔트로피, 상호정보량 및 복호기 부가정보를 가진 부호화 정리를 공식 강의 자료로 확인했다."}],"verified":true,"estimatedDifficulty":"최상위권 대학원 수준의 다단계 확률·정보 추론","verification":{"method":"독립 Python 검산: 정확분수·전수 열거·모멘트 방정식·오목 최적화 및 지문 길이/스키마 점검","result":"Icond=0.594360937770; I(X;Y|Z)=0.000000000000; rate=0.405639062230"},"questionId":20},{"localId":"R06","category":"희귀 사실","difficulty":6,"questionText":"히슈카리야나어의 기본 OVS 어순을 한국어식 목적어 선행과 곧바로 동일시하면 문법 분석을 놓치기 쉽다. Kalin의 2014년 연구가 검토하는 중립 타동절에서는 목적어와 동사가 한 구성성분처럼 취급되고 주어는 그 뒤에 온다. 명사는 격·수·한정성의 일반 굴절표지를 갖지 않으며, 타동사의 인칭 접두사는 주어와 목적어의 인칭을 합쳐 표시한다. 그러므로 겉으로 먼저 나온 명사를 주어라고 단정하거나 접두사를 주어 인칭만의 표지로 읽어서는 안 된다.\n\n이 연구에서 증거성 소사 tɨ는 초점화된 구성성분이 없으면 동사 뒤, 별도의 초점화 구가 문두에 있으면 그 구 바로 뒤에 놓인다. 반면 ha는 초점화 여부와 무관하게 동사 뒤에 남는다. 실제 예문에서 초점화되지 않은 '마을로 왔다'는 동사–ha-tɨ–마을로의 순서를 가지며, '마을로'를 초점화하면 [마을로]–tɨ–동사–ha로 두 소사가 분리된다. 여기서 '두 번째 위치'는 음운 단어의 두 번째 자리가 아니라 통사 구성성분을 기준으로 한 자리다.\n\n이제 목적어 O, 동사 V, 주어 S가 모두 발음되는 중립 타동절에 tɨ 하나만 넣은 경우와, 같은 절 앞에 독립적인 초점화 장소구 F를 둔 경우를 비교한다. 다른 이동과 생략은 없다고 할 때, 두 선형 순서와 ha의 예외성이 뒷받침하는 분석을 가장 정확하게 묶은 것은?","options":["OV–tɨ–S / F–OV–tɨ–S · ha까지 모든 소사의 단일 위치규칙으로 묶을 수 없음","O–tɨ–V–S / F–tɨ–OV–S · ha까지 모든 소사의 단일 위치규칙으로 묶을 수 없음","OV–tɨ–S / F–tɨ–OV–S · ha와 tɨ는 모든 환경에서 반드시 붙어 다님","S–tɨ–VO / F–tɨ–SVO · ha와 tɨ는 모든 환경에서 반드시 붙어 다님","OV–tɨ–S / F–tɨ–OV–S · ha까지 모든 소사의 단일 위치규칙으로 묶을 수 없음"],"correctAnswer":4,"detailedExplanation":"중립절에서 tɨ는 첫 통사 단위로 취급되는 OV 뒤에 오므로 OV–tɨ–S가 된다. 문두의 독립 초점구 F가 있으면 tɨ는 F 직후로 옮겨 F–tɨ–OV–S가 된다. ha는 그 환경에서도 V 뒤에 남으므로, 두 소사가 중립절에서 한 덩어리로 나타났다는 사실로 영구적인 결합을 추론할 수 없다. 이 분리는 음운 단어 수보다 구성성분과 각 소사의 고유 분포를 보아야 함을 보여준다. 실제 순서와 예외는 [Kalin 원논문](https://static1.squarespace.com/static/586960e5197aea52834230a2/t/58c4419eb3db2b34ddfcf196/1489256902338/Kalin-Hixkaryana-NLLT.pdf) §2.2–2.3의 예문 (7)–(10), 특히 (10a,b)에 근거한다. 여기서는 명령 소사나 특수 주어 amna를 포함하지 않아 별도 예외와 충돌하지 않는다.","wrongOptionExplanations":["초점구가 문두를 차지한 뒤에도 tɨ를 옛 자리에 두었다. 제시된 초점 예문과 정면으로 어긋난다.","중립절의 O와 V를 갈라 tɨ를 넣었다. 이 문제의 중립 비명령절에서는 OV가 첫 단위로 취급된다.","선형 순서는 맞지만 ha와 tɨ의 불가분성을 주장한 부분이 틀리다. 초점화가 실제로 두 소사를 갈라놓는다.","기본 OVS를 SVO로 바꾸었고, 초점절에서 관찰되는 ha와 tɨ의 분리도 부정했다.","정답. tɨ의 구성성분 기준 위치와 ha의 동사 후행이라는 서로 다른 일반화를 유지했다."],"sourceReferences":[{"title":"Kalin (2014), The syntax of OVS word order in Hixkaryana","url":"https://static1.squarespace.com/static/586960e5197aea52834230a2/t/58c4419eb3db2b34ddfcf196/1489256902338/Kalin-Hixkaryana-NLLT.pdf","note":"저자 공개 원논문. DOI 10.1007/s11049-014-9244-x. §2.1–2.3 및 예문 (10)의 tɨ/ha 분포, 중립 OV 구성성분 확인."}],"verified":true,"estimatedDifficulty":"최상: 기본 어순·통사 구성성분·증거성 소사·예외 소사의 분포를 분리하는 언어학 추론","verification":{"method":"원논문 본문의 중립절·초점절 예문과 §3.1의 OV 구성성분 논증을 직접 대조했다.","result":"중립 OV-tɨ-S, 초점 F-tɨ-OV-S. ha는 동사 뒤에 남으므로 결합 불변성은 거짓."},"questionId":21},{"localId":"LOG-03","category":"복합 추론·논리·정보이론","difficulty":6,"questionText":"시간마다 독립인 채널 상태 S∈{G,B}가 각각 확률 1/2로 발생한다. 입력 X와 출력 Y는 이진 값이다. 좋은 상태 G에서는 Y=X이다. 나쁜 상태 B에서는 입력이 0이면 Y=0이고 입력이 1이면 Y는 공정한 비트이다. 나쁜 상태의 난수는 다른 시점 및 메시지와 독립이다. 수신자는 매 시점의 상태 S와 Y를 모두 정확히 관측한다. 전송 비용은 입력이 1일 때만 1이고, 긴 블록에서 기대 평균 비용은 채널 사용당 1/3 이하이어야 한다. 상태와 무관한 시간 공유 및 긴 확률적 부호화는 허용한다.\n\n두 운용 모드를 비교한다. 모드 N의 송신자는 현재·과거·미래 상태를 전혀 모르며 수신자의 피드백도 받지 않는다. 따라서 한 시점의 입력분포는 상태와 독립이지만 입력의 1 확률 q를 비용 한계 안에서 최적화할 수 있다. 모드 C의 송신자는 현재 상태를 입력 결정 직전에 알고, 과거 상태도 알지만 미래 상태는 모른다. 수신자는 이 모드에서도 전체 상태열을 안다. 상태를 아는 송신자는 P(X=1|S=G)=q_G와 P(X=1|S=B)=q_B를 다르게 선택할 수 있다. 이 두 확률은 각각 0과 1 사이이며 비용 제약은 (q_G+q_B)/2≤1/3이다.\n\n각 모드에서 오류확률을 임의로 작게 하는 점근 메시지 전송률의 상한을 C_N,C_C라 하자. 상태는 자체로 메시지 정보를 포함하지 않고 송신자가 상태의 분포를 조절할 수 없다. 비용을 유리한 상태에만 배정하는 전략이 항상 최적인지도 함께 검토해야 한다. h₂는 이진 엔트로피 함수이다. 두 용량과 모드 C의 최적 입력확률을 올바르게 근사한 것은? 수치 허용오차는 0.0001이며 모든 전송률은 채널 사용당 비트이다.","options":["C_N≈0.65002, C_C≈0.63690; q_G≈0.42549, q_B≈0.24118","C_N≈0.61749, C_C≈0.63690; q_G≈0.42549, q_B≈0.24118","C_N≈0.61749, C_C≈0.91830; q_G=2/3, q_B=0","C_N=C_C≈0.61749; q_G=q_B=1/3","C_N≈0.61749, C_C≈0.45915; q_G=2/3, q_B=0"],"correctAnswer":1,"detailedExplanation":"1단계: 수신자가 상태를 아니 상태별 상호정보량을 평균한다. G에서는 I=h₂(q_G), B에서는 출력 1의 확률이 q_B/2이고 H(Y|X,S=B)=q_B이므로 I=h₂(q_B/2)−q_B이다. 따라서 목적함수는 [h₂(q_G)+h₂(q_B/2)−q_B]/2이다.\n\n2단계: 모드 N에서는 q_G=q_B=q≤1/3이다. 이 함수는 오목하고 q=1/3에서의 도함수는 (1/2)log₂2+(1/4)log₂5−1/2=(1/4)log₂5>0이다. 따라서 제한 구간의 최댓값은 q=1/3에서 나온다. C_N=[h₂(1/3)+h₂(1/6)−1/3]/2≈0.61749246이다.\n\n3단계: 모드 C에서는 비용을 다 쓰는 내부 최적해를 구한다. q_G+q_B=2/3이고 라그랑주 최적조건은 h₂′(q_G)=(1/2)h₂′(q_B/2)−1이다. 이는 좋은 상태와 나쁜 상태에 투입하는 추가 비용의 한계 이득이 같아야 한다는 조건이다.\n\n4단계: h₂′(x)=log₂((1−x)/x)를 넣고 q_B=2/3−q_G를 대입하면 유일한 내부 해 q_G≈0.42548813, q_B≈0.24117854를 얻는다. 오목성이므로 이 해는 전역 최대이다. 대입한 C_C≈0.63689711이다.\n\n5단계: B에 비용을 전혀 쓰지 않는 q_G=2/3,q_B=0은 용량 h₂(2/3)/2≈0.45915에 불과하다. 낮은 q_B에서 나쁜 상태도 비용당 양의 정보 이득을 크게 주기 때문에 전부 좋은 상태에 쓰는 극단 배분은 최적이 아니다.","wrongOptionExplanations":["모드 N에서 출력 엔트로피와 조건부 출력 엔트로피의 차를 정확히 평균하지 않은 값이다. 제시된 값은 모드 C보다 커져 정보 이용 가능성의 포함관계도 위반한다.","정답이다. 명시된 확률 모형과 최적화 조건을 모두 만족한다.","좋은 상태가 절반만 발생한다는 시간 비중을 빠뜨렸다. q_B=0일 때 좋은 상태의 엔트로피를 1/2로 가중해야 한다.","송신자에게 상태정보가 생기면 서로 다른 입력분포를 사용할 수 있다. 엄격한 오목 최적화의 해는 q_G=q_B가 아니다.","모드 C에서 가능한 한 전략의 값이지만 최댓값이 아니다. 비용을 나쁜 상태에 조금 배정하면 상호정보량이 증가한다."],"sourceReferences":[{"title":"MIT 6.441 Information Theory: channel capacity and channel side information","url":"https://ocw.mit.edu/courses/6-441-information-theory-spring-2010/pages/lecture-notes/","note":"채널 용량의 상호정보량 최적화 및 상태 부가정보 원리를 공식 강의 자료로 확인했다. 상태별 전이확률과 비용은 독자적으로 설정했다."}],"verified":true,"estimatedDifficulty":"최상위권 대학원 수준의 다단계 확률·정보 추론","verification":{"method":"독립 Python 검산: 정확분수·전수 열거·모멘트 방정식·오목 최적화 및 지문 길이/스키마 점검","result":"CN=0.617492461185; CC=0.636897113030; qG=0.425488130832; qB=0.241178535834"},"questionId":22},{"localId":"BIO-05","category":"생물학","difficulty":6,"questionText":"세 종 A, B, C에서 각 종당 한 유전자 사본을 뽑아 서로 독립인 여러 좌위의 뿌리 있는 유전자 계통수를 정확히 복원하였다. 유전자 중복, 소실, 재조합 및 복원오차는 없다. 좌위별 역사는 두 종류의 혼합이다. 비율 1−γ인 보통 좌위의 종 계통은 ((A,B),C)이고 내부 가지 길이는 미지의 t>0이다. 비율 γ인 유전자 유입 좌위의 역사적 계통은 ((A,C),B)이고 내부 가지 길이는 ln 2이다. 가지 길이의 단위는 합류 단위이며 두 역사의 선택은 좌위 사이에서 독립이다.\n\n각 역사에서 내부 가지의 자매 계통 두 개가 그 가지 안에서 합류하지 못할 확률은 exp(−길이)이다. 합류에 실패하면 세 조상 계통이 더 오래된 집단에서 대칭이므로 세 쌍이 먼저 합류할 확률은 각각 1/3이다. 전체 좌위에서 AB, AC, BC가 먼저 합류하는 계통의 확률은 각각 76/120, 31/120, 13/120으로 정확히 알려져 있다. 유한 표본의 우연한 빈도 차이로 해석하지 않는다. 비율 γ와 t를 먼저 추론한 뒤, AC 계통을 보인 임의의 한 좌위가 유전자 유입 역사에 속할 조건부확률을 계산하라. 이 세 값을 올바르게 나열한 것은?","options":["γ=1/2, t=ln 4, 조건부확률=4/5","γ=3/10, t=ln 4, 조건부확률=24/31","γ=3/10, t=ln 4, 조건부확률=6/13","γ=3/20, t=ln 2, 조건부확률=12/31","γ=3/10, t=ln 4, 조건부확률=3/10"],"correctAnswer":1,"detailedExplanation":"1단계: 내부 가지 길이가 ℓ일 때 일치 계통 확률은 1−(2/3)e^(−ℓ), 각 불일치 계통 확률은 (1/3)e^(−ℓ)이다. 합류 실패 확률 중 1/3은 우연히 일치 계통을 만들기 때문이다.\n\n2단계: 보통 역사는 AC와 BC를 똑같이 만들지만 유입 역사는 AC를 2/3, BC를 1/6로 만든다. 따라서 P(AC)−P(BC)=γ(2/3−1/6)=γ/2이다. 관측 차이 18/120=3/20에서 γ=3/10을 얻는다.\n\n3단계: BC 확률을 쓰면 13/120=(7/10)e^(−t)/3+(3/10)/6이다. 우변의 유입 기여는 1/20=6/120이므로 e^(−t)=1/4, t=ln 4이다.\n\n4단계: 유입이면서 AC인 결합확률은 (3/10)(2/3)=1/5=24/120이다. 베이즈 정리에 의해 P(유입|AC)=(24/120)/(31/120)=24/31이다. AB 확률도 (7/10)(5/6)+(3/10)(1/6)=76/120으로 재현된다.","wrongOptionExplanations":["AB 확률까지 동시에 재현하지 못한다. 혼합 비율은 AC−BC의 차이로 유일하게 3/10으로 결정된다.","정답이다. 상세 해설의 상태 합산과 조건부 계산을 모두 만족한다.","6/13은 BC를 보았을 때의 유입 사후확률이다. 문제에서 조건으로 주어진 계통은 AC이다.","AC와 BC 차이의 계수는 1이 아니라 1/2이다. 유입 역사에서도 불일치 계통 BC가 생길 수 있다.","사전 유입 비율 γ와 AC를 관측한 뒤의 사후확률은 다르다. AC는 유입 역사에서 훨씬 더 잘 생긴다."],"sourceReferences":[{"title":"Coalescent Histories on Phylogenetic Networks and Detection of Hybridization Despite Incomplete Lineage Sorting","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC3167682/","note":"불완전 계통 분류와 유전자 유입의 혼합을 다루는 원논문. 삼종 합류 확률은 본문의 대칭 조건에서 유도한다."}],"verified":true,"estimatedDifficulty":"최상위권 대학원 수준의 다단계 모형 추론","verification":{"method":"독립 Python 검산: 정확분수·전수 열거·모멘트 방정식·오목 최적화 및 지문 길이/스키마 점검","result":"gamma=3/10; exp(-t)=1/4; posterior=24/31"},"questionId":23},{"localId":"LOG-04","category":"복합 추론·논리·정보이론","difficulty":6,"questionText":"여섯 메시지 A,B,C,D,E,F의 발생확률은 각각 10/36, 8/36, 6/36, 5/36, 4/36, 3/36이다. 매 발생마다 하나의 이진 부호어를 전송하고, 수신자는 앞의 메시지 종료를 안 직후부터 비트를 읽어 현재 메시지를 순간적으로 복호해야 한다. 따라서 여섯 부호어는 서로 접두어가 아닌 집합이어야 한다. 메시지 사이에 구분 기호는 보내지 않으며 전체 시퀀스를 보고 나중에 분해하는 방식도 허용하지 않는다.\n\n통신 규약상 접두부 00으로 시작하는 모든 비트열은 별도의 장치 제어 신호에 예약되어 있어 데이터 부호어에 사용할 수 없다. 예를 들어 00,000,0010은 모두 금지된다. 반면 01,10,11 아래의 가지는 데이터용으로 쓸 수 있다. 각 데이터 부호어 길이는 최소 2, 최대 4이다. 길이 1 부호어는 제어 프레임과 구별할 수 없어 금지되고 길이 5 이상은 지연 제약에 걸린다. 메시지 이름의 순서와 사전식 부호어 순서 사이에는 추가 제약이 없고 같은 길이의 메시지 사이에서 어떤 부호어를 배정해도 된다.\n\n목표는 메시지 하나당 기대 전송 비트 수를 최소화하는 것이다. 규약에 예약된 공간은 부호어 한 개를 추가하는 식으로 확률을 부여하는 것이 아니라 사용 가능한 이진 나무의 한 부분을 제거하는 제약이다. 단순한 무제약 Huffman 부호의 평균길이를 계산한 뒤 제어 비트 하나를 일괄 덧붙이는 방식은 이 문제와 같지 않다. 실제로 가능한 접두부 배치가 있는지도 확인해야 하며, Kraft 합이 작다는 이유만으로 금지 접두부를 자동으로 피한다고 주장해서는 안 된다. 최적 평균길이와 그 길이들을 A부터 F까지 순서대로 나열한 것으로 옳은 것은?","options":["평균 35/12; 길이 (2,3,3,3,4,4)","평균 3; 길이 (2,2,4,4,4,4)","평균 35/12; 길이 (3,2,3,3,4,4)","평균 11/4; 길이 (2,2,3,3,4,4)","평균 3; 길이 (3,3,3,3,3,3)"],"correctAnswer":0,"detailedExplanation":"1단계: 00 가지는 깊이 2에서 전체 이진 부호공간의 1/4을 차지한다. 따라서 사용할 수 있는 Kraft 용량은 3/4이다. 깊이 2,3,4의 부호어 개수를 n₂,n₃,n₄라 하면 n₂+n₃+n₄=6이고 4n₂+2n₃+n₄≤12이다. 두 식을 빼면 3n₂+n₃≤6이다.\n\n2단계: 길이가 짧은 부호어는 확률이 큰 메시지에 배정해야 한다. 확률 p_i>p_j인데 l_i>l_j라면 교환 후 평균길이 변화는 (p_i−p_j)(l_j−l_i)\u003c0이므로 기존 배정은 최적일 수 없다.\n\n3단계: n₂=0이면 가장 유리한 것은 모두 길이 3인 배정으로 가중길이 합은 108이다. n₂=1이면 n₃≤3이며 최대한 짧게 쓸 때 길이는 (2,3,3,3,4,4), 가중합은 20+24+18+15+16+12=105이다. n₂=2이면 n₃=0이라 길이는 (2,2,4,4,4,4), 가중합은 108이다. n₂≥3은 용량 조건상 불가능하다.\n\n4단계: 최솟값 105/36=35/12이다. 실제 부호 A=01, B=100, C=101, D=110, E=1110, F=1111을 잡으면 접두부 금지를 피하고 접두어 조건도 만족한다. 따라서 하한은 실제로 달성된다.","wrongOptionExplanations":["정답이다. 명시된 확률 모형과 최적화 조건을 모두 만족한다.","가능한 부호이지만 평균 3으로 최솟값 35/12보다 크다. 깊이 2의 부호어를 둘로 늘리면 나머지 네 메시지가 모두 길이 4로 밀린다.","길이 2를 더 자주 발생하는 A 대신 B에 배정하므로 평균은 106/36이다. 제시한 35/12와도 일치하지 않는다.","길이들의 Kraft 합이 1/4+1/4+1/8+1/8+1/16+1/16=7/8이므로 사용 가능한 3/4를 넘는다.","가능하지만 최적은 아니다. 가장 빈번한 A를 길이 2로 줄이는 대신 작은 확률 두 개를 길이 4로 보내면 평균이 감소한다."],"sourceReferences":[{"title":"MIT 6.441 Lecture 5: Kraft inequality and optimal codes","url":"https://ocw.mit.edu/courses/6-441-information-theory-spring-2010/a8525ccc542cccf186535efcf673ab36_MIT6_441S10_lec05.pdf","note":"접두어 부호의 나무 표현과 Kraft 부등식을 공식 강의 자료로 확인했다. 금지 가지와 길이 상한은 독자적 제약이다."}],"verified":true,"estimatedDifficulty":"최상위권 대학원 수준의 다단계 확률·정보 추론","verification":{"method":"독립 Python 검산: 정확분수·전수 열거·모멘트 방정식·오목 최적화 및 지문 길이/스키마 점검","result":"length assignments checked=729; optimum=35/12; lengths=(2, 3, 3, 3, 4, 4)"},"questionId":24},{"localId":"R02","category":"희귀 사실","difficulty":6,"questionText":"카티르카 운석의 자연 준결정 연구는 화학조성이 비슷해 보이는 금속 알갱이도 회절 대칭과 병진질서를 따로 판정해야 함을 보여준다. 2015년 원논문에 보고된 Al₇₁Ni₂₄Fe₅ 상은 열 겹 회전대칭을 갖는 준주기적 원자층이 한 축을 따라 주기적으로 쌓인 구조다. 같은 운석에서 먼저 발견된 Al₆₃Cu₂₄Fe₁₃ 상은 정이십면체 대칭을 갖는다. 아래 분류에서는 다중결정의 우연한 중첩과 쌍정을 배제했고, 조성의 아래첨자는 원자 백분율로 읽는다.\n\n익명의 두 알갱이 A와 B를 조사했다. A는 Al 71%, Ni 24%, Fe 5%이며, 한 특별한 축에 평행한 회절점 간격이 일정하고 그 축에 수직인 단일 회절무늬에서 정확한 열 겹 회전대칭이 나온다. B는 Al 63%, Cu 24%, Fe 13%이며, 서로 다른 방향에서 정이십면체 대칭에 해당하는 회절축들이 관찰된다. 여기서 '독립 병진 방향 수'는 구조 전체를 그대로 겹치게 하는 유한 길이 병진벡터들의 실수 선형독립 최대 개수로 정의한다.\n\n연구진이 보고한 두 상의 정체와 질서 유형에만 근거하여, A·B의 명칭과 독립 병진 방향 수를 함께 판정한 것은? 준주기적 질서를 무질서와 동일시하거나, 한 방향의 주기성을 삼차원 전체의 격자 주기성으로 확대해서는 안 된다.","options":["A 이코사헤드라이트·3방향 / B 데카고나이트·1방향","A 이코사헤드라이트·1방향 / B 데카고나이트·0방향","A 데카고나이트·1방향 / B 이코사헤드라이트·0방향","A 데카고나이트·3방향 / B 이코사헤드라이트·0방향","A 데카고나이트·0방향 / B 이코사헤드라이트·1방향"],"correctAnswer":2,"detailedExplanation":"A는 Al–Ni–Fe 계의 열 겹 대칭 자연 준결정인 데카고나이트다. 준주기적 층 안에서는 유한 주기의 평면 격자를 만들 수 없지만, 층을 쌓는 축에는 병진 주기가 있으므로 독립 병진 방향은 하나다. B는 Al–Cu–Fe 계의 이코사헤드라이트로, 정이십면체 준결정의 삼차원 준주기적 질서는 비영 병진 주기를 갖지 않는다. 따라서 B의 수는 0이다. 중요한 구분은 비주기성의 방향 수와 회전대칭, 그리고 합금조성을 함께 사용하는 것이다. [발견 원논문](https://www.nature.com/articles/srep09111)은 두 조성과 A의 주기적 층쌓기를 직접 기술하며, [광물 기재 논문](https://pubs.geoscienceworld.org/msa/ammin/article-abstract/100/10/2340/40432/Decagonite-Al71Ni24Fe5-a-quasicrystal-with)에서 데카고나이트라는 명칭을 확인할 수 있다.","wrongOptionExplanations":["명칭과 병진질서가 모두 뒤섞였다. 이코사헤드라이트는 Al–Cu–Fe 정이십면체 상이다.","두 광물의 조성과 대칭을 서로 바꾸었다. Al–Ni–Fe 열 겹 상이 데카고나이트다.","정답. 열 겹 대칭인 준주기 평면과 주기적 적층축을 구분했고 정이십면체 준결정도 올바로 대응했다.","한 적층축의 주기성을 삼차원 격자 전체의 주기성으로 확장했다. 단일 열 겹 회전대칭과 양립하지 않는다.","데카고나이트의 실제 적층 주기를 지워버리고 정이십면체 상에 존재하지 않는 병진축을 부여했다."],"sourceReferences":[{"title":"Bindi et al. (2015), Natural quasicrystal with decagonal symmetry","url":"https://www.nature.com/articles/srep09111","note":"초록·본문의 조성, 카티르카 기원, 준주기 원자층의 주기적 적층 및 정이십면체 상 대비. DOI 10.1038/srep09111."},{"title":"Bindi et al. (2015), Decagonite, Al71Ni24Fe5, a quasicrystal with decagonal symmetry from the Khatyrka CV3 carbonaceous chondrite","url":"https://pubs.geoscienceworld.org/msa/ammin/article-abstract/100/10/2340/40432/Decagonite-Al71Ni24Fe5-a-quasicrystal-with","note":"새 광물의 공식 명칭과 조성·대칭을 기재한 원논문."}],"verified":true,"estimatedDifficulty":"최상: 조성 식별과 준결정의 방향별 병진질서를 결합하는 결정학 추론","verification":{"method":"발견 원논문과 원광물 기재 초록의 조성·대칭·명칭을 상호 대조했다.","result":"A=decagonite, B=icosahedrite. 문제의 병진 방향 정의에서 각각 1, 0."},"questionId":25},{"localId":"R04","category":"희귀 사실","difficulty":6,"questionText":"옥시트리카 트리팔락스의 2013년 대핵 유전체 원논문은 약 16,000종의 완전한 나노염색체, 약 50 Mb의 단상 유전체 크기, 평균 약 2,000배의 차등 증폭을 보고했다. 대부분의 나노염색체는 단백질 암호화 유전자 하나를 담지만 일부는 여러 유전자를 담는다. 따라서 염색체의 '서로 다른 종류 수', 한 세포에서 얻은 실제 분자 수, 유전자 종류 수, 서열 조립의 단상 길이는 서로 바꾸어 쓸 수 없는 양이다. 특히 대핵의 작동 유전체는 소핵의 생식계열 유전체와 같은 물리적 구획이 아니다.\n\n다음 계산은 원논문의 대략적 평균값을 정확한 등식으로 간주하는 가상 표준화다. 대핵 A와 B는 같은 16,000종의 나노염색체를 가지며, 각 종류의 기본 서열과 길이는 같다. A의 모든 종류는 2,000분자씩, B는 정확히 절반인 8,000종이 1,000분자씩이고 나머지 8,000종이 3,000분자씩 존재한다. 복제수와 길이의 상관을 제거하기 위해 두 집단 각각의 단상 서열길이 합은 25 Mb로 같다. 텔로미어와 다른 DNA를 추가하지 않고 이 나노염색체 DNA만 센다.\n\nA에서 B로 바뀔 때 종류 수·전체 분자 수·전체 DNA 염기쌍 수의 변화와, 복제수만으로 유전자 종류의 증감을 판정할 수 있는지를 올바로 설명한 것은?","options":["세 수량 모두 동일 · 복제수 재분배만으로 유전자 종류가 늘었다고 할 수 없음","종류 수 동일·분자 수 동일·DNA량 2배 · 복제수 재분배로 유전자 종류가 늘어남","종류 수 절반·분자 수 동일·DNA량 동일 · 복제수 재분배만으로 유전자 종류 증가 불가","종류 수 동일·분자 수 절반·DNA량 절반 · 복제수 재분배만으로 유전자 종류 증가 불가","종류 수 동일·분자 수 2배·DNA량 동일 · 복제수 재분배로 유전자 종류가 늘어남"],"correctAnswer":0,"detailedExplanation":"종류 수는 두 대핵에서 16,000으로 같다. A의 분자 수는 16,000×2,000=32,000,000이고 B는 8,000×1,000+8,000×3,000=32,000,000이다. A의 DNA량은 50 Mb×2,000=100,000 Mb이며, B는 25 Mb×1,000+25 Mb×3,000=100,000 Mb이다. 복제수 분포는 달라져도 새로운 서열 종류가 생긴 것은 아니므로 유전자 종류의 증가도 따라오지 않는다. 두 집단의 길이 합을 같게 준 조건이 없었다면 분자 수가 같다고 DNA량까지 같다는 결론은 낼 수 없다. 실제 나노염색체 종류·길이·차등 증폭의 구별은 [Swart 등의 원논문](https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.1001473) 초록에 직접 제시된다.","wrongOptionExplanations":["정답. 염색체 종류 수와 복제분자 수를 구분하고 각 길이집단의 가중합으로 DNA량을 계산했다.","DNA량은 100,000 Mb로 같으며, 증폭은 기존 서열의 분자 수를 바꾸는 것으로 새 유전자 종류 생성과 같지 않다.","8,000종이라는 수는 각 복제수 집단의 크기이지 B 전체 종류 수가 아니다. 두 집단을 합치면 16,000종이다.","B의 두 복제수 집단 중 1,000배 집단만 계산했다. 3,000배인 나머지 절반도 반드시 더해야 한다.","분자 수는 1,000배 집단과 3,000배 집단의 평균이 2,000배이므로 같다. 종류 증가도 도출되지 않는다."],"sourceReferences":[{"title":"Swart et al. (2013), The Oxytricha trifallax Macronuclear Genome: A Complex Eukaryotic Genome with 16,000 Tiny Chromosomes","url":"https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.1001473","note":"초록의 약 16,000종, 약 50 Mb, 평균 약 2,000복제, 다유전자 염색체 예외 확인. 가상 균등·재분배 조건은 출제자가 별도 명시."}],"verified":true,"estimatedDifficulty":"최상: 희귀한 유전체 구조에서 종류·복제수·길이의 가중합을 분리하는 다단계 수리 추론","verification":{"method":"공개 원논문 초록의 세 통계량과 유전자 수 예외를 직접 확인하고 가상 조건의 분자 수·염기쌍 수를 재계산했다.","result":"양쪽 16,000종, 32,000,000분자, 100,000 Mb. 유전자 종류 증가를 함의하지 않음."},"questionId":26},{"localId":"R01","category":"희귀 사실","difficulty":6,"questionText":"네스비젭스키 연구진의 중성자 실험에서는 아래의 수평 거울과 위의 흡수체 사이를 통과한 입자 수를 흡수체 높이의 함수로 측정했다. 가장 낮은 중력 양자상태의 특성 높이보다 틈이 작으면 투과가 강하게 억제되었다. 여기서 높이의 문턱은 단순히 중성자 한 개의 지름을 재는 값도, 수평 운동에너지 전체를 중력 퍼텐셜로 바꾼 값도 아니다. 다음은 이 실험의 이상화된 수직 해밀토니안을 이용한 별도의 사고실험이다.\n\n관성질량을 mᵢ, 중력질량을 mɡ라고 할 때 z>0에서 H=−ℏ²(2mᵢ)⁻¹d²/dz²+mɡgz이고, 거울에서는 파동함수가 0이다. 같은 양자수의 에너지는 Eₙ=aₙ[ℏ²(mɡg)²/(2mᵢ)]^(1/3), 고전적 전환 높이는 zₙ=Eₙ/(mɡg)이다. aₙ은 변하지 않는 양의 상수다. 입사 수평속도와 흡수체 물성의 효과는 보정하여, 문턱은 z₁에 비례한다고 가정한다.\n\n가상 입자 P는 원래 중성자보다 관성질량과 중력질량이 각각 8배이며, 장치의 g는 원래의 1/8로 줄어든다. 이때 원래 실험과 비교한 바닥상태 에너지의 비, 문턱 높이의 비, 그리고 이 문턱이 검증하는 운동방향을 순서대로 바르게 묶은 것은?","options":["에너지 2배 · 높이 2배 · 수직 운동의 양자화","에너지 1/2배 · 높이 1/16배 · 수직 운동의 양자화","에너지 1/8배 · 높이 1/8배 · 수평 운동의 양자화","에너지 1/2배 · 높이 1/2배 · 수직 운동의 양자화","에너지 1배 · 높이 1배 · 수평 운동의 양자화"],"correctAnswer":3,"detailedExplanation":"mɡg의 변화율은 8×(1/8)=1이므로 수직 퍼텐셜의 기울기는 같다. 반면 운동에너지 항의 분모 mᵢ는 8배이다. 따라서 Eₙ의 비는 (1/8)^(1/3)=1/2이다. zₙ의 분모 mɡg가 일정하므로 전환 높이도 1/2배이다. 수평 통과율을 읽더라도 장치가 골라내는 것은 거울 위 수직 정상상태이며, 수평 운동에너지 자체의 이산화를 측정한 것이 아니다. 실제 투과 장치와 바닥상태 문턱의 의미는 [연구진 원논문](https://arxiv.org/abs/hep-ph/0306198)에 따른다. 질량과 g의 변경은 출제자가 명시한 사고실험이고 실제 실험 결과를 추가로 주장하는 것이 아니다.","wrongOptionExplanations":["질량 증가가 운동에너지 척도에 미치는 방향을 거꾸로 적용했다. 주어진 식에서는 mᵢ가 분모다.","높이를 구할 때 중력질량만 8배로 넣고 g의 1/8배 변화를 누락했다. 두 값의 곱은 유지된다.","세제곱근 스케일을 선형 스케일로 바꾸었으며, 높이 필터가 수평 에너지 양자화를 읽는다는 해석도 틀렸다.","정답. 퍼텐셜 기울기는 유지되고 관성질량만 수직 운동항의 척도를 바꾸므로 두 비가 모두 1/2이다.","퍼텐셜 기울기가 일정하다는 사실만 고려하고 관성질량 변화와 수직 경계조건을 누락했다."],"sourceReferences":[{"title":"Nesvizhevsky et al. (2003), Measurement of quantum states of neutrons in the Earth's gravitational field","url":"https://arxiv.org/abs/hep-ph/0306198","note":"원논문 초록에서 하부 수평 거울·상부 흡수체·바닥상태 높이 이하 투과 억제 확인. DOI 10.1103/PhysRevD.67.102002."},{"title":"Nesvizhevsky et al. (2002), Quantum states of neutrons in the Earth's gravitational field","url":"https://www.nature.com/articles/415297a","note":"원관측의 수직 중력 양자상태. 수학적 변경 조건은 문제에 완전 명시."}],"verified":true,"estimatedDifficulty":"최상: 서로 다른 두 질량, 중력장, 측정 방향을 분리하는 4단계 스케일 추론","verification":{"method":"2003년 연구진 원논문 초록과 2002년 원관측 서지를 대조하고, 제시식의 비례관계를 독립 계산했다.","result":"퍼텐셜 기울기 1배, 에너지·높이 각각 1/2배. 다섯 선택지 중 하나만 일치."},"questionId":27},{"localId":"R03","category":"희귀 사실","difficulty":6,"questionText":"1992년 월슈찬과 프레일의 PSR1257+12 원보고는 펄스 도착시각의 주기적 변동을 두 행성의 공전으로 해석했다. 당시 초록에 제시된 두 해는 공전주기 98.2일·거리 0.47 AU·최소질량 2.8지구질량과 공전주기 66.6일·거리 0.36 AU·최소질량 3.4지구질량이다. 이 문제는 그 원보고의 값만 사용하며, 뒤에 개선된 궤도해나 추가 행성의 현대적 명칭을 소급하여 섞지 않는다. 거리 값은 반올림되어 있으므로 케플러 법칙 검산에는 근사치로 사용한다.\n\n두 행성이 같은 중심질량을 돌고, 원궤도이며, 공면이라고 가정하자. 펄사 시선방향 반사운동의 광행시간 진폭은 작은 행성질량 근사에서 x∝ma sin i이다. 원보고의 최소질량은 m sin i를 뜻하며, 공통 궤도경사 i는 아직 모른다. 또 공전주기 비가 작은 정수비에 가깝다는 사실만으로 공명각의 칭동까지 관측되었다고 선언할 수는 없다. 후속 섭동 관측의 목적은 바로 두 개의 독립적인 주기곡선보다 더 강한 동역학적 검증을 얻는 데 있었다.\n\n이 조건에서 긴 주기 행성과 짧은 주기 행성의 광행시간 진폭비, 두 최소질량의 대소관계, 그리고 3:2 공명에 관해 허용되는 판단을 모두 바르게 결합한 것은?","options":["진폭비 약 1.08 · 긴 주기 쪽 최소질량이 큼 · 주기비만으로 공명 확정 불가","진폭비 약 1.08 · 긴 주기 쪽 최소질량이 작음 · 주기비만으로 공명 확정 불가","진폭비 약 1.81 · 긴 주기 쪽 최소질량이 큼 · 주기비만으로 공명 확정 가능","진폭비 약 0.82 · 긴 주기 쪽 최소질량이 작음 · 주기비만으로 공명 확정 불가","진폭비 약 1.08 · 긴 주기 쪽 최소질량이 작음 · 주기비만으로 공명 확정 가능"],"correctAnswer":1,"detailedExplanation":"긴 주기 행성의 진폭을 짧은 주기 행성의 진폭으로 나누면 (2.8×0.47)/(3.4×0.36)=1.075…이므로 약 1.08이다. 공면 가정 아래 미지의 sin i는 공통으로 소거되며, 최소질량을 진짜 질량과 같다고 둘 필요가 없다. 긴 주기 쪽은 최소질량 자체는 작지만 궤도반경이 더 커서 펄사 반사운동 진폭은 조금 크다. 98.2/66.6≈1.474라는 근접성은 공명각의 칭동 관측과 동의어가 아니다. [1992년 원논문을 수록한 연구기관 서지](https://pure.psu.edu/en/publications/a-planetary-system-around-the-millisecond-pulsar-psr1257-12/)의 수치와 [후속 동역학 연구](https://arxiv.org/abs/astro-ph/9406033)의 상호작용 검증 구분을 사용했다.","wrongOptionExplanations":["긴 주기 쪽 최소질량은 2.8로 3.4보다 작다. 더 큰 반경과 더 큰 최소질량은 별개의 진술이다.","정답. 질량과 궤도반경의 곱을 비교하고 공명 여부의 정보 한계를 유지했다.","주기비나 반경비를 광행시간 진폭비 대신 사용했으며, 최소질량 비교와 공명 판단도 잘못되었다.","2.8/3.4만 계산하여 궤도반경의 차이를 누락했다. 광행시간 진폭은 최소질량만의 함수가 아니다.","정수비 근접과 동역학적 공명의 확정은 다르다. 공명각 거동 등의 추가 정보가 필요하다."],"sourceReferences":[{"title":"Wolszczan & Frail (1992), A planetary system around the millisecond pulsar PSR1257 + 12","url":"https://pure.psu.edu/en/publications/a-planetary-system-around-the-millisecond-pulsar-psr1257-12/","note":"저자 소속 연구기관이 제공하는 원논문 초록: 최소질량·거리·주기의 대응. 원 DOI 10.1038/355145a0."},{"title":"Malhotra (1994), Dynamical Model of Pulsar-Planet Systems","url":"https://arxiv.org/abs/astro-ph/9406033","note":"상호 중력섭동이 펄스 도착시각에 주는 추가 변조와 행성 해석 검증의 의미를 논한 원연구."}],"verified":true,"estimatedDifficulty":"최상: 역사적 원자료 대응, 반사운동 진폭 계산, 최소질량과 공명 구분의 복합 추론","verification":{"method":"1992년 원초록의 수치 대응을 연구기관 서지와 Nature 검색 결과에서 대조하고 1994년 연구진 동역학 초록을 검토했다.","result":"진폭비 1.07516…, 긴 주기 최소질량 2.8\u003c3.4. 정수비 근접으로 공명을 확정하는 선택지 배제."},"questionId":28},{"localId":"physics-14","category":"물리학","difficulty":7,"questionText":"슈바르츠실트 블랙홀에 대해 \\(m=GM/c^2\\), \\(f(r)=1-2m/r\\)라 쓰고 계량을 \\(ds^2=-fc^2dt^2+f^{-1}dr^2+r^2d\\Omega^2\\)로 둔다. 질량이 무시할 만큼 작은 방출체가 무한대에서 정지한 초기 조건으로 각운동량 없이 자유낙하한다. 방출체가 면적반지름 \\(r_e=5m/2\\)에 도달하는 사건에서 자신의 순간정지 정규직교 틀에 대해 모든 입체각으로 등방적인 광자 펄스를 방출한다. 모든 광자의 방출체 기준 에너지는 \\(\\epsilon\\)이며 개수는 연속 각도 평균으로 다룰 만큼 많다. 총에너지와 반동은 방출체 궤도와 계량을 바꾸지 않는 시험 복사 극한이다.\n\n광자는 진공의 null 측지선을 따라 블랙홀에 포획되거나 무한대로 탈출한다. 광자 구 r=3m에 점근적으로 머무는 경계 방향은 측도 0으로 제외한다. 무한대 정적 검출기들이 탈출 광자를 전부 수집한다. 방출체 틀의 펄스 총에너지를 \\(E_{\\rm emit}=N\\epsilon\\), 무한대에서 탈출 광자에 대해 합산한 에너지를 \\(E_{\\rm esc,\\infty}\\)라 하고 \\(\\eta=E_{\\rm esc,\\infty}/E_{\\rm emit}\\)를 정의한다. 단순한 탈출 개수 비율이 아닌 이 에너지 비는 얼마인가? 방출 틀의 등방분포를 정적 틀에서 등방분포로 바꾸어서는 안 되며, 탈출 원뿔, 상대론적 광행차, 방향별 도플러 및 중력 적색편이를 모두 포함한다. 보기의 값은 무차원이고 소수점 아래 아홉째 자리로 반올림한 것이며 그 정밀도로 고르시오.","options":["\\(0.003206650\\)","\\(0.001434027\\)","\\(0.141421356\\)","\\(0.006413300\\)","\\(0.025055291\\)"],"correctAnswer":0,"detailedExplanation":"1. 무한대 정지 낙하의 보존에너지는 e=1이다. 방출점 f=1/5에서 정적 틀에 대한 γ=1/√f=√5, 안쪽 속력은 \\(\\beta=\\sqrt{1-f}=2/\\sqrt5\\)이다.\n\n2. 정적 틀에서 바깥 반경과 이루는 각을 α라 하면 충돌매개변수는 \\(b=r\\sin\\alpha/\\sqrt f\\)이다. null 방사방정식의 장벽 f/r²는 r=3m에서 최대이며 \\(b_c=3\\sqrt3m\\)이다. 방출점은 광자 구 안이므로 처음에 바깥 방향이고 b\u003cb꜀이어야 탈출한다. 따라서 \\(\\cos\\alpha>C=\\sqrt{1-b_c^2f/r_e^2}=\\sqrt{17/125}\\)이다.\n\n3. 방출체 틀의 바깥 방향 코사인을 μ라 하면 안쪽 부스트의 광행차는 \\(\\cos\\alpha=(\\mu-\\beta)/(1-\\beta\\mu)\\)이다. 분모가 양수이므로 탈출 경계는 \\(\\mu_0=(C+\\beta)/(1+\\beta C)=0.9498894172826194\\)이다.\n\n4. 방출 틀이 등방적이므로 μ의 확률밀도는 1/2이다. 각 광자의 무한대 에너지는 \\(E_\\infty=\\sqrt f\\gamma\\epsilon(1-\\beta\\mu)=\\epsilon(1-\\beta\\mu)\\)이다. 탈출 원뿔 안에서도 이 에너지가 방향에 의존한다.\n\n5. 따라서\n\\[\\eta=\\frac12\\int_{\\mu_0}^{1}(1-\\beta\\mu)d\\mu=\\frac{1-\\mu_0}{2}-\\frac\\beta4(1-\\mu_0^2)=0.0032066499225434954.\\]\n반올림하면 0.003206650이다. 탈출 개수 비 (1−μ₀)/2=0.0250552914를 에너지 비로 쓰면 도플러 가중치를 빠뜨린다. 이 계산은 킬링 보존량, null 장벽, 국소 부스트, 각도 분포, 에너지 적분을 차례로 결합한 것이다.","wrongOptionExplanations":["정답이다. 낙하틀 탈출 원뿔에 방향별 킬링 에너지를 적분한 값이다.","이미 포함한 중력 인자 √f를 한 번 더 곱한 값이다. √fγ=1을 사용한 뒤 추가하면 중복이다.","정적 틀 원뿔을 방출틀의 확률로 해석하고 광행차·낙하 도플러를 누락했다.","등방분포의 밀도 dP=dμ/2에서 1/2를 누락한 두 배 값이다.","탈출 광자 개수 비 (1−μ0)/2이다. 방향별 에너지를 가중해야 한다."],"sourceReferences":[{"title":"Sean Carroll, The Schwarzschild Solution and Black Holes","url":"https://ned.ipac.caltech.edu/level5/March01/Carroll3/Carroll7.html","note":"슈바르츠실트 측지선 보존량·국소 정적 틀·null 유효장벽 확인. 조건과 계산은 독자 구성."}],"verified":true,"estimatedDifficulty":"대학원 최상: 측지선 장벽·낙하 보존량·광행차·방향별 에너지·입체각 적분의 7단계","verification":{"method":"r≥2.5m null 방사 유효장벽의 수치 최대화; 국소 부스트한 4운동량에서 E∞,pr,L을 계산해 탈출 경계 탐색; 에너지 각도 수치적분","result":"potential peak r/m=2.9999999868; mu cutoff=0.94988941728262; eta=0.003206649922544; rounded=0.003206650","computedValue":0.0032066499225435045,"correctChoiceCount":1,"nearestWrongChoiceDistance":0.0017726229225435044},"questionId":29},{"localId":"chem2","category":"화학","difficulty":7,"questionText":"평면의 가상 6원자 고리에서 각 원자에 직교한 \\(p\\) 원자궤도 하나와 π전자 하나가 있다고 하자. 6×6 Hückel 해밀토니안의 대각성분은 모두 0이고, 최근접 원자 사이 원소만 존재한다. 고리를 따라 결합 1–2, 3–4, 5–6의 행렬원소는 \\(-(t+\\delta)\\), 결합 2–3, 4–5, 6–1은 \\(-(t-\\delta)\\)이며 \\(t=2.000\\ \\mathrm{eV}\\)이다. 변형좌표는 \\(0\\le\\delta\\le t\\) 범위의 에너지 차원량이고, 마지막 6–1 결합을 빠뜨리거나 끝이 열린 사슬로 해석해서는 안 된다. 전자 사이 반발은 제외하고 각 공간궤도에는 두 전자를 채울 수 있다.\n\n고리의 σ골격이 지불하는 탄성에너지는 \\(E_{\\rm el}=6K\\delta^2\\), \\(K=0.4000\\ \\mathrm{eV^{-1}}\\)이다. 이 에너지는 고리 전체에 대한 값이며 결합마다 다시 여섯 배하지 않는다. 온도는 0 K이고, 전자는 항상 주어진 \\(\\delta\\)에서 한 전자 에너지 합을 최소로 만드는 바닥상태를 차지한다. 영점진동과 구조 변화에 따른 \\(t\\)의 변화는 없다. \\(\\delta=0\\)인 대칭구조와 비교한 안정화에너지는 \\(E_{\\rm tot}(0)-\\min E_{\\rm tot}\\)로 양수 정의한다. 2원자 단위셀 세 개의 주기 경계조건 또는 직접 행렬대각화를 이용해 축퇴도와 전자점유를 먼저 정하고, 내부 정상점과 경계점을 모두 비교하라. 전역 최소점의 \\((\\delta,\\text{안정화에너지},\\text{HOMO–LUMO 간격})\\)는?","options":["\\((2.0000,\\ -1.6000,\\ 8.000)\\ \\mathrm{eV}\\)","\\((0,\\ 0,\\ 4.000)\\ \\mathrm{eV}\\)","\\((0.8660,\\ 0.2000,\\ 5.000)\\ \\mathrm{eV}\\)","\\((0.8660,\\ 0.2000,\\ 2.500)\\ \\mathrm{eV}\\)","\\((0.8660,\\ 2.0000,\\ 5.000)\\ \\mathrm{eV}\\)"],"correctAnswer":2,"detailedExplanation":"3개의 단위셀 파수 \\(q=0,\\pm2\\pi/3\\)에서 두 밴드는 \\(E_\\pm(q)=\\pm|(t+\\delta)+(t-\\delta)e^{iq}|\\)이다. 따라서 에너지는 \\(\\pm2t\\) 각각 하나, \\(\\pm\\sqrt{t^2+3\\delta^2}\\) 각각 두 개이다. 전자 6개는 음에너지 공간궤도 세 개에 두 개씩 차므로 \\(E_\\pi=-4t-4\\sqrt{t^2+3\\delta^2}\\)이다. 탄성을 더하면 \\(E_{\\rm tot}=-8-4\\sqrt{4+3\\delta^2}+2.4\\delta^2\\)이다.\n\n도함수는 \\(12\\delta[K-1/\\sqrt{t^2+3\\delta^2}]\\)이다. \\(\\delta>0\\) 정상점은 제곱근이 \\(1/K=2.5\\ \\mathrm{eV}\\)일 때, 즉 \\(\\delta=\\sqrt{0.75}=0.8660254\\ \\mathrm{eV}\\)이다. 총에너지는 정상점 -16.2 eV, 대칭점 -16.0 eV, 경계 \\(\\delta=2\\)에서 -14.4 eV이므로 정상점이 전역 최소이다. 안정화는 0.2 eV이며 점유·비점유 가장 가까운 준위 사이 간격은 \\(2\\sqrt{4+3\\delta^2}=5\\ \\mathrm{eV}\\)이다.","wrongOptionExplanations":["한 결합을 완전히 끊는 경계는 전역 최소가 아니다. 이 경계의 총에너지는 대칭구조보다 오히려 높다.","대칭구조를 자동으로 최소라고 가정했다. 실제로 \\(K\u003c1/t\\)여서 작은 결합 교대가 에너지를 낮춘다.","정답. 축퇴한 두 저에너지 궤도와 전자 스핀을 모두 세고 탄성비용을 뺐다.","정상점과 안정화는 맞으나 HOMO의 에너지 절댓값만 보고 간격의 반대쪽 LUMO를 누락했다.","전자에너지 감소 2.0 eV만 보고 같은 변형에서의 탄성비용 1.8 eV를 빼지 않았다."],"sourceReferences":[{"title":"R. Field, Qualitative MO Theory: Hückel","url":"https://ocw.mit.edu/courses/5-61-physical-chemistry-fall-2017/0d3d7427e4180c2e1b59bb0c09827092_MIT5_61F17_lec26.pdf","note":"6원환 Hückel 준위·축퇴·점유 원리; 교대 결합과 탄성 함수는 이 문항의 가상 모형."}],"verified":true,"estimatedDifficulty":"대학원 종합시험 수준; 주기 블록화→축퇴→6전자 점유→총에너지→전역 최소검사→간격의 6단계","verification":{"method":"직접 6×6 Hückel 행렬을 대각화하고 황금분할법으로 총에너지의 전역 최소를 탐색; Python/NumPy 독립 계산","result":"PASS; 6x6 numerical minimum delta=0.8660254249; stabilization=0.2000000000; gap=5.0000000438"},"questionId":30},{"localId":"chem3","category":"화학","difficulty":7,"questionText":"팔면체 \\(d^6\\) 착물의 저스핀 LS와 고스핀 HS 사이 열평형을 생각한다. 두 상태의 금속–리간드 전자에너지 최소점 차이는 압력 0에서 \\(E^0_{\\rm HS}-E^0_{\\rm LS}=12.000\\ \\mathrm{kJ\\,mol^{-1}}\\)이다. 이 값은 진동 영점에너지를 아직 포함하지 않는다. LS의 스핀은 0, HS의 스핀은 2이며, 궤도 축퇴와 스핀궤도 결합은 완전히 소거되어 전자 축퇴도는 각각 1과 5이다. 두 상태 사이의 몰부피차는 \\(V_{\\rm HS}-V_{\\rm LS}=10.000\\ \\mathrm{cm^3\\,mol^{-1}}\\)로 온도·압력에 무관하며, 압력항은 \\(p\\Delta V\\)로 처리한다.\n\n상태별로 중요한 독립 조화진동은 6개뿐이고, LS에서는 모두 500.00 cm⁻¹, HS에서는 모두 250.00 cm⁻¹이다. 이외 회전·병진·진동 기여는 두 상태에서 같아 소거된다. 각 진동의 분배함수는 전자 최소점을 에너지 영점으로 하여 \\(q_v=\\exp[-hc\\tilde\\nu/(2k_BT)]/[1-\\exp(-hc\\tilde\\nu/k_BT)]\\)이며 영점항을 다시 추가해서는 안 된다. 착물 사이의 협동 상호작용과 히스테리시스는 없다. 온도는 300.00 K, \\(hc/k_B=1.4387769\\ \\mathrm{cm\\,K}\\), \\(R=8.314462618\\ \\mathrm{J\\,mol^{-1}K^{-1}}\\), Landé 인자는 2이다. HS 몰분율이 1/2인 압력 \\(p_{1/2}\\)와, 0.8000 GPa에서 Curie 상수로 정한 분자당 유효 자기모멘트 \\(\\mu_{\\rm eff}/\\mu_B=\\sqrt{24x_{\\rm HS}}\\)의 조합은?","options":["\\((0.4930\\ \\mathrm{GPa},\\ 1.107)\\)","\\((-0.7986\\ \\mathrm{GPa},\\ 0.199)\\)","\\((0.4930\\ \\mathrm{GPa},\\ 4.899)\\)","\\((0.0916\\ \\mathrm{GPa},\\ 1.151)\\)","\\((0.4930\\ \\mathrm{GPa},\\ 2.329)\\)"],"correctAnswer":4,"detailedExplanation":"한 진동의 HS/LS 분배함수비는 300 K에서 \\(r_v=q_v(250)/q_v(500)=2.37028184\\)이다. 전체 상태비는 \\(r=x_{\\rm HS}/x_{\\rm LS}=5r_v^6\\exp[-(12000+p\\,10^{-5})/(RT)]\\)이다. 압력을 Pa로 쓰면 \\(\\Delta V=10^{-5}\\ \\mathrm{m^3mol^{-1}}\\)임에 유의한다. \\(r=1\\) 조건으로 \\(p_{1/2}=[RT(\\ln5+6\\ln r_v)-12000]/10^{-5}=0.49303023\\ \\mathrm{GPa}\\)이다.\n\n0.8 GPa에서 \\(r=\\exp[-(0.8-0.49303023)10^4/(RT)]=0.292098\\)이고 \\(x_{\\rm HS}=r/(1+r)=0.22606490\\)이다. LS의 Curie 기여는 0, HS는 \\(g^2S(S+1)=24\\)이므로 모멘트 제곱을 몰분율로 평균하여 \\(\\mu_{\\rm eff}/\\mu_B=\\sqrt{24x_{\\rm HS}}=2.32928263\\)을 얻는다. 모멘트 자체를 산술평균하는 처방은 Curie 상수의 정의와 다르다.","wrongOptionExplanations":["압력과 HS 분율은 올바르지만 모멘트를 선형 평균 \\(x_{\rm HS}\\sqrt{24}\\)하여 약 1.107을 얻었다.","여섯 진동의 HS/LS 분배함수비를 모두 1로 놓았다. 그러면 \\(p_{1/2}=(RT\\ln5-12000)/\\Delta V=-0.798552\\ \\mathrm{GPa}\\), 0.8 GPa의 모멘트는 0.198661이다.","열평형 HS 분율이 1보다 작음에도 전 분자가 HS인 순수상 모멘트 \\(\\sqrt{24}\\)를 썼다.","HS의 전자 스핀 축퇴도 5를 빠뜨렸다. 그러면 교차압력이 \\(RT\\ln5/\\Delta V\\)만큼 낮아져 0.091582 GPa이고, 자기모멘트도 1.150949로 줄어든다.","정답. 전자 축퇴, 정확한 진동 분배함수, 부피 일, 모멘트 제곱 평균을 반영했다."],"sourceReferences":[{"title":"MIT OCW, Transition Metals: Crystal Field Theory","url":"https://ocw.mit.edu/courses/5-111sc-principles-of-chemical-science-fall-2014/pages/unit-iv-transition-metals-oxidation-reduction-reactions/lecture-28/","note":"팔면체 전자배치와 고스핀·저스핀의 물리."},{"title":"K. K. Irikura, Essential Statistical Thermodynamics","url":"https://cccbdb.nist.gov/thermox.asp","note":"조화진동 분배함수와 에너지 영점의 원리; 수치 모형은 독자 구성."}],"verified":true,"estimatedDifficulty":"대학원 종합시험 수준; 진동비→6모드·스핀 축퇴→압력 평형→몰분율→Curie 상수 평균의 5단계","verification":{"method":"전자 최소점 기준 여섯 조화진동 분배함수를 곱하고 상태비=1의 압력을 이분법으로 구함; Python/NumPy 독립 계산","result":"PASS; p_half=0.493030232544 GPa; x_HS=0.226064899727; moment=2.329282634941"},"questionId":31},{"localId":"H10","category":"세계사·고고학·고문헌","difficulty":7,"questionText":"필로스 선형문자 B 점토판의 제작법에 관한 2023년 실험·실물 조사 연구를 검토한다. 연구자는 Jn 605의 매끈한 가장자리와 거친 가장자리가 고운 점토 외피와 거친 핵의 차이라는 기존 설명을 실물 관찰로 지지하지 않았다. 일부를 칼로 자른 뒤 나머지를 뜯으면 그런 차이가 생길 수 있고, 큰 혼입물은 매끈한 부분에도 보였다. 실험에서는 말아 만든 판과 접어 만든 판의 이음매를 충분히 다듬을 경우 최종 흔적이 사실상 구별되지 않기도 했다. 또한 젖은 상태에서의 안정성은 내부 짚을 넣는 것보다 접어 만드는 방식의 영향을 더 크게 받았다.\n\n짚이나 실은 운반 중 판이 깨졌을 때 파편을 붙잡는 데 주된 이점이 있었고, 이를 손잡이처럼 잡아 들어 올리는 실험은 결과가 일정하지 않았다. 손자국과 필체의 관계도 제작자와 서기관이 언제나 같은 사람인지 일률적으로 정해 주지 않는다. 편집자는 '한 특징에 한 공정을 대응시키는 목록'을 만들려다가 이 연구의 결과와 충돌하는지 점검한다. 재현 실험의 가능성, 실제 유물의 흔적, 공정의 비유일성, 재료의 기능, 작업자의 정체를 모두 고려할 때 연구 결과에 부합하는 판정은 무엇인가?","options":["공정을 하나로 정할 수 없어도 내부 짚은 모든 판의 필수 손잡이였다. 따라서 짚의 유무를 기준으로 제작자와 서기관이 같은지 다른지 나눌 수 있다.","겉모습이 같을 수 있으므로 실제 제작법은 어떤 자료로도 연구할 수 없다. 실험이 보여 준 접기와 짚의 기능 차이도 역사적 해석에서 전부 제외해야 한다.","매끈함과 거침은 반드시 두 점토층을 뜻하고, 이음매가 없으면 말아 만든 판이다. 짚이 든 판은 서기관이 직접 들고 쓰기 위해 제작한 것으로 귀속한다.","가장자리의 차이만으로 이층 구조를 확정할 수 없고, 다듬어진 흔적만으로 말기와 접기를 늘 구별할 수도 없다. 기능의 실험 결과와 개인 귀속은 별도 근거로 평가한다.","두 점토층 가설은 약해졌으므로 모든 필로스 판은 동일한 점토·접기 공정이다. 같은 제작 흔적을 가진 판은 필체가 달라도 한 사람이 썼다고 판정한다."],"correctAnswer":3,"detailedExplanation":"다섯 연결을 점검한다. ① 표면 질감에서 재료의 이층 구조로 곧장 넘어갈 수 없다. ② 서로 다른 공정이 같은 흔적을 만들 수 있어 결과에서 원인을 유일하게 역산하지 못한다. ③ 접기와 짚은 젖은 판의 안정성에 같은 영향을 주지 않는다. ④ 파편 유지의 이점이 손잡이 기능을 필연적으로 뜻하지 않는다. ⑤ 제작법·손자국·필체의 관계는 개별적으로 판단해야 한다. 실험의 기능 결과를 활용하되 흔적의 식별력과 개인 귀속을 과장하지 않는 판단이 옳다.","wrongOptionExplanations":["들어 올리기 실험은 변동성과 손상 위험을 보였으므로 필수 손잡이로 확정할 수 없다. 짚의 유무는 작업자의 동일성도 결정하지 않는다.","어떤 특징의 식별력이 제한된다는 것과 모든 제작 연구가 불가능하다는 것은 다르다. 기능 차이에 관한 실험 결과도 유의미하다.","실물과 실험은 이층 구조·공정·손잡이라는 일대일 대응을 모두 약화한다. 이음매가 지워진 접은 판도 존재할 수 있다.","정답이다. 실험으로 확인한 기능과 흔적의 식별 한계, 개인 작업자 귀속을 서로 구분한다.","특정 이층 가설의 약화는 모든 판의 단일 공정을 증명하지 않는다. 같은 제작 방식이 같은 서기관을 뜻하지도 않는다."],"sourceReferences":[{"title":"Anna P. Judson, The Tablet-Makers of Pylos: An Experimental Investigation into the Production of Linear B Tablets (2023)","url":"https://www.cambridge.org/core/journals/annual-of-the-british-school-at-athens/article/tabletmakers-of-pylos-an-experimental-investigation-into-the-production-of-linear-b-tablets/51DD3CD1D244D71072115EE4DD0D2FC6","note":"공개 원저 논문 본문 직접 열람. Jn605·Es644의 이층 가설 재검토, 말기/접기의 흔적 동형성, 젖은 판 안정성 실험, 짚/실로 들어 올리기와 파편 유지 기능, 제작자·필자의 관계 및 결론을 확인했다. DOI10.1017/S0068245423000059."}],"verified":true,"estimatedDifficulty":"극상: 실험고고학의 다섯 인과 추론과 공정 흔적의 비유일성·개인 귀속 검토","verification":{"method":"실험 및 직접 실물 관찰을 수행한 원저의 해당 본문과 결론을 직접 읽고, 각 선택지의 보편화 범위와 기능 추론을 대조했다.","result":"제시한 정답만 성립한다. 개별 판의 공정과 개인 정체가 전부 확정되었다고 하지 않았으며, 특정 특징의 한계와 연구 전체의 불가능성을 구분했다."},"questionId":32},{"localId":"physics-13","category":"물리학","difficulty":7,"questionText":"자유 실수 스칼라장의 가장 작은 유한 격자 조절 모형으로 두 위치의 정준 연산자 \\(q_1,q_2,p_1,p_2\\)만 남긴 닫힌 양자계를 생각한다. \\([q_j,p_k]=i\\hbar\\delta_{jk}\\)이고 다른 교환자는 0이다. 질량을 흡수한 정규화 정준좌표를 사용하므로 해밀토니언은 \\(H(\\kappa)=\\tfrac12(p_1^2+p_2^2)+\\tfrac{\\omega^2}{2}(q_1^2+q_2^2)+\\tfrac\\kappa2(q_1-q_2)^2\\)로 정의한다. \\(\\omega>0\\)의 단위는 \\(\\mathrm{s^{-1}}\\), κ의 단위는 \\(\\mathrm{s^{-2}}\\)이며 이 식 자체가 모형의 단위와 경계 결합을 완전히 정한다. 다른 격자점이나 주기적 경계의 추가 결합은 없다.\n\nt\u003c0에는 κ=0이고 계는 이때의 정확한 바닥상태에 있다. t=0에서 κ를 \\(3\\omega^2/2\\)로 순간 변경한 뒤 일정하게 유지하고 상태는 변경 순간 연속적이며 이후에는 H로 유니터리하게 진화한다. 온도, 고차 상호작용과 외부 잡음은 모두 0이다. 시간 \\(t_*=\\pi/(4\\omega)\\)에서 위치 2를 부분추적하여 \\(\\rho_1=\\mathrm{Tr}_2|\\Psi(t_*)\\rangle\\langle\\Psi(t_*)|\\)를 만든다. 전체 상태는 순수하지만 이 부분상태는 일반적으로 혼합상태이다. 단일 위치의 2차 Rényi 엔트로피를 \\(S_2=-\\ln\\mathrm{Tr}(\\rho_1^2)\\)로, 자연로그를 사용하여 정의한다. 정확한 값은 어느 것인가? 입자수의 고전적 확률을 세는 대신 정상모드 급변, 시간 진화, 원래 위치로의 변환과 가우스 부분상태 순도를 차례로 처리해야 한다.","options":["\\(\\ln(5/2)\\)","\\(\\ln2\\)","\\(\\ln(25/16)\\)","\\(\\ln(5/4)\\)","\\(0\\)"],"correctAnswer":3,"detailedExplanation":"1. 정준좌표 \\(Q_\\pm=(q_1\\pm q_2)/\\sqrt2,P_\\pm=(p_1\\pm p_2)/\\sqrt2\\)로 바꾸면 두 독립 조화진동자이다. 주파수는 \\(\\Omega_+=\\omega,\\Omega_-=\\sqrt{\\omega^2+2\\kappa}=2\\omega\\)이다. 초기에는 두 모드 모두 ω 바닥상태여서 \\(\\langle Q_\\pm^2\\rangle_0=\\hbar/(2\\omega),\\langle P_\\pm^2\\rangle_0=\\hbar\\omega/2\\)이고 대칭 교차공분산이 0이다.\n\n2. +모드는 주파수가 변하지 않아 공분산이 유지된다. −모드는 \\(Q_-(t)=Q_-(0)\\cos2\\omega t+P_-(0)\\sin2\\omega t/(2\\omega)\\), \\(P_-(t)=P_-(0)\\cos2\\omega t-2\\omega Q_-(0)\\sin2\\omega t\\)로 진화한다. t*에서 코사인은 0, 사인은 1이므로 \\(\\langle Q_-^2\\rangle=\\hbar/(8\\omega)\\), \\(\\langle P_-^2\\rangle=2\\hbar\\omega\\), 대칭 Q₋P₋ 공분산은 0이다.\n\n3. 서로 다른 정상모드 상관은 0이다. 원래 위치로 되돌리면 \\(V_{qq}=[\\hbar/(2\\omega)+\\hbar/(8\\omega)]/2=5\\hbar/(16\\omega)\\), \\(V_{pp}=[\\hbar\\omega/2+2\\hbar\\omega]/2=5\\hbar\\omega/4\\), \\(V_{qp}=0\\)이다.\n\n4. 이차 해밀토니언은 가우스성을 보존하며 부분추적도 가우스 상태를 준다. 단일 정준쌍의 대칭 공분산 V에 대한 순도는 \\(\\mathcal P=\\hbar/(2\\sqrt{\\det V})\\)이다. 여기서 \\(\\det V=25\\hbar^2/64\\), 따라서 \\(\\mathcal P=4/5\\)이다.\n\n5. 정의에 따라 \\(S_2=-\\ln(4/5)=\\ln(5/4)\\)이다. 전체 순수성은 두 위치 사이의 얽힘을 배제하지 않는다. 정상모드별 순수성을 원래 위치별 순수성으로 옮겨서는 안 된다.","wrongOptionExplanations":["가우스 순도 식의 2를 누락했다. 진공 detV=ℏ²/4에서 순도 1이 나와야 한다.","두 위치를 두 상태 계로 바꾸고 최대 얽힘을 가정했다. 각 위치는 무한차원 진동자이다.","이미 Trρ²인 순도 4/5를
