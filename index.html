 다시 제곱했다. Rényi 정의에 제곱을 추가하지 않는다.","정답이다. 반대칭 모드의 급변 압축이 위치 사이 얽힘을 만들고 단일 위치 순도는 4/5이다.","닫힌 전체 상태의 순수성을 부분상태에도 적용했다. 위치를 부분추적하면 혼합상태이다."],"sourceReferences":[{"title":"David Tong, Quantum Field Theory","url":"https://www.damtp.cam.ac.uk/user/tong/qft.htm","note":"자유 격자장과 정상모드 진동자의 대응 확인. 급변과 부분상태 공분산은 독자 계산."},{"title":"MIT Quantum Physics III: Entanglement and Density Matrices","url":"https://ocw.mit.edu/courses/8-06-quantum-physics-iii-spring-2016/pages/lecture-notes/","note":"부분추적과 순도 정의 확인."},{"title":"Christian Weedbrook et al., Gaussian Quantum Information","url":"https://arxiv.org/abs/1110.3234","note":"가우스 공분산·부분추적·Wigner 정규화 및 순도 공식 확인. 원문의 정준 단위 관례를 [q,p]=iℏ로 환산."},{"title":"Christian Weedbrook et al., Gaussian Quantum Information","url":"https://arxiv.org/abs/1110.3234","note":"가우스 공분산·부분추적·Wigner 정규화 및 순도 공식 확인. 원문의 정준 단위 관례를 [q,p]=iℏ로 환산."}],"verified":true,"estimatedDifficulty":"대학원 최상: 격자장 급변·정상모드·심플렉틱 시간진화·부분추적·순도의 5단계","verification":{"method":"위치기저 4×4 Hamilton 행렬 지수로 전체 공분산 전파; 환원 Wigner 함수 제곱을 100×100 Gauss 적분","result":"reduced covariance=[[0.3125000000000001, 2.0384996761674e-16], [2.0384996761674e-16, 1.249999999999999]]; integrated purity=0.80000000000000; S2=0.22314355131421","computedValue":0.2231435513142097,"correctChoiceCount":1,"nearestWrongChoiceDistance":0.2231435513142097},"questionId":33},{"localId":"astro7","category":"천체물리학·우주론","difficulty":7,"questionText":"어떤 은하단의 한 중심 시선을 두 등깊이 구역으로 이상화한다. 총 실제 깊이는 \\(L\\)이고 첫 구역의 전자밀도·온도는 \\((n,T)\\), 둘째 구역은 \\((2n,T/2)\\)이므로 전자압력은 같다. 두 구역의 화학조성은 동일하고 전자는 비상대론적이다. 제동복사의 볼로미터 방출률은 정확히 \\(\\epsilon_X=Cn_e^2T_e^{1/2}\\)이며, \\(C\\)에는 조성과 단위 변환이 모두 들어 있다. 관측 적색편이의 표면밝기 감쇠를 이미 제거한 X선 자료를 \\(X=\\int n_e^2T_e^{1/2}dl\\), 열적 SZ 자료에서 상수를 제거한 양을 \\(Y=\\int n_eT_e dl\\)로 정의한다.\n\n분석자가 한 온도 모형에 사용하는 온도는 이 문제에서 방출률 가중 산술평균 \\(T_X=\\int\\epsilon_XT_e dl/\\int\\epsilon_Xdl\\)로 정확히 정의한다. 그는 두 상을 분해하지 못해 \\(Y=n_{\\rm fit}T_XL_{\\rm fit}\\), \\(X=n_{\\rm fit}^2T_X^{1/2}L_{\\rm fit}\\)를 동시에 적합한다. 은하단의 횡방향 물리 지름은 \\(W\\), 관측 각지름은 \\(\\theta=W/D_{A,\\rm true}\\)이고, 실제로는 \\(L=1.600W\\)인데 분석자는 구대칭을 가정해 \\(D_{A,\\rm fit}=L_{\\rm fit}/\\theta\\)라고 둔다. 비교 우주론의 무차원 매개변수와 적색편이는 같아서 \\(D_A\\propto H_0^{-1}\\)이다. 이 밖의 관측 편향은 없을 때 \\(H_{0,\\rm fit}/H_{0,\\rm true}\\)를 소수 넷째 자리까지 구하면?","options":["\\(0.5991\\)","\\(0.9586\\)","\\(0.6250\\)","\\(0.7771\\)","\\(1.6692\\)"],"correctAnswer":0,"detailedExplanation":"등깊이 합을 직접 계산하면 \\(Y=nTL\\), \\(X=\\tfrac12(1+2\\sqrt2)n^2T^{1/2}L\\)이다. X선 온도의 분자는 \\(\\tfrac12(1+\\sqrt2)n^2T^{3/2}L\\)이므로 \\(t\\equiv T_X/T=(1+\\sqrt2)/(1+2\\sqrt2)=0.63060194\\)이다. 평균 밀도를 먼저 구해 제곱하는 방식은 \\(X\\)를 재현하지 못한다.\n\n단일 상 모형의 두 식을 나눠 밀도를 없애면 \\(L_{\\rm fit}=Y^2/(XT_X^{3/2})\\)이다. \\(C_X=(1+2\\sqrt2)/2=1.91421356\\)라 할 때 \\(L_{\\rm fit}/L=1/(C_Xt^{3/2})=1.04322181\\)이다. 따라서 \\(D_{A,\\rm fit}/D_{A,\\rm true}=1.6/(C_Xt^{3/2})=1.66915490\\)이고, 허블상수 비는 그 역수 \\(0.59910557\\)이다. 다상성의 작은 깊이 과대추정과 시선방향의 실제 연장이 같은 방향으로 거리 편향에 기여한다.","wrongOptionExplanations":["정답. SZ 압력 적분, X선의 밀도제곱 적분, 온도 가중, 실제 형상을 모두 결합했다.","실제 기하학적 연장을 빼고 다상성의 깊이 편향만 허블상수에 반영했다.","온도·밀도 비균일성은 무시하고 시선방향 연장 1.6만 보정했다.","방출률 가중 온도 대신 등깊이 산술평균 \\(T_X=0.75T\\)를 사용했다. 그러면 \\(H_{\\rm fit}/H_{\\rm true}=C_X(0.75)^{3/2}/1.6=0.7770739\\)가 나온다.","거리에 대한 편향을 그대로 허블상수 편향으로 보고 역수를 취하지 않았다."],"sourceReferences":[{"title":"M. Birkinshaw, The Sunyaev–Zeldovich Effect: Clumping","url":"https://ned.ipac.caltech.edu/level5/Birkinshaw/Birk10_1.html","note":"등압 clumping에서 SZ와 X선 밀도 의존성이 다르다는 원리."},{"title":"E. D. Reese, Measuring the Hubble Constant with the SZE","url":"https://ned.ipac.caltech.edu/level5/March04/Reese/Reese4.html","note":"SZ·X선 결합 거리법; 가중 온도와 두 구역은 지문 자체의 명시적 모형."}],"verified":true,"estimatedDifficulty":"대학원 종합시험 수준; 두 관측 적분→X선 온도→밀도 소거→깊이 편향→형상→허블 편향의 6단계","verification":{"method":"구역별 압력·방출률을 배열로 적분하고 단일 상 모형의 밀도·깊이를 복원; Python/NumPy 독립 계산","result":"PASS; Tx/T=0.630601937482; Lfit/L=1.043221814653; Hratio=0.599105570092"},"questionId":34},{"localId":"H03","category":"세계사·고고학·고문헌","difficulty":7,"questionText":"빈돌란다 목간 291의 편지를 비평판으로 검토한다. 이 자료는 목재 위 먹글씨로, 발신자는 클라우디아 세베라, 수신자는 술피키아 레피디나이다. 본문에는 세베라가 자신의 생일인 9월 11일에 방문해 달라는 초대가 있으며, 말미의 짧은 인사에는 본문과 다른 손을 가리키는 m²가 붙어 있다. 뒷면의 주소는 다시 첫 번째 손인 m¹로 분류된다. 편집자는 둘째 손을 세베라 자신의 필적으로 판단하고, 유적 단계와 맥락에 따라 자료를 서기 97–105년으로 편년한다. 이 편지는 특정 집정관 이름으로 연도를 표시하지 않는다.\n\n그런데 9–10행은 단순하지 않다. 판독 본문은 복수 동사 salutant를 유지하고, 그 앞의 명사를 '작은 아들'을 뜻하는 filiolus로 읽는다. 반면 문장 끝의 인사 대상 대명사는 판독과 복원에 논의가 남아 있다. 편집자는 필획의 형태와 남은 공간을 근거로 대안을 검토한다. 한 연구자가 이 목간을 '여성이 직접 쓴 문서'로 사용할 때, 서간의 저자·물리적 필자·수신 대상·정확한 날짜·결손 복원의 확실성을 동시에 구분해야 한다. 비평판의 증거 수준에 가장 충실한 주장은 무엇인가?","options":["세베라의 자필은 주소가 있는 뒷면에만 남아 있다. 따라서 본문의 생일 초대는 레피디나가 작성했고, 97–105년은 생일이 반복된 기간으로 읽어야 한다.","세베라는 발신자이며 둘째 손의 짧은 인사를 직접 썼다고 판단된다. 본문 전체의 자필이나 특정 발신 연도, 결손 대명사의 완전한 확정까지 따라오지는 않는다.","m¹과 m²는 서로 다른 필자를 뜻하지만 하나는 반드시 수신자의 손이다. 인사 대상이 결손되어 있으므로 발신자와 수신자도 식별할 수 없다.","복수 동사가 확실하므로 두 명 이상의 발신자가 편지 전체를 공동 집필했다. 이로써 둘째 손의 자필 귀속과 9월 11일의 정확한 연도도 정해진다.","짧은 자필 인사는 세베라의 쓰기 능력을 보여 준다. 따라서 9–10행의 모든 대명사와 본문 전체가 같은 수준으로 확실하며 사서에게 맡긴 부분은 없다."],"correctAnswer":1,"detailedExplanation":"발신자로서의 저자와 각 부분을 실제 적은 필자를 구분해야 한다. m²는 말미의 세베라 자필 인사이고, 주소는 m¹이다. 9월 11일이라는 월일은 편지 내용이지만 97–105년은 맥락에 따른 범위이므로 특정 연도를 얻을 수 없다. salutant와 filiolus의 판독이 상대적으로 확실해도 인사 대상 대명사의 복원까지 같은 확실성을 갖지는 않는다. 따라서 자필 범위를 제한하고 편년·판독의 확실성을 구분하는 해석이 옳다..","wrongOptionExplanations":["주소는 m¹이며 세베라의 자필로 귀속되는 부분은 m²의 말미이다. 편년 범위는 생일 축하의 지속 기간이 아니다.","정답이다. 발신자와 자필 부분을 연결하되, 그 귀속을 첫째 손의 본문 전체로 확대하지 않는다.","둘째 손이 수신자여야 할 이유는 없다. 결손 대명사는 인사 대상의 세부 문제이며 발신자·수신자 식별을 무효화하지 않는다.","복수 동사는 인사를 전하는 인물의 수와 관련될 수 있지만 물리적 공동 집필이나 발신 연도를 정하지 않는다.","한 부분의 자필 확인은 다른 손으로 적힌 본문을 같은 자필로 만들지 않는다. 판독 확실성도 글자·어구마다 다르다."],"sourceReferences":[{"title":"Tab.Vindol. 291. Birthday Invitation of Sulpicia Lepidina — Roman Inscriptions of Britain","url":"https://romaninscriptionsofbritain.org/inscriptions/TabVindol291","note":"원문 비평판 본문 직접 열람. 재료·97–105년의 편년 기준, m¹/m², 라틴어 본문·번역, 9–10행의 salutant·filiolus와 대명사 복원 논의를 확인했다."}],"verified":true,"estimatedDifficulty":"극상: 고문서학적 손 구분·라틴어 수 일치·본문비평·맥락 편년·부분 자필을 결합","verification":{"method":"공개 원문 비평판의 Support, Text, Edition, Translation 및 9–10행 주석과 후기 보정을 직접 대조했다.","result":"제시한 정답만 성립한다. 편집자가 확정하는 부분과 복원 논의가 남는 부분을 구분했으며, 특정 발신 연도를 만들어 내지 않았다."},"questionId":35},{"localId":"R10","category":"희귀 사실","difficulty":7,"questionText":"오클로 천연 원자로의 운전 이력은 사람이 당시 시계를 달아 기록한 자료가 아니라 핵분열 생성물의 동위원소 흔적에서 복원한 것이다. Meshik 등의 2004년 원논문은 우라늄이 없는 La–Ce–Sr–Ca 함유 알루미늄계 수산화인산염 광물에 포획된 핵분열 기원 제논과 크립톤을 분석했다. 제논의 특정 동위원소 조성으로부터 제시된 운전 모형은 30분 가동 뒤 2.5시간 휴지의 반복이다. 운반 광물에 우라늄이 없다는 사실과, 포획된 기체가 인접 핵분열의 기록이라는 해석은 논리적으로 모순되지 않는다.\n\n다음은 그 반복 간격만 채택한 가상 공학 계산이다. t=0에서 가동이 시작되고 가동 중 열출력은 정확히 12 MW, 휴지 중에는 0이며 잔열도 무시한다. 가동은 [0,30), [180,210), [360,390)분처럼 계속된다. 연구자는 최초 450분 동안의 총에너지와 그 구간 평균출력을 계산한 뒤, 완전한 주기를 아주 많이 포함하는 장기 평균출력과 비교하려 한다. 구간 끝은 중간 휴지기 안에 놓이며, 가동률을 측정구간 길이에 관계없이 기계적으로 적용해서는 안 된다.\n\n광물의 우라늄 부재에 대한 해석을 유지하면서 450분 총에너지, 450분 평균출력, 장기 평균출력을 순서대로 옳게 제시한 것은? 30분 가동과 2.5시간 휴지를 합쳐 한 주기를 만든다는 사실, 유한 구간의 경계 효과, MW와 MWh의 차원을 모두 반영해야 한다.","options":["기체 기록과 양립 · 18 MWh · 2.4 MW · 2 MW","기체 기록과 모순 · 18 MWh · 2.4 MW · 2 MW","기체 기록과 양립 · 18 MWh · 2.4 MW · 2.4 MW","기체 기록과 양립 · 90 MWh · 12 MW · 2 MW","기체 기록과 양립 · 15 MWh · 2 MW · 2 MW"],"correctAnswer":0,"detailedExplanation":"한 완전 주기는 30+150=180분이고 장기 가동률은 30/180=1/6이다. 그러나 [0,450)분에는 30분 가동이 세 번 완전히 포함되어 총가동시간은 90분=1.5시간이다. 에너지는 12 MW×1.5 h=18 MWh, 유한 구간 평균은 18/7.5=2.4 MW이다. 장기 평균은 12/6=2 MW이므로 두 평균은 같지 않다. 우라늄 없는 포획 광물은 핵분열이 그 광물 내부에서 일어났다는 주장을 하지 않으며, 이동·포획된 생성물의 기록과 양립한다. 원자로 시간비와 광물 정보는 [Meshik 등의 원논문 초록](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.93.182302)에서 직접 확인되며, 12 MW는 실제 오클로 출력의 주장이 아니라 문제의 가정이다.","wrongOptionExplanations":["정답. 유한 관측창에는 세 가동 펄스가 들어가 장기 가동률보다 가동시간 비율이 크다.","핵분열의 장소와 생성물의 포획 장소를 동일시했다. 우라늄 없는 광물의 기체도 외부 기원 기록일 수 있다.","유한창 평균2.4 MW를 장기 극한으로 바꾸었다. 완전 주기들의 평균은 반드시2 MW다.","휴지기에도 가동 출력12 MW가 계속된 것처럼 계산했다. 주어진 모형은 휴지 출력0이다.","450분에 장기 가동률1/6을 그대로 곱했다. 이 구간의 실제 가동률은90/450=1/5이다."],"sourceReferences":[{"title":"Meshik, Hohenberg & Pravdivtseva (2004), Record of Cycling Operation of the Natural Nuclear Reactor in the Oklo/Okelobondo Area in Gabon","url":"https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.93.182302","note":"원논문 초록의 U-free 광물·핵분열 Xe/Kr·30분 활성 및2.5시간 휴지. 출력12 MW와 관측창은 출제자가 만든 명시 가정."}],"verified":true,"estimatedDifficulty":"극상: 포획기록 해석→주기합산→펄스 계수→시간단위 변환→유한평균→장기평균의 6단계","verification":{"method":"APS의 원논문 초록을 직접 열람하고 450분 구간의 가동구간을 열거하여 차원별로 재계산했다.","result":"가동90분, 에너지18 MWh, 유한평균2.4 MW, 장기평균2 MW. 기체 기록과 U-free 광물은 양립."},"questionId":36},{"localId":"chem4","category":"화학","difficulty":7,"questionText":"가상의 금속 산화형 O와 환원형 R은 \\(\\mathrm{O}+e^-\\rightleftharpoons\\mathrm R\\)의 한 전자 전극반응을 하며, 유리종 기준 표준환원전위는 298.15 K에서 0.300000 V이다. 둘 다 유리 리간드 \\(L\\)과 1:1 착물만 만들고 \\(\\beta_O=[OL]/([O][L])=10^6\\ \\mathrm{M^{-1}}\\), \\(\\beta_R=[RL]/([R][L])=10^3\\ \\mathrm{M^{-1}}\\)이다. 리간드는 \\(HL\\rightleftharpoons H^++L\\)의 산해리도 하며 pKa=8.000이다. 매우 큰 외부 완충제가 pH를 7.000에 고정하므로 결합에 따라 풀려나는 양성자는 pH를 바꾸지 않는다. HL은 금속과 결합하지 않으며 리간드의 산해리와 금속 결합은 모두 빠른 평형이다.\n\n용액의 분석 총농도는 \\([O]+[OL]=[R]+[RL]=1.0000\\ \\mathrm{mM}\\), \\([L]+[HL]+[OL]+[RL]=10.000\\ \\mathrm{mM}\\)이다. 전극은 충분히 작아 측정 중 이 총농도를 바꾸지 않으며 산화형·환원형 총량의 비는 정확히 1로 유지된다. 용액은 이상적이고 활동도 표준상태는 1 M이다. 리간드 총량을 곧바로 유리 \\([L]\\)로 대입하거나 총 O/R 비를 유리종 비로 사용하지 말라. \\(R=8.314462618\\ \\mathrm{J\\,mol^{-1}K^{-1}}\\), \\(F=96485.33212\\ \\mathrm{C\\,mol^{-1}}\\)를 사용하고 주어진 전위와 같은 기준전극에 대해 보고한다. 평형전위와 환원형 금속 중 착물로 존재하는 분율 \\(([RL]/R_{\\rm tot})\\)의 조합은?","options":["\\((0.125506\\ \\mathrm V,\\ 0.890229)\\)","\\((0.456285\\ \\mathrm V,\\ 0.437730)\\)","\\((0.124968\\ \\mathrm V,\\ 0.909091)\\)","\\((0.143715\\ \\mathrm V,\\ 0.437730)\\)","\\((0.300000\\ \\mathrm V,\\ 0.437730)\\)"],"correctAnswer":3,"detailedExplanation":"pH와 pKa로부터 \\([HL]=10[L]\\)이다. \\(\\ell=[L]\\)라 하면 총 O와 R의 물질수지에 의해 \\([O]=0.001/(1+10^6\\ell)\\), \\([R]=0.001/(1+10^3\\ell)\\)이다. 두 결합 리간드와 비결합 산·염기를 모두 합친 식은 \\(11\\ell+0.001\\,10^6\\ell/(1+10^6\\ell)+0.001\\,10^3\\ell/(1+10^3\\ell)=0.010\\)이다. 좌변은 \\(\\ell\\ge0\\)에서 엄격히 증가하므로 물리근이 유일하며, \\(\\ell=7.78504811\\times10^{-4}\\ \\mathrm M\\)이다.\n\n따라서 유리종 비는 \\([O]/[R]=(1+10^3\\ell)/(1+10^6\\ell)\\)이고 Nernst 식은 \\(E=E^\\circ+(RT/F)\\ln([O]/[R])=0.143714974\\ \\mathrm V\\)이다. 환원형의 결합분율은 \\(10^3\\ell/(1+10^3\\ell)=0.437729944\\)이다. 산화형을 더 세게 안정화하는 리간드는 유리 O/R 비를 낮추어 전위를 낮춘다는 부호 검사도 맞는다.","wrongOptionExplanations":["리간드 물질수지에서 \\([HL]=10[L]\\)를 빠뜨렸다. 그러면 \\([L]=0.0081098941\\ \\mathrm M\\), 전위 0.125506 V, 환원형 결합분율 0.890229가 나온다.","착물 안정화에 따른 전위 이동 부호를 뒤집었다. 산화형의 더 강한 결합은 전위를 낮춘다.","리간드의 총농도 0.010 M를 유리 \\([L]\\)로 직접 넣어 산해리와 리간드 소모를 모두 무시했다.","정답. 산해리와 두 산화상태의 결합을 포함한 유일 물질수지 근을 Nernst 식에 대입했다.","분석 총 O/R 비 1을 유리종 비로 대입했다. 결합상수 차이가 있으므로 유리종 비는 1이 아니다."],"sourceReferences":[{"title":"IUPAC Gold Book, Nernst equation","url":"https://goldbook.iupac.org/terms/view/09068","note":"전극전위는 유리 반응종의 활동도 및 착물 형성에 의존한다는 원리; O·R은 가상 종."}],"verified":true,"estimatedDifficulty":"대학원 종합시험 수준; 산해리→각 산화상태 물질수지→리간드 총수지→유일근→Nernst→분율의 6단계","verification":{"method":"금속·리간드·산해리의 전 화학종을 복원해 세 물질수지를 확인하고 유리종으로 전위를 계산; Python/NumPy 독립 계산","result":"PASS; free L=0.00077850481108 M; E=0.143714974193 V; bound reduced fraction=0.437729943844"},"questionId":37},{"localId":"BIO-10","category":"생물학","difficulty":7,"questionText":"세 좌위 A/a, B/b, C/c에 대해 삼중 이형접합체를 삼중 열성 동형접합체와 검정교배하였다. 배아에서 유래한 각 개체는 이형접합 부모가 제공한 배우자형 하나를 정확히 대표한다. 관측된 최종 계수는 ABC 1152, abc 2880, Abc 360, aBC 144, ABc 360, abC 576, AbC 32, aBc 20이다. 표본오차 없이 이 값들이 기대 계수에 정확히 비례한다고 가정한다.\n\n그러나 두 단계의 계수 왜곡이 있다. B 대립유전자를 받은 배아의 생존확률은 b를 받은 배아의 정확히 1/2이다. 이어서 생존 개체의 서열 분석에서 C 대립유전자를 가진 경우의 검출확률은 c인 경우의 정확히 4/5이다. 두 효과는 조건부 독립이며 A와 다른 좌위 조합에 별도 효과가 없다. 모든 상수 비례 인자는 빈도를 정규화할 때 상쇄된다. 왜곡을 역보정한 뒤 가장 흔한 상보적 두 배우자형을 부모형, 가장 드문 상보적 두 형을 이중 교차형으로 정한다. 각 인접 구간 안의 다중 교차는 없고, 두 구간의 교차가 독립이라면 기대 이중 교차빈도는 두 구간 재조합률의 곱이다. 간섭도는 1−관측 이중 교차빈도/독립 기대빈도이다. 유전자 순서, 간섭도, 그리고 바깥 두 좌위가 부모형 조합인 배우자에 조건부로 이중 교차형일 확률을 올바르게 나열한 것은?","options":["A–B–C; 간섭도 9/19; 조건부확률 1/100","A–B–C; 간섭도 0; 조건부확률 1/73","A–C–B; 간섭도 9/19; 조건부확률 1/73","A–B–C; 간섭도 9/19; 조건부확률 1/73","A–B–C; 간섭도 10/19; 조건부확률 1/73"],"correctAnswer":3,"detailedExplanation":"1단계: 생존과 검출 확률의 곱으로 각 계수를 나눈다. ABC는 1152/(1/2×4/5)=2880이고, abc는 2880이다. 같은 방식으로 (ABC,abc,Abc,aBC,ABc,abC,AbC,aBc)의 보정 계수는 (2880,2880,360,360,720,720,40,40)이다. 합은 8000이다.\n\n2단계: 부모형은 ABC/abc이고 이중 교차형은 AbC/aBc이다. 부모형과 이중 교차형 사이에서 가운데 좌위만 반전되므로 B가 가운데이다. 따라서 순서는 A–B–C 또는 그 역순이다.\n\n3단계: A–B 구간 단일 교차형은 Abc/aBC이며 총 720이다. 이중 교차 80도 이 구간의 재조합에 포함하므로 r_AB=(720+80)/8000=1/10이다.\n\n4단계: B–C 구간 단일 교차형은 ABc/abC이고 총 1440이다. 따라서 r_BC=(1440+80)/8000=19/100이다. 관측 이중 교차빈도는 80/8000=1/100이다.\n\n5단계: 독립 기대빈도는 (1/10)(19/100)=19/1000이다. 일치계수는 (1/100)/(19/1000)=10/19이므로 간섭도는 9/19이다.\n\n6단계: 바깥 A,C가 부모형 조합인 배우자는 비교차 부모형 5760개와 이중 교차형 80개이다. 그러므로 해당 조건 아래 이중 교차 확률은 80/(5760+80)=1/73이다. 무조건부 이중 교차 확률 1/100과 구분해야 한다.","wrongOptionExplanations":["1/100은 전체 배우자에서의 이중 교차빈도이다. 바깥 좌위가 부모형이라는 조건으로 분모를 제한하면 1/73이다.","관측 이중 교차빈도 0.01은 독립 기대 0.019보다 작다. 따라서 교차 간섭은 양수이고 0이 아니다.","부모형 ABC와 이중 교차형 AbC를 비교하면 바뀌는 것은 B이다. 따라서 C를 가운데에 놓을 수 없다.","정답이다. 단계별 모형 해석과 수치 검산을 모두 만족한다.","10/19은 일치계수이다. 문제의 간섭도는 일치계수를 1에서 뺀 9/19이다."],"sourceReferences":[{"title":"Studying Gene Expression and Function — Molecular Biology of the Cell","url":"https://www.ncbi.nlm.nih.gov/books/NBK26818/","note":"공식 공개 교재의 유전 연관·재조합 지도 원리를 확인했다. 생존·검출 보정과 계수는 독자적으로 설정했다."}],"verified":true,"estimatedDifficulty":"최상위권 대학원 수준의 다단계 모형 추론","verification":{"method":"독립 Python 검산: 정확분수·전수 열거·모멘트 방정식·오목 최적화 및 지문 길이/스키마 점검","result":"corrected N=8000; order ABC; rAB=1/10; rBC=19/100; interference=9/19; conditional=1/73"},"questionId":38},{"localId":"R15","category":"희귀 사실","difficulty":7,"questionText":"통발속 수생 식물의 포충낭은 먹이가 건드리는 순간에만 에너지를 처음 만들어 내는 장치가 아니다. Vincent 등의2011년 고속촬영 연구와 Joyeux 등의 역학 모형은 느린 능동적 배수로 포충낭을 찌그러뜨려 탄성에너지를 저장하고, 빠른 수동적 흡입으로 방출하는 두 시간척도를 구분한다. 문은 경첩 달린 강체판처럼 단순 회전한다고만 보기보다 압력과 기계적 자극으로 좌굴하는 유연한 밸브로 모형화되었다. 원촬영에서 개방은 대략0.4–0.8 ms에 일어났다는 사실도 느린 준비와 빠른 방출의 구분을 요구한다.\n\n이 생물에서 영감을 얻은 두 가상 장치 A와 B를 비교한다. 둘 다 한 자유도 선형 탄성 근사에서 저장에너지 U=kx²/2, 방출 직전 복원력 F=kx, 관성적 시간척도 τ=√(m/k)를 따른다고 명시한다. B는 A보다 변형량 x가2배, 유효 강성 k가1/4배이고 유효질량 m과 힘이 작용하는 면적 S는 같다. 순간 압력차의 힘 척도는 Δp=F/S, 재설정에 필요한 최소 대사 일은 W=U/η이며 효율 η도 같다. 점성손실·밸브 문턱 변화는 이 가상 비교에서 제외한다.\n\nB/A의 저장에너지·복원력·압력차·시간척도·최소 대사 일의 비와, 빠른 흡입이 수동적이라는 말의 정확한 뜻을 모두 옳게 묶은 것은? 이 선형 근사를 실제 식물의 모든 변형 범위에 적용되는 정밀 법칙으로 주장하지 않으면서, 저장 과정의 에너지 공급을 빠른 방출 과정과 구분해야 한다.","options":["1/2·1/2·1/2·2·1/2 · 빠른 방출이 수동적이어도 느린 재설정의 에너지 공급은 필요함","1·1/2·1/2·2·1 · 빠른 방출이 수동적이어도 느린 재설정의 에너지 공급은 필요함","1·1/2·1/2·2·1/2 · 빠른 방출이 수동적이어도 느린 재설정의 에너지 공급은 필요함","1·1/2·1/2·2·1 · 빠른 방출이 수동적이면 재설정도 외부 에너지 없이 영구 반복됨","1·1/2·1/2·1/2·1 · 빠른 방출이 수동적이어도 느린 재설정의 에너지 공급은 필요함"],"correctAnswer":1,"detailedExplanation":"U의 비는(1/4)×2²=1이다. F의 비는(1/4)×2=1/2이고 면적이 같으므로 Δp도1/2배다. 질량이 같고 강성이1/4이므로 τ의 비는√4=2다. 효율도 같아 W=U/η의 비는1이다. 방출이 수동적이라는 말은 이미 저장된 에너지로 빠른 운동이 가능하다는 뜻이며, 능동적 배수에 필요한 재설정 에너지가 사라진다는 뜻이 아니다. [고속촬영 원연구](https://pmc.ncbi.nlm.nih.gov/articles/PMC3151700/)는 저장 탄성에너지와 빠른 개폐를 연결하고, [원역학 모형](https://arxiv.org/abs/1101.0484)은 느린 능동 수축·빠른 수동 흡입 및 유연 밸브 좌굴을 제시한다. 다섯 비례식은 문제에 명시된 설계 모형의 연역 결과다.","wrongOptionExplanations":["저장에너지의 x²를 x로 계산했다.강성1/4과 변형량제곱4가 상쇄되어 U는같다.","정답. 에너지는 x의 제곱, 힘은 x의1차, 시간은 강성의 역제곱근으로 변하며 재설정 일은 저장에너지와 함께 유지된다.","최소 일은 힘만으로 정해지지 않는다.변형거리도 달라지고 U가 같으며 η도 같으므로 W비는1이다.","수동적 에너지 방출을 무에너지 생성으로 혼동했다.낭을 다시 배수하고 찌그러뜨리는 준비 과정에 일이 필요하다.","강성을 낮추면 같은 질량의 관성적 시간척도는 길어진다.√(m/k)에서 k를 분자처럼 처리했다."],"sourceReferences":[{"title":"Vincent et al. (2011), Ultra-fast underwater suction traps","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC3151700/","note":"원촬영 연구의 저장 탄성에너지·문 개폐 및개방0.4–0.8 ms. DOI 10.1098/rspb.2010.2292."},{"title":"Joyeux, Vincent & Marmottant (2011), Mechanical model of the ultra-fast underwater trap of Utricularia","url":"https://arxiv.org/abs/1101.0484","note":"원모형 초록의 능동적 느린 수축/수동적 빠른 흡입,좌굴 유연 밸브와 경첩 강체판 구분. DOI 10.1103/PhysRevE.83.021911."}],"verified":true,"estimatedDifficulty":"극상: 저장에너지→복원력→면적환산 압력→관성시간→효율환산 일→능동·수동 에너지회계","verification":{"method":"고속촬영 원논문의 개방시간·에너지 해석과 원역학 모형 초록을 검색·대조했다. 가상 선형 모형의 다섯 비를 각각 계산했다.","result":"U비1,F비1/2,Δp비1/2,τ비2,W비1. 수동방출은 무에너지 재설정을 함의하지 않음."},"questionId":39},{"localId":"astro1","category":"천체물리학·우주론","difficulty":7,"questionText":"점광원 퀘이사의 두 상이 렌즈 중심을 원점으로 하는 동일한 축에서 \\(\\theta_+=+2.40''\\), \\(\\theta_-=-1.20''\\)에 관측되고, 음의 위치에 있는 상이 72.00일 늦게 도착한다. 관측자가 외부 질량판을 무시하여 적합한 특이 등온구 모형의 퍼텐셜은 \\(\\psi_0(\\theta)=\\theta_E|\\theta|\\)이며, 페르마 퍼텐셜은 \\(\\phi=\\tfrac12(\\theta-\\beta)^2-\\psi\\)이다. 거리 척도는 \\(D_{\\Delta t}=(1+z_l)D_lD_s/D_{ls}\\)로 정의하며, 시간지연은 \\(\\Delta t=D_{\\Delta t}\\Delta\\phi/c\\)를 따른다.\n\n독립적인 환경 관측으로 실제 퍼텐셜이 \\(\\psi=0.80\\psi_0+0.20\\theta^2/2\\)라는 사실이 밝혀졌다. 이 변환에서 원천 위치도 변해야 하며, 실제 원천 위치를 등온구 적합값과 같다고 두면 안 된다. 렌즈와 원천의 적색편이 및 무차원 우주론 매개변수를 고정하면 \\(D_{\\Delta t}\\propto H_0^{-1}\\)이고, 해당 계에서 \\(H_0=70.00\\ \\mathrm{km\\,s^{-1}Mpc^{-1}}\\)일 때의 이론값은 \\(2000.0\\ \\mathrm{Mpc}\\)이다. \\(c=299792458\\ \\mathrm{m\\,s^{-1}}\\), \\(1\\ \\mathrm{Mpc}=3.08567758149\\times10^{22}\\ \\mathrm m\\), \\(1''=\\pi/648000\\ \\mathrm{rad}\\)를 사용하고 마이크로렌즈와 운동 효과는 무시한다. 실제 \\(H_0\\)를 소수 첫째 자리까지 구하면?","options":["\\(156.8\\ \\mathrm{km\\,s^{-1}Mpc^{-1}}\\)","\\(94.1\\ \\mathrm{km\\,s^{-1}Mpc^{-1}}\\)","\\(117.6\\ \\mathrm{km\\,s^{-1}Mpc^{-1}}\\)","\\(147.0\\ \\mathrm{km\\,s^{-1}Mpc^{-1}}\\)","\\(75.3\\ \\mathrm{km\\,s^{-1}Mpc^{-1}}\\)"],"correctAnswer":1,"detailedExplanation":"등온구 렌즈방정식의 두 해에서 \\(\\theta_E=(2.40+1.20)/2=1.80''\\), \\(\\beta_0=(2.40-1.20)/2=0.60''\\)이다. 따라서 늦은 상에서 빠른 상을 뺀 페르마 차이는 \\(\\Delta\\phi_0=2\\theta_E\\beta_0=2.16\\ \\mathrm{arcsec^2}\\)이다. 각도를 라디안으로 바꾸면 질량판을 무시한 추정 거리는 \\(D_0=c(72\\times86400)/[2.16(\\pi/648000)^2]=1190.4548\\ \\mathrm{Mpc}\\)가 된다.\n\n질량판 변환의 계수 \\(\\lambda=0.80\\)에서 \\(\\beta=\\lambda\\beta_0\\), \\(\\Delta\\phi=\\lambda\\Delta\\phi_0\\)이다. 같은 지연을 설명하려면 실제 거리는 \\(D_{\\rm true}=D_0/\\lambda=1488.0685\\ \\mathrm{Mpc}\\)여야 한다. 그러므로 \\(H_{0,\\rm true}=70(2000/D_{\\rm true})=94.0817\\)이다. 렌즈 적색편이 인자는 이미 \\(D_{\\Delta t}\\) 정의에 포함되어 있어 추가로 곱하지 않는다.","wrongOptionExplanations":["페르마 차이 \\(2.16\\ \\mathrm{arcsec^2}\\) 대신 상 사이 간격의 수치 \\(3.60\\)을 제곱각 차이처럼 넣었다. 허블상수는 페르마 차이에 비례하므로 156.8이 된다.","정답. 상 위치로 얻은 페르마 차이와 질량판 변환에 따른 거리 보정을 모두 적용했다.","외부 수렴을 무시한 값 \\(70\\times2000/1190.4548=117.6021\\)이다.","질량판이 페르마 차이를 줄인다는 사실은 사용했으나 \\(H_0\\) 보정을 반대 방향으로 하여 무보정 값에 0.8을 나눴다.","올바른 실제 값에 질량판 계수 0.8을 한 번 더 곱한 이중 보정이다."],"sourceReferences":[{"title":"M. C. Miller, Gravitational lensing","url":"https://pages.astro.umd.edu/~mcmiller/teaching/astr680/lecture13.pdf","note":"얇은 렌즈의 페르마 퍼텐셜과 시간지연 원리; 수치 조건은 독자 구성."}],"verified":true,"estimatedDifficulty":"대학원 종합시험 수준; 상 위치 역산→페르마 차이→단위 변환→질량판 변환→거리 척도→허블상수의 6단계","verification":{"method":"실제 질량판 퍼텐셜을 두 상에서 직접 평가하고 정상조건과 시간지연을 검산; Python/NumPy 독립 계산","result":"PASS; D_true=1488.068504637 Mpc; H0=94.081690167"},"questionId":40},{"localId":"astro5","category":"천체물리학·우주론","difficulty":7,"questionText":"비회전 구대칭 중성자별의 폭발 후 냉각 꼬리에서 측정한 각면적 매개변수는 \\(\\sqrt A=2.48018823172\\times10^{-17}\\)이고, 광구가 별 표면에 닿는 순간의 볼로미터 플럭스는 \\(F_{{\\rm Edd},\\infty}=1.31087916060\\times10^{-11}\\ \\mathrm{W\\,m^{-2}}\\)이다. 거리는 정확히 \\(D=10.000\\ \\mathrm{kpc}\\), 색보정인자는 \\(f_c=1.4000\\), 질량당 산란 불투명도는 \\(\\kappa=0.034000\\ \\mathrm{m^2kg^{-1}}\\)이다. \\(A\\equiv F_\\infty/(\\sigma_{\\rm SB}T_{c,\\infty}^4)\\)이며 관측 색온도는 무한원 관측자 기준이다. 별 전체가 균일하게 복사하고 광구와 별의 둘레반지름이 같다고 가정한다.\n\n표면의 중력적 적색편이와 색보정을 포함한 관측식은 \\(A=R^2/[D^2f_c^4(1-u)]\\), \\(F_{{\\rm Edd},\\infty}=GMc\\sqrt{1-u}/(\\kappa D^2)\\), \\(u=2GM/(Rc^2)\\)이다. 거리나 플럭스의 경험적 오차는 이 문제에서 없다. 두 식의 역문제에 대수적 해가 여러 개면 전부 조사하고, 별 표면이 광자구 밖이라는 독립 조건 \\(R>3GM/c^2\\)를 적용하여 해를 선택한다. 회전·대기 흡수·방출의 비등방성은 무시한다. \\(G=6.67430\\times10^{-11}\\), \\(c=299792458\\)의 SI 값, \\(M_\\odot=1.98847\\times10^{30}\\ \\mathrm{kg}\\), \\(1\\ \\mathrm{kpc}=3.08567758149\\times10^{19}\\ \\mathrm m\\)를 쓸 때 허용되는 \\((M/M_\\odot,R/\\mathrm{km})\\)는?","options":["\\((1.067,\\ 12.550)\\)","\\((1.275,\\ 15.000)\\)","\\((1.275,\\ 12.550)\\)","\\((1.947,\\ 8.216)\\)","\\((1.524,\\ 15.000)\\)"],"correctAnswer":2,"detailedExplanation":"먼저 \\(R_\\infty\\equiv R/\\sqrt{1-u}=Df_c^2\\sqrt A=15.000\\ \\mathrm{km}\\)를 얻는다. 두 플럭스식을 결합한 무차원수는 \\(\\alpha=F_{{\\rm Edd},\\infty}\\kappa D^2/(c^3R_\\infty)=0.105000\\)이다. \\(GM=(u/2)Rc^2\\)와 \\(R=R_\\infty\\sqrt{1-u}\\)를 대입하면 \\(\\alpha=u(1-u)/2\\), 즉 \\(u^2-u+0.210000=0\\)이다. 두 근은 0.3과 0.7로 모두 지평선 밖에 있으나, 주어진 광자구 조건은 \\(u\u003c2/3\\)이므로 0.7은 제외된다.\n\n남은 해에서 \\(R=15\\sqrt{0.7}=12.549900\\ \\mathrm{km}\\), \\(M=uRc^2/(2G)=1.274818M_\\odot\\)이다. 버린 해는 \\((1.947317M_\\odot,8.215838\\ \\mathrm{km})\\)로 원래 두 관측식 자체에는 들어맞는다. 따라서 '관측식과 맞는가'뿐 아니라 명시한 독립 반지름 제약을 만족하는지가 유일해를 정한다.","wrongOptionExplanations":["실제 반지름은 맞지만 에딩턴 플럭스에서 \\(\\sqrt{1-u}\\)를 생략해 \\(M=F\\kappa D^2/(Gc)\\)로 계산했다. 그 값은 실제 질량의 \\(\\sqrt{0.7}\\)배이다.","질량은 허용 근으로 구했지만 반지름에는 \\(R_\\infty\\)를 그대로 사용했다. 실제 \\(R\\)에는 \\(\\sqrt{1-u}\\)가 더 필요하다.","정답. 겉보기 반지름과 실제 둘레반지름을 구별하고 두 compactness 해를 독립 조건으로 판별했다.","두 관측식에는 맞지만 \\(u=0.7>2/3\\)이므로 표면이 광자구 밖이라는 조건을 위반한다.","겉보기 반지름 15 km를 실제 반지름으로 대입하여 적색편이 보정을 누락했다."],"sourceReferences":[{"title":"M. C. Miller, Measurements of neutron star masses and radii","url":"https://pages.astro.umd.edu/~mcmiller/teaching/astr680/lecture22.pdf","note":"관측 온도와 대기 색보정, 겉보기 반지름 역산의 원리; 정확한 관측식은 지문에 제공."}],"verified":true,"estimatedDifficulty":"대학원 종합시험 수준; 관측식 소거→무차원화→두 근→광자구 제약→실제 반지름→질량의 6단계","verification":{"method":"원 관측식의 compactness 잔차에서 두 수치근을 탐색·재대입하고 광자구 제약을 검사; Python/NumPy 독립 계산","result":"PASS; two u=[0.2999999999985077, 0.7000000000014923]; accepted M=1.274817971 Msun,R=12.549900398 km"},"questionId":41},{"localId":"physics-15","category":"물리학","difficulty":7,"questionText":"고전적인 두 질점이 한 직선 위에서 평형점으로부터 변위 \\(q_1,q_2\\)를 가지며 움직인다. 질량은 각각 \\(m=1.00\\,\\mathrm{kg}\\), 각 질점과 고정 지지대 사이 용수철 상수는 \\(k=1.00\\,\\mathrm{N\\,m^{-1}}\\), 두 질점 사이 결합 용수철 상수도 \\(k_c=1.00\\,\\mathrm{N\\,m^{-1}}\\)이다. 퍼텐셜은 \\(U=k(q_1^2+q_2^2)/2+k_c(q_1-q_2)^2/2\\)이다. 질점 1,2는 각각 온도 \\(T_L=3T_0,T_R=T_0>0\\)인 독립 무한 열저장고와 접촉한다. 운동방정식은 \\(m\\ddot q_j=-\\partial_{q_j}U-\\gamma\\dot q_j+\\xi_j(t)\\), \\(\\gamma=1.00\\,\\mathrm{kg\\,s^{-1}}\\)이다.\n\n잡음은 평균 0인 독립 가우스 백색잡음으로 \\(\\langle\\xi_j(t)\\xi_l(t')\\rangle=2\\gamma k_BT_j\\delta_{jl}\\delta(t-t')\\)를 만족한다. 충분히 오래 지나 유일한 정상 가우스 상태에 도달했고 양자 보정이나 추가 외력은 없다. 저장고가 계에 공급하는 평균 열률은 \\(\\dot Q_j=\\gamma[k_BT_j/m-\\langle\\dot q_j^2\\rangle]\\)로 정의한다. 정상상태에서 계의 엔트로피 축적은 0이므로 총엔트로피 생성률은 \\(\\dot S_{\\rm tot}=-\\dot Q_L/T_L-\\dot Q_R/T_R\\)이다. 요구되는 무차원 수 \\(\\dot S_{\\rm tot}/(k_B/(1\\,\\mathrm s))\\)는 어느 것인가? 두 질점에 임의의 국소평형 온도를 대입하지 말고 정상 변위·속도 교차상관으로 열전류와 엔트로피 장부를 연결하시오.","options":["\\(1/9\\)","\\(4/9\\)","\\(1/3\\)","\\(2/9\\)","\\(2/3\\)"],"correctAnswer":3,"detailedExplanation":"1. 시간 단위를 1 s, 질량 단위를 1 kg로 잡고 속도 제곱을 kBT0/m, 변위 제곱을 (kBT0/m)(1 s)²로 나눈 무차원 상관을 쓴다. 운동계수는 a=k+kc=2,b=kc=1, 감쇠 1이고 잡음 온도는 τL=3,τR=1이다.\n\n2. 정상성 \\(d\\langle q_j^2\\rangle/dt=0\\)에서 \\(\\langle q_1v_1\\rangle=\\langle q_2v_2\\rangle=0\\)이다. \\(d\\langle q_1q_2\\rangle/dt=0\\)에서 \\(\\langle q_1v_2\\rangle=-\\langle q_2v_1\\rangle=C\\)라 둔다.\n\n3. Itô 확산항을 포함한 속도 제곱 정상식은 \\(0=-2bC-2V_1+2\\tau_L\\), \\(0=2bC-2V_2+2\\tau_R\\)이다. 따라서 \\(V_1=3-C,V_2=1+C,V_1-V_2=2-2C\\)이다.\n\n4. 속도 교차상관 정상식은 \\(\\langle v_1v_2\\rangle=0\\)을 준다. \\(X_j=\\langle q_j^2\\rangle,X_{12}=\\langle q_1q_2\\rangle\\)라 쓰면 q₁v₂와 q₂v₁ 정상식은 \\(bX_1-aX_{12}-C=0,bX_2-aX_{12}+C=0\\)이다. 빼면 \\(b(X_1-X_2)=2C\\)이다.\n\n5. qⱼvⱼ 정상식은 \\(V_1=aX_1-bX_{12},V_2=aX_2-bX_{12}\\)이다. 따라서 \\(V_1-V_2=a(X_1-X_2)=4C\\)이다. 앞의 2−2C와 같게 놓으면 C=1/3,V₁=8/3,V₂=4/3이다.\n\n6. 원래 단위를 복원하면 \\(J=\\dot Q_L=\\gamma[k_BT_L/m-\\langle\\dot q_1^2\\rangle]=k_BT_0/(3\\,\\mathrm s)\\), \\(\\dot Q_R=-J\\)여서 에너지가 보존된다.\n\n7. 그러므로 \\(\\dot S_{\\rm tot}=J(1/T_R-1/T_L)=[k_BT_0/(3\\,\\mathrm s)][2/(3T_0)]=2k_B/(9\\,\\mathrm s)\\)이고 답은 2/9이다. 온도 T0가 소거되는 이유는 고전 선형계의 공분산과 전류가 온도에 비례하기 때문이다.","wrongOptionExplanations":["정확한 생성률의 절반이다. 두 저장고의 엔트로피 흐름이나 잡음 상관의 계수 2를 잘못 처리했다.","저장고의 열률 부호를 모두 양수로 더하거나 엔트로피 생성을 두 번 세었다. 정상상태에서 QdotL=−QdotR이다.","정규화한 에너지 전류 1/3을 답했다. 엔트로피에는 역온도 차이를 곱해야 한다.","정답이다. C=1/3에서 전류와 두 저장고의 엔트로피 흐름을 연결한 값이다.","교차상관을 풀지 않고 전류를 직접 온도차로 놓아 기계적 전달 저항을 누락한 값이다."],"sourceReferences":[{"title":"Z. Rieder, J. L. Lebowitz and E. Lieb, Properties of a Harmonic Crystal in a Stationary Nonequilibrium State","url":"https://doi.org/10.1063/1.1705319","note":"조화격자의 비평형 정상상태 상관행렬 원리 확인. 두 질점과 생성률은 직접 유도."},{"title":"D. Roy and A. Dhar, Heat transport in ordered harmonic lattices","url":"https://arxiv.org/abs/0711.4318","note":"Langevin 저장고 잡음과 정상 열전류 정의 확인."}],"verified":true,"estimatedDifficulty":"대학원 최상: 확률미분 정상 공분산·교차상관·에너지 전류·엔트로피의 7단계","verification":{"method":"4차원 OU 과정의 AC+CAᵀ+D=0을 16×16 선형식으로 직접 풀이하고 두 저장고의 열률과 엔트로피 흐름 계산","result":"C=[[1.6666666666666665, 0.6666666666666666, -1.3877787807814457e-16, 0.33333333333333337], [0.666666666666667, 0.9999999999999999, -0.33333333333333376, 2.1279274638648835e-16], [8.326672684688674e-17, -0.3333333333333333, 2.6666666666666665, 8.891396517560776e-17], [0.3333333333333335, 1.5111368946286849e-16, 1.7270135938613544e-16, 1.333333333333333]]; QL/(kBT0/s)=0.33333333333333; QR/(kBT0/s)=-0.33333333333333; sigma/(kB/s)=0.22222222222222","computedValue":0.22222222222222188,"correctChoiceCount":1,"nearestWrongChoiceDistance":0.11111111111111077},"questionId":42},{"localId":"H09","category":"세계사·고고학·고문헌","difficulty":7,"questionText":"드레스덴 마야 코덱스의 디지털 면 목록을 구축한다. 소장기관 SLUB의 재료 설명에 따르면 책은 양면에 글·그림이 있는 잎 35장과 한 면에만 글·그림이 있는 잎 4장으로 이루어져 있다. 원래는 나무껍질 섬유를 불리고 두들겨 만든 아마테에 탄산칼슘 바탕을 입힌 뒤, 길이 3.56미터의 띠를 병풍처럼 접었다. 그을음 먹과 색료가 사용되며, 마야 청색은 인디고와 광물 팔리고르스카이트의 혼합물로 설명된다. 오늘의 두 띠 전시는 원래 두 권의 책이었다는 뜻이 아니라, 1835년 보존을 위해 책을 나누어 유리 사이에 배치한 결과이다.\n\n기관은 1786년 연결막을 교체할 때 이미 잎 순서가 바뀌었을 가능성도 제시한다. 연구자는 '물리적 잎', '잎의 앞뒤 면', '글·그림이 있는 면', '현대 전시 단위'를 서로 다른 필드로 분리한다. 아울러 채색에 광물이 포함되었다는 사실을 지지체 전체가 동물 가죽이라는 증거로 바꾸지 않으려 한다. 새 목록은 모든 면의 수를 계산하면서도 현대 배열을 고대 독서 순서라고 확정하지 않아야 한다. 이 재료·수량·보존 이력을 동시에 충족하는 레코드는 무엇인가?","options":["물리적 잎은39장이고 전체 면과 글·그림 면은 모두78면이다. 한 면만 장식한 네 잎은 다른 면이 존재하지 않는 예외이므로 별도 계산하지 않는다.","물리적 잎39장·전체78면·글그림74면을 구분한다. 다만 탄산칼슘 바탕과 연결막 교체는 본래 양피지 책이었음을 확정하므로 지지체도 가죽으로 기록한다.","물리적 잎은39장, 전체 면은78면, 글·그림 면은74면이다. 다만 두 전시 띠가 남았으므로 고대에도 두 권이었고 현재 순서는 반드시 원래 순서이다.","물리적 잎은74장, 전체 면은148면이며 두 전시 띠가 이를 나눈다. 광물성 안료를 사용했으므로 지지체는 석판으로 분류한다.","물리적 잎39장·전체78면·글그림74면과 전시 단위2개를 구분한다. 지지체는 수피 섬유로 기록하고, 현재 배열과 원래 순서의 일치는 미확인으로 둔다."],"correctAnswer":4,"detailedExplanation":"① 잎은 35+4=39장이다. ② 물리적 앞뒤 면은 39×2=78면이다. ③ 글·그림이 있는 면은 35×2+4=74면으로 빈 면 4면을 남긴다. ④ 두 띠는 1835년의 전시·보존 단위이지 고대 책의 수가 아니다. ⑤ 바탕층·안료·후대 연결막과 수피 섬유 지지체를 구별해야 한다. 순서 변화 가능성까지 고려하면 현재 배열을 원래 순서로 확정할 수 없다. 잎39장·전체78면·기록74면·전시2개를 구분하는 레코드가 모든 조건을 만족한다.","wrongOptionExplanations":["글·그림이 없는 면도 물리적 면으로 존재한다. 전체78면과 기록된74면을 동일시할 수 없다.","탄산칼슘은 바탕층이고 교체 연결막은 보수 재료이다. 그 때문에 원래 수피 섬유 지지체가 양피지로 바뀌지는 않는다.","수 계산은 맞지만 현대의 두 전시 띠에서 고대 두 권을 도출할 수 없다. 순서 변경 가능성도 명시적으로 제시된다.","글·그림 면74를 물리적 잎74로 혼동했다. 광물성 안료나 바탕은 지지체가 돌이라는 뜻이 아니다.","정답이다. 잎·면·기록 면·전시 단위의 계수를 구분하고 수피 섬유와 후대 보수 재료도 분리한다."],"sourceReferences":[{"title":"Material / Conservation / Presentation — SLUB Dresden","url":"https://www.slub-dresden.de/en/explore/manuscripts/the-dresden-maya-codex/material-conservation-presentation","note":"본문 직접 열람. 양면35·단면4잎, 수피 섬유·3.56m·탄산칼슘·색료, 1786년 순서 변경 가능성, 1835년 두 부분으로 분할한 보존사를 확인했다."},{"title":"The Maya Codex in the SLUB Dresden — SLUB Dresden","url":"https://www.slub-dresden.de/en/explore/manuscripts/the-dresden-maya-codex","note":"본문 직접 열람. 39잎·원래 병풍접기·현재 두 띠 전시를 별도로 교차 확인했다. 연대의 학술적 차이는 문항의 판정에 사용하지 않았다."}],"verified":true,"estimatedDifficulty":"극상: 네 계수 단위 계산·물질 층위 구분·현대 보존과 고대 배열의 분리","verification":{"method":"소장기관의 개요와 재료·보존 본문을 직접 교차 검토하고 39×2 및35×2+4를 독립 계산했다.","result":"제시한 정답만 성립한다. 원래 잎 순서와 표지 형태의 추정을 확정 사실로 사용하지 않았다."},"questionId":43},{"localId":"H07","category":"세계사·고고학·고문헌","difficulty":7,"questionText":"후기 청동기시대 외교문서 EA 23(BM 29793)의 이력을 복원한다. 투슈라타가 아멘호테프 3세에게 보낸 편지의 주본문은 점토 위 아카드어 쐐기문자로, 32행을 다섯 문단으로 나눈다. 뒷면에는 이집트의 서기관이 검은 먹으로 적은 신관문자 세 행의 접수 메모가 덧붙었다. 이 메모에는 수신한 왕의 재위 36년과 남쪽의 '기쁨의 집' 별궁이 언급된다. 연구자는 이를 테베의 말카타 궁전도시와 연결한다. 본문은 여신 샤우슈카의 신상이 이집트를 방문한 뒤 돌아가겠다는 메시지를 포함한다.\n\n그러나 문서는 테베에서의 정식 발굴로 나온 것이 아니라 고미술 시장을 거쳐 입수되었으며, 통상 아마르나 서한군으로 분류된다. 함부르크대 연구는 아케나텐의 새 수도로 왕실 문서가 옮겨졌을 가능성을 제시하지만 정확한 출토 지점을 확정하지 않는다. 신상 방문의 구체적 동기도 논의 중이라고 명시한다. 이처럼 하나의 물건에 서로 다른 문자·언어·기입 단계와 후대 이동 가설이 겹칠 때, 본문의 목적지, 접수 기록, 마지막 매장 장소, 현대 입수 경로를 혼동하지 않은 복원은 어느 것인가?","options":["메모가 재위 36년을 쓰므로 이 숫자는 투슈라타의 재위 연도이다. 따라서 테베의 수신과 아마르나에서의 발견 사이에는 같은 왕의 재위 기간만 개입할 수 있다.","신관문자 메모가 뒤에 쓰였으므로 아카드어 편지는 이집트에서 작성한 발신용 초안이다. 아마르나 서한군이라는 분류는 아멘호테프 3세가 그곳에서 접수했음을 확정한다.","아카드어 본문과 신관문자 메모는 같은 외교문을 중복 번역한 것이다. 두 문자판이 함께 있으므로 신상 방문의 치료 목적과 최종 매장 위치도 확정된다.","아카드어 본문은 외교 메시지, 신관문자 메모는 이집트 측 접수 절차를 보여 준다. 테베의 수신 정황은 강하지만 아마르나로의 이동과 정확한 출토지는 별도로 평가해야 한다.","테베라는 수신 정황과 시장 입수 사실은 확인된다. 그러므로 서한군 전체가 고대에 이동했다는 가설은 배제되고, 신상도 반드시 테베에 영구 기증된 것으로 읽어야 한다."],"correctAnswer":3,"detailedExplanation":"다섯 구분이 필요하다. ① 주본문과 접수 메모는 언어·문자·매체 사용이 다르며 기능도 다르다. ② 메모의 재위 연도는 수신자인 이집트 왕의 행정 맥락이다. ③ 수신 장소의 정황은 곧 최종 출토지가 아니다. ④ 시장 경유 입수로 정확한 출토 위치는 불명확하며 아마르나로의 이동은 합리적 가설이다. ⑤ 신상이 돌아가겠다는 내용과 방문의 동기 확정은 별개다. 본문과 접수 메모를 분리하고 이동을 가설로 남기는 해석이 이 증거 등급을 지킨다.","wrongOptionExplanations":["메모는 아멘호테프 3세의 재위 36년이다. 발신자 투슈라타의 연대로 옮기는 것은 행정 주체의 혼동이다.","수신 측 접수 메모는 발신용 초안이라는 증거가 아니다. 아마르나군 분류가 원래 수신 장소를 새 수도로 바꾸지도 않는다.","메모는 주본문의 전체 번역이 아니라 접수와 관련된 기록이다. 신상 방문의 특정 동기와 최종 매장 위치는 확정되지 않았다.","정답이다. 발신 본문·수신 메모·후대 이동·출토와 입수의 불확실성을 구분한다.","시장 경유는 정확한 출토지 확정을 막지만 고대 문서 이동의 가능성을 배제하지 않는다. 본문도 신상의 귀환을 말한다."],"sourceReferences":[{"title":"A Journey through Kingdoms: A letter from Tušratta to Amenhotep III — Leah Mascia·Szilvia Sövegjártó, CSMC Hamburg","url":"https://www.csmc.uni-hamburg.de/publications/aom/022-en.html","note":"원문 연구 본문 직접 열람. EA23의 32행·5문단, 먹으로 쓴 신관문자 접수 메모, 재위36년·말카타 정황, 고미술 시장·출토지 불명과 아마르나 이전 가설, 신상 방문 동기 논쟁을 확인했다. 저자의 불확실성 표현을 유지했다."}],"verified":true,"estimatedDifficulty":"극상: 문자·기입 기능·재위 편년·문서 이동·출토 불확실성을 종합","verification":{"method":"해당 실물 문서를 분석한 공개 연구의 기술·번역·이동 가설·출토 한계 단락을 직접 대조했다.","result":"제시한 정답만 성립한다. 출토지가 정확히 알려졌다고 하지 않았으며 말카타 식별과 아마르나 이전을 확정 사실로 강화하지 않았다."},"questionId":44},{"localId":"astro2","category":"천체물리학·우주론","difficulty":7,"questionText":"공간적으로 평탄하고 물질만 존재하는 Einstein–de Sitter 우주에서, 동일한 고유 길이와 동일한 등방적 분광광도를 가진 두 표준 막대형 전파원이 같은 각크기로 보인다. 두 원천은 서로 진화하지 않으며, 각 막대는 시선에 수직이고 방출은 상대론적 제트가 아니다. 높은 적색편이 가지의 원천은 \\(z_h=3\\)에 있으며, 다른 원천은 \\(0\u003cz_l\u003c1\\)에 있다. 이 우주의 각지름거리는 \\(D_A(z)=2cH_0^{-1}[1-(1+z)^{-1/2}]/(1+z)\\), 광도거리는 \\(D_L=(1+z)^2D_A\\)이다. 모든 거리는 관측 시점에 정의된 표준 우주론 거리이며 두 식에 같은 \\(H_0\\)를 사용한다.\n\n두 원천의 원천 정지계 분광광도는 관측에 관련된 전 주파수 범위에서 정확히 \\(L_\\nu=L_*(\\nu/\\nu_*)^{-1}\\)이고, 같은 지구 관측 주파수에서 측정한 에너지 플럭스밀도 \\(S_\\nu\\)를 비교한다. 단위 주파수당 에너지와 주파수 간격의 적색편이 변환을 함께 적용해야 하며, 볼로미터 플럭스에 임의의 추가 광자 수 보정을 해서는 안 된다. 광자의 보존, 거리 쌍대성, 투명한 우주를 가정하고 흡수·산란·중력렌즈는 무시한다. 각크기의 등식이 만드는 모든 대수적 근을 검토하여 물리적인 낮은 적색편이 해를 고른 뒤, \\((z_l,S_{\\nu,l}/S_{\\nu,h})\\)를 각각 소수 셋째 자리와 둘째 자리까지 구한 것은?","options":["\\((0.528,\\ 17.94)\\)","\\((0.236,\\ 109.67)\\)","\\((1.250,\\ 9.99)\\)","\\((0.528,\\ 46.98)\\)","\\((0.528,\\ 6.85)\\)"],"correctAnswer":3,"detailedExplanation":"\\(y=\\sqrt{1+z}>1\\)로 놓으면 거리의 무차원 부분은 \\((y-1)/y^3\\)이다. 높은 가지의 \\(y_h=2\\)에서 이 값은 \\(1/8\\)이므로 \\(y^3-8y+8=(y-2)(y^2+2y-4)=0\\)이다. 양수이면서 1보다 큰 다른 근은 \\(y_l=\\sqrt5-1\\)이고, 음수 근은 제곱근의 정의에 위배된다. 따라서 \\(z_l=y_l^2-1=5-2\\sqrt5=0.527864\\)이다.\n\n주파수 구간과 도착률을 함께 변환하면 \\(S_{\\nu_o}=(1+z)L_{(1+z)\\nu_o}/(4\\pi D_L^2)\\)이다. 주어진 지수 -1에서는 앞의 \\((1+z)\\)와 광도 스펙트럼의 인자가 상쇄된다. 두 \\(D_A\\)가 같으므로 \\(D_{L,h}/D_{L,l}=[4/(1+z_l)]^2\\), 따라서 플럭스밀도 비는 \\([4/(1+z_l)]^4=46.9787\\)이다. 각지름거리의 비단조성과 광도거리의 단조성을 구분해야 한다.","wrongOptionExplanations":["분광광도 지수 -1에 이미 포함된 적색편이 보정을 한 번 더 적용한 값이다.","\\(y_l-1\\)을 적색편이로 보고 \\(z_l=y_l^2-1\\) 변환을 누락했다.","각지름거리 최대점의 적색편이 1.25를 두 번째 교점으로 오인했다.","정답. 거리 방정식의 낮은 가지와 단위 주파수당 K 보정을 모두 반영했다.","광도거리 비를 제곱하지 않고 곧바로 플럭스밀도 비로 사용했다."],"sourceReferences":[{"title":"D. W. Hogg, Distance measures in cosmology","url":"https://ned.ipac.caltech.edu/level5/Hogg/paper.pdf","note":"각지름거리·광도거리의 정의와 단위 주파수 플럭스 관계; 조건은 가상 표준원천."}],"verified":true,"estimatedDifficulty":"대학원 종합시험 수준; 비단조 거리의 근 분류와 주파수 K 보정을 결합한 6단계","verification":{"method":"FLRW 적분을 96점 Gauss–Legendre 구적 후 이분법으로 거리 교점을 구함; Python/NumPy 독립 계산","result":"PASS; z_low=0.527864045000; F_low/F_high=46.978713764"},"questionId":45},{"localId":"astro8","category":"천체물리학·우주론","difficulty":7,"questionText":"Schwarzschild 블랙홀 주위의 한 얇은 원형 고리만이 고유 에너지 \\(E_0=6.4000\\ \\mathrm{keV}\\)의 좁은 선을 방출한다. 고리는 안정한 자유 원궤도 \\(r>6\\)에 있고 \\(r\\equiv Rc^2/(GM)\\)이다. 블랙홀계의 우주론 적색편이는 0.2000이며, 지구에서 본 선의 청색·적색 끝은 각각 \\(5.866666667\\), \\(3.733333333\\ \\mathrm{keV}\\)이다. 두 끝은 시선속도의 최대 접근·후퇴 지점에서 나오며 광선 굽힘, 고리 폭, 산란, 별도 선 혼합은 이 모형에서 무시한다. 경사각은 \\(0\u003ci\u003c90^\\circ\\)이고 \\(i=0\\)에서 고리를 정면으로 본다.\n\n고리 위치의 정지 국소 관측자가 잰 궤도 속도는 \\(v/c=1/\\sqrt{r-2}\\), 정지 국소계에서 블랙홀 무한원까지의 중력 인자는 \\(\\sqrt{1-2/r}\\)이다. 방출체의 특수상대론 도플러 인자는 접근·후퇴 양쪽에서 \\(1/[\\gamma_v(1\\mp(v/c)\\sin i)]\\)이며 \\(\\gamma_v=(1-v^2/c^2)^{-1/2}\\)이다. 독립적인 밝기 변동은 동일 고리의 좌표 공전주파수에 해당하며 지구에서는 150.00 Hz이다. Schwarzschild 좌표주파수는 \\(\\Omega^2=GM/R^3\\)을 따른다. 공전의 두 배 주파수라고 해석해서는 안 된다. \\(G=6.67430\\times10^{-11}\\), \\(c=299792458\\), \\(M_\\odot=1.98847\\times10^{30}\\)의 SI 값을 쓸 때 \\((M/M_\\odot,i)\\)는?","options":["\\((8.806,\\ 31.29^\\circ)\\)","\\((4.794,\\ 42.36^\\circ)\\)","\\((9.587,\\ 42.36^\\circ)\\)","\\((4.794,\\ 12.84^\\circ)\\)","\\((5.752,\\ 42.36^\\circ)\\)"],"correctAnswer":1,"detailedExplanation":"먼저 우주론 적색편이를 제거한 선 인자는 \\(g_b=1.2E_b/E_0=1.1\\), \\(g_r=1.2E_r/E_0=0.7\\)이다. 중력 인자와 횡도플러 인자의 곱은 \\(A=\\sqrt{1-2/r}/\\gamma_v=\\sqrt{1-3/r}\\)이고, \\(b=(v/c)\\sin i\\)라 하면 \\(g_b=A/(1-b)\\), \\(g_r=A/(1+b)\\)이다. 따라서 \\(A=2g_bg_r/(g_b+g_r)=0.85555556\\), \\(b=(g_b-g_r)/(g_b+g_r)=2/9\\)이다.\n\n이로부터 \\(r=3/(1-A^2)=11.1929986>6\\), \\(\\sin i=b\\sqrt{r-2}\\), \\(i=42.35924^\\circ\\)를 얻는다. 공전주파수의 무한원 블랙홀계 값은 \\(f_\\infty=(1+z)f_o=180\\ \\mathrm{Hz}\\)이다. \\(R=rGM/c^2\\)를 케플러 식에 넣으면 \\(f_\\infty=c^3/(2\\pi GMr^{3/2})\\), 따라서 \\(M=4.79363865M_\\odot\\)이다. 선 에너지와 시간 관측 모두에 우주론 적색편이를 적용하지만 국소 궤도시간의 중력지연을 좌표주파수에 다시 넣지 않는다.","wrongOptionExplanations":["횡도플러 인자를 빼고 \\(A=\\sqrt{1-2/r}\\)만 사용했다. 그러면 \\(r=7.4620\\), \\(i=31.2889^\\circ\\), \\(M=8.8065M_\\odot\\)로 달라진다.","정답. 선 끝의 조화평균으로 반지름, 비대칭으로 경사각, 좌표주파수로 질량을 분리했다.","150 Hz가 공전의 두 배라고 가정하여 공전주파수를 절반으로 만들고 질량을 두 배로 만들었다.","선 비대칭으로 얻은 \\(v\\sin i/c=2/9\\)를 곧바로 \\(\\sin i\\)로 오인했다.","선에는 적색편이를 보정했으나 관측 주파수 150 Hz를 그대로 무한원 주파수로 사용했다."],"sourceReferences":[{"title":"M. C. Miller, Observational Signatures of Strong Gravity","url":"https://pages.astro.umd.edu/~mcmiller/teaching/astr680/lecture14.pdf","note":"상대론적 원반 선에 대한 중력·도플러 효과와 공전시간 진단; 직선 광선 근사는 지문에 명시."}],"verified":true,"estimatedDifficulty":"대학원 종합시험 수준; 선 적색편이→상대론 인자 합성→반지름→경사각→관측시간 변환→질량의 6단계","verification":{"method":"반지름 수치근과 전방 상대론 선에너지 재구성으로 해를 확인하고 좌표 공전주파수 검산; Python/NumPy 독립 계산","result":"PASS; r=11.192998616; i=42.359237293 deg; M=4.793638651 Msun"},"questionId":46},{"localId":"H05","category":"세계사·고고학·고문헌","difficulty":7,"questionText":"아르키메데스 팔림프세스트의 수학 글은 저자의 기원전 3세기 친필이 아니라 10세기 콘스탄티노폴리스에서 베껴 쓴 그리스어 사본이다. 월터스 미술관의 조사에 따르면 13세기에는 그 글을 지우고, 양피지를 기존 접힘선을 따라 자르고, 90도 돌려 다시 접어 기도서를 만들었다. 이 기도서에는 아르키메데스 사본 이외의 책에서 가져온 양피지도 섞였다. 따라서 새 책의 연속 면들이 반드시 옛 수학책에서 이웃하던 면은 아니다. 근대에는 일부 면에 위조 성상이 그려져 지워진 글을 더 가렸다.\n\n연구진은 먼저 여러 파장으로 촬영하고 영상을 처리했으며, 특히 어려운 면에는 원래 잉크에 남은 철을 지도화하는 X선 형광 영상을 사용했다. 2005년 보고는 이 방법으로 81r의 위조 성상 아래 수학 글을 읽었다고 밝힌다. 지금 한 연구자가 그 면의 복원 전사를 만들고자 한다. 재활용된 지지체의 방향, 필사 연대, 텍스트 소속, 잉크 원소의 분포와 실제 문자의 판독을 차례로 연결해야 하며, 촬영 결과 자체가 그리스어 문장을 자동으로 보증한다고 가정해서는 안 된다. 주어진 제작사와 영상 원리에 모두 맞는 복원 원칙은 어느 것인가?","options":["옛 글의 방향과 재단·접힘을 복원한 뒤 소속과 순서를 대조한다. 철 분포는 잔존 잉크를 드러내는 수단이며, 판독과 작품 귀속에는 별도의 문헌적 판단이 필요하다.","X선 영상은 철을 검출하므로 글의 저자·내용·정확한 필사 연대까지 직접 검출한다. 따라서 면의 회전과 다른 책의 혼입은 문헌적 대조 없이 해결된다.","수학 글은 10세기 사본으로 분류하되, 90도 회전한 모든 아래 글을 아르키메데스의 작품으로 귀속한다. 다른 책의 혼입은 기도문의 내용에만 영향을 준다.","수학 글이 기원전 3세기 저술이므로 철 잉크도 저자의 생전 것으로 편년한다. 기도문은 후대 층이므로 기존 접힘선이나 재단 흔적은 복원에서 배제한다.","기도서의 면 순서를 곧 수학 사본의 순서로 삼고, 철 분포를 기도문 기준으로 전사한다. 위조 성상의 존재는 아래 수학 글의 10세기 편년도 폐기하게 한다."],"correctAnswer":0,"detailedExplanation":"① 저술 연대와 10세기 필사물의 연대를 분리한다. ② 재단·회전·재접기를 역추적해 옛 면의 방향을 찾는다. ③ 여러 책의 양피지가 혼합되었으므로 면 순서와 작품 소속을 독립적으로 검토한다. ④ 근대 성상은 추가 층이므로 그 존재가 아래 글의 편년을 바꾸지는 않는다. ⑤ 철을 검출하는 영상과 그 흔적을 그리스어 문자로 읽는 판단은 다르다. 이 다섯 절차를 모두 만족하는 복원 원칙이 정답이다.","wrongOptionExplanations":["정답이다. 물리적 재구성과 원소 영상, 문자 판독, 작품 귀속을 구분해 결합한다.","X선 형광은 잉크 성분의 분포를 보여 주는 기술이다. 저자·언어·연대와 문장의 의미가 원소 검출에서 자동 산출되지는 않는다.","아래 글에는 다른 책의 텍스트도 포함된다. 방향이 같거나 기도문 아래 있다는 이유만으로 아르키메데스에 귀속할 수 없다.","저자의 생존 시기와 현존 사본의 필사 시기를 혼동했다. 재단·접힘은 옛 물리적 구조를 복원하는 직접 증거이다.","기도서의 재구성은 옛 책의 순서를 보존한다고 보장되지 않는다. 후대 성상도 아래 필사층의 10세기 편년을 폐기하지 않는다."],"sourceReferences":[{"title":"Lost and Found: The Secrets of Archimedes — The Walters Art Museum","url":"https://thewalters.org/news/lost-and-found-the-secrets-of-archimedes/","note":"본문 직접 열람. 10세기 필사, 13세기 재단·90도 회전·재접기, 다른 책의 혼입, 근대 위조 성상, 다중분광 촬영을 확인했다. 기도서 완성 날짜는 이 페이지와 다른 자료의 하루 차이가 있어 문항에서 제외했다."},{"title":"With X-Ray Florescence Imaging, New Ability to Read Previously Unknown Mathematical Treatises in Archimedes Palimpsest — The Walters Art Museum","url":"https://thewalters.org/news/archimedes-palimpsest-imaging/","note":"2005년 연구기관 보고 본문 직접 열람. folio81r에서 잉크의 철을 검출하여 위조 성상 아래 글을 드러낸 사례를 확인했다."}],"verified":true,"estimatedDifficulty":"극상: 다섯 물질·시간·텍스트 층위와 측정 원리의 한계를 종합","verification":{"method":"보존·영상 연구를 수행한 기관의 두 보고를 직접 읽고 제작 과정과 검출 대상을 상호 대조했다.","result":"제시한 정답만 성립한다. 지워진 모든 글의 완전 복원이나 원소 영상에 의한 자동 의미 판독을 주장하지 않는다."},"questionId":47},{"localId":"chem5","category":"화학","difficulty":7,"questionText":"일정 부피의 균일한 희석용액에서 \\(A\\rightleftharpoons B\\to C\\)와 병렬 반응 \\(A\\to D\\)가 동시에 진행된다. 모든 단계는 단분자 일차반응이며 속도상수는 \\(k_{A\\to B}=3.000\\), \\(k_{B\\to A}=1.000\\), \\(k_{B\\to C}=2.000\\), \\(k_{A\\to D}=1.000\\ \\mathrm{s^{-1}}\\)이다. C와 D는 더 반응하지 않고 서로 바뀌지도 않으며, 각 화살표는 반응물 1분자가 생성물 1분자로 바뀌는 단계이다. 처음에는 \\([A]_0=1.0000\\ \\mathrm{mM}\\)이고 B·C·D는 모두 없다. 혼합·온도 조절·측정의 시간지연은 무시한다.\n\n중간체 B를 최대한 포획하기 위해, B의 농도가 전 시간 구간 \\(t\\ge0\\)에서 최댓값을 갖는 순간에 용액을 즉시 냉각하여 모든 반응을 완전히 정지시킨다. 정류상태 근사나 \\(A\\rightleftharpoons B\\)의 사전 평형 근사는 허용하지 않으며, 포획 직전까지의 정확한 선형 미분방정식을 풀어야 한다. 포획 시점에 B의 유입률과 총 유출률은 같지만, 이것이 전체 시간 동안 성립한다고 두면 안 된다. 필요한 경우 \\(A+B+C+D=A_0\\)라는 분자수 보존과 각 생성물의 시간 적분을 함께 사용할 수 있다. 분모의 D가 0인지도 확인하라. 포획 시각 \\(t_*\\)와 그 시각까지 생성된 누적 생성물 몰비 \\([C](t_*)/[D](t_*)\\)를 각각 소수 다섯째 자리까지 구한 것은?","options":["\\((0.31597\\ \\mathrm s,\\ 0.66667)\\)","\\((0.31597\\ \\mathrm s,\\ 1.22615)\\)","\\((0.31597\\ \\mathrm s,\\ 2.00000)\\)","\\((0.34657\\ \\mathrm s,\\ 1.00000)\\)","\\((0.31597\\ \\mathrm s,\\ 0.81556)\\)"],"correctAnswer":4,"detailedExplanation":"A와 B의 방정식은 \\(\\dot A=-4A+B\\), \\(\\dot B=3A-3B\\)이다. 고유값은 \\(\\lambda_\\pm=(-7\\pm\\sqrt{13})/2\\), 초기조건으로 \\(B/A_0=3[\\exp(\\lambda_+t)-\\exp(\\lambda_-t)]/\\sqrt{13}\\)이다. 도함수 0 조건은 \\(\\exp[(\\lambda_+-\\lambda_-)t_*]=\\lambda_-/\\lambda_+\\), 따라서 \\(t_*=\\ln[(7+\\sqrt{13})/(7-\\sqrt{13})]/\\sqrt{13}=0.31596727\\ \\mathrm s\\)이다. B는 처음 증가하고 장시간 0으로 가며 이 정상점은 유일하다.\n\n이때 \\(B/A_0=b=0.330917741\\)이고 \\(\\dot B=0\\)이므로 \\(A=B\\)이다. \\(C=2\\int Bdt\\), \\(D=\\int Adt\\), B 방정식의 적분에서 \\(B=3D-3C/2\\)이다. 보존식 \\(C+D=A_0-2B\\)와 함께 풀면 \\(C/A_0=2/3-14b/9=0.151905736\\), \\(D/A_0=1/3-4b/9=0.186258782>0\\)이다. 비는 \\(0.815562815\\)이다. 순간 분기속도비와 누적 생성물비는 일반적으로 다르다.","wrongOptionExplanations":["B가 한 번 유출할 때 C로 갈 순간 분기확률 \\(2/(1+2)=2/3\\)를 누적 C/D 몰비로 오인했다. D는 B가 아닌 A에서 생성된다.","C/D가 아니라 그 역수 D/C를 보고했다.","C와 D의 생성 속도상수 2:1만 비교했다. 두 경로의 전구체 B와 A는 서로 다른 시간 의존성을 갖는다.","역반응 \\(B\\to A\\)를 생략했다. 그때는 \\(B/A_0=1.5(e^{-2t}-e^{-4t})\\)여서 최대시각은 \\(\\ln2/2=0.346574\\) s이며, 그 순간 C와 D가 각각 초기량의 0.1875이다.","정답. 정확한 과도해와 포획 조건을 먼저 구하고 이후 누적 물질수지를 적용했다."],"sourceReferences":[{"title":"K. A. Nelson and M. Bawendi, Final Exam – Kinetic Summary","url":"https://ocw.mit.edu/courses/5-60-thermodynamics-kinetics-spring-2008/resources/finalexam_kinet/","note":"병렬·연속·가역 일차반응과 정류상태·평형 근사의 구분; 반응망과 수치는 독자 구성."}],"verified":true,"estimatedDifficulty":"대학원 종합시험 수준; 행렬 구성→고유해→초기조건→최대조건→적분수지→누적 생성물비의 6단계","verification":{"method":"4종 전체 반응망을 RK4로 적분하여 B 도함수의 부호변화로 최대점을 찾고 보존·생성물비를 확인; Python/NumPy 독립 계산","result":"PASS; RK4 t_max=0.315967271933 s; C/D=0.815562815197; state=[np.float64(0.33091774083262104), np.float64(0.3309177408326211), np.float64(0.15190573648258782), np.float64(0.1862587818521677)]"},"questionId":48},{"localId":"BIO-09","category":"생물학","difficulty":7,"questionText":"한 세포 안에 같은 조절부를 가진 두 색의 독립 리포터를 삽입하였다. 각 리포터의 프로모터는 OFF→ON 속도 a, ON→OFF 속도 b로 전환되고 ON일 때 RNA를 속도 sE로 만든다. RNA 분해상수는 시간당 1이다. 세포별 외재인자 E는 양수이고 평균 1이며, 한 세포가 정상상태에 도달하는 동안 고정된다. E를 조건으로 두 리포터의 프로모터 전환과 RNA 생성·분해는 서로 독립이다. E는 a와 b를 바꾸지 않는다.\n\n처리 전 전체 세포 집단에서 각 리포터의 평균 RNA 수는 20, 분산은 220이고 두 리포터 수의 공분산은 100이다. 독립적인 빠른 프로모터 관측으로 a+b=4임을 안다. 이 측정은 세포별 RNA의 느린 외재 변동을 제외한 전환율 합이다. 이후 한 처리를 통해 OFF→ON 속도 a만 정확히 두 배로 바꾼다. b, s, E의 분포, RNA 분해 및 리포터 사이의 조건부 독립성은 유지된다. 처리 후에도 새 정상상태를 충분히 기다린다. 전체 분산을 평균으로 나눈 Fano 인자를 묻는다. 먼저 공분산으로 외재 변동을 분리하고, 고유 전사 잡음에서 a,b,s를 복원한 뒤 처리 효과를 계산해야 한다. 처리 전 a, b, s 및 처리 후 전체 Fano 인자의 조합으로 옳은 것은?","options":["a=2, b=2, s=40; 처리 후 Fano=11","a=2, b=2, s=40; 처리 후 Fano=61/21","a=2, b=2, s=20; 처리 후 Fano=50/21","a=1, b=3, s=80; 처리 후 Fano=211/21","a=2, b=2, s=40; 처리 후 Fano=211/21"],"correctAnswer":4,"detailedExplanation":"1단계: E가 고정되었을 때 평균은 μ_E=saE/(a+b)=μE이다. 두 리포터가 조건부 독립이므로 공분산은 Var(μE)=μ²Var(E)이다. 따라서 Var(E)=100/20²=1/4이며 E[E²]=5/4이다.\n\n2단계: S=a+b라 두자. ON 지시변수 I의 평균은 a/S이다. 정상상태 모멘트 방정식 0=sE E[I]+a E[M]−(S+1)E[MI]에서 Cov(M,I)=sEab/[S²(S+1)]을 얻는다. 생성·분해의 두 번째 모멘트 식으로 Var(M|E)=μE+s²abE²/[S²(S+1)]이다. 이 추가 항을 B E²라 쓰면 B=s²ab/[S²(S+1)]이다.\n\n3단계: 전체 분산 법칙에 따라 220=20+B(5/4)+100이다. 따라서 B=80이다. 평균에서 sa=80이고 S=4를 대입하면 B=s²ab/80=sb=80이다. sa=sb이므로 a=b=2, s=40이다.\n\n4단계: 처리 후 a′=4, S′=6, 새 평균 μ′=40×4/6=80/3이다. 외재인자가 없을 때의 추가 Fano 항은 sb/[S′(S′+1)]=80/42=40/21이다.\n\n5단계: 외재인자를 평균하면 이 추가 항에 E[E²]=5/4가 곱해지고, 조건부 평균의 분산은 μ′²Var(E)가 추가된다. 전체 Fano=1+(40/21)(5/4)+(80/3)(1/4)=1+50/21+20/3=211/21이다. 공분산을 한 번 뺐다고 외재인자를 영구히 제거한 것이 아니라, 변하는 평균에서 다시 합쳐야 한다.","wrongOptionExplanations":["처리 전 Fano=220/20=11을 그대로 유지했다. a 변화는 ON 비율과 프로모터 전환 잡음을 모두 바꾼다.","61/21은 E=1로 고정한 한 세포의 고유 Fano 인자이다. 세포 간 전사율 변동과 E² 평균을 반영하지 않았다.","s=20이면 a=b=2일 때 평균이 10이 되어 관측 평균 20을 재현하지 못한다. 또한 Fano의 포아송 항 1이 빠졌다.","평균과 전환율 합은 맞출 수 있어도 분산에서 추론한 sa=sb=80을 동시에 만족하지 못한다.","정답이다. 단계별 모형 해석과 수치 검산을 모두 만족한다."],"sourceReferences":[{"title":"Stochastic gene expression in a single cell","url":"https://pubmed.ncbi.nlm.nih.gov/12183631/","note":"이중 리포터를 통한 고유·외재 잡음 분리 원리를 원논문으로 확인했다. 정적 E를 가진 전신 모형과 수치는 문항에서 별도로 정의했다."}],"verified":true,"estimatedDifficulty":"최상위권 대학원 수준의 다단계 모형 추론","verification":{"method":"독립 Python 검산: 정확분수·전수 열거·모멘트 방정식·오목 최적화 및 지문 길이/스키마 점검","result":"Var(E)=1/4; a=2; b=2; s=40; new Fano=211/21"},"questionId":49},{"localId":"chem1","category":"화학","difficulty":7,"questionText":"이종 이원자 분자의 한 전자 해밀토니안을 두 실수 원자함수 \\(\\chi_A,\\chi_B\\)로 전개한다. 각각의 노름은 1이지만 겹침은 \\(S_{AB}=S_{BA}=0.2000\\)으로 0이 아니다. 이 기저에서 \\(H_{AA}=-12.000\\), \\(H_{BB}=-8.000\\), \\(H_{AB}=H_{BA}=-3.000\\ \\mathrm{eV}\\)이다. 모든 값은 동일한 한 전자 에너지 영점을 사용하며, 핵 간 반발은 전자 상태와 무관한 상수이므로 이번 질문에서 제외한다. 분자에 이 모형의 전자가 두 개 있고, 전자 사이 반발과 스핀 의존 항은 무시하여 가장 낮은 분자궤도에 반대 스핀으로 함께 채운다.\n\n점유 궤도를 \\(\\psi=c_A\\chi_A+c_B\\chi_B\\)라 하고 \\(c^\\mathsf TS c=1\\)로 정규화한다. 각 원자의 유효 양전하가 \\(+e\\)일 때, 이 문제에서 Mulliken 전자수는 \\(N_A=2(c_A^2+S_{AB}c_Ac_B)\\), \\(N_B=2(c_B^2+S_{AB}c_Ac_B)\\)로 정의한다. 따라서 원자 A의 순전하는 \\(Q_A/e=1-N_A\\)이다. 분자궤도 에너지는 보통의 \\(Hc=Ec\\)가 아니라 변분문제의 일반화 고유방정식에서 구한다. 에너지 간격은 핵의 이완 없이 이 모형에서 낮은 궤도와 높은 궤도의 고유값 차이로 정의하며, 실제 분자의 다전자 광학 전이에 대한 추가 보정은 없다. 계수의 전체 부호는 물리량을 바꾸지 않는다. \\((Q_A/e,E_+-E_-)\\)를 소수 넷째 자리까지 구한 것은?","options":["\\((-1.9091,\\ 4.5833\\ \\mathrm{eV})\\)","\\((-0.5547,\\ 7.2111\\ \\mathrm{eV})\\)","\\((-0.8561,\\ 4.5833\\ \\mathrm{eV})\\)","\\((-0.9091,\\ 4.5833\\ \\mathrm{eV})\\)","\\((+0.9091,\\ 4.5833\\ \\mathrm{eV})\\)"],"correctAnswer":3,"detailedExplanation":"변분 조건은 \\((H-ES)c=0\\)이므로 세속식은 \\((-12-E)(-8-E)-(-3-0.2E)^2=0\\), 즉 \\(0.96E^2+18.8E+87=0\\)이다. 두 근은 \\(E_-=-12.0833333\\), \\(E_+=-7.5\\ \\mathrm{eV}\\), 간격은 \\(4.5833333\\ \\mathrm{eV}\\)이다. 낮은 근에서 첫 행은 \\((1/12)c_A-(7/12)c_B=0\\)이므로 \\(c_B=c_A/7\\)이다.\n\n겹침을 포함한 정규화는 \\(c_A^2[1+1/49+0.4/7]=1\\)을 준다. 따라서 \\(c_A^2=49/52.8\\), \\(c_B^2=1/52.8\\), \\(c_Ac_B=7/52.8\\)이다. \\(N_A=2(49+1.4)/52.8=1.90909091\\), \\(N_B=0.09090909\\)이고 합은 정확히 2이다. 그러므로 \\(Q_A/e=-0.90909091\\)이다. 겹침 전자밀도를 버리거나 두 원자에 중복 배분하면 총 전자수 검사가 실패한다.","wrongOptionExplanations":["\\(-N_A\\)를 순전하로 보고 핵의 유효 전하 \\(+1\\)을 더하지 않았다.","기저를 직교로 간주하여 보통의 2×2 행렬 고유값과 직교계의 전자수를 계산한 값이다.","S-노름으로 정규화는 했으나 \\(N_A=2c_A^2\\)로 두고 겹침 배분을 누락했다.","정답. 일반화 고유값과 S-노름 정규화를 사용하고 겹침 전자수를 절반씩 배분했다.","전자수가 양전하보다 큰 원자 A에 양의 순전하를 부여하여 전하의 부호를 뒤집었다."],"sourceReferences":[{"title":"R. Field, MO Theory, Matrix Mechanics and Variational Principle","url":"https://ocw.mit.edu/courses/5-61-physical-chemistry-fall-2017/resources/mit5_61f17_lec24/","note":"비직교 LCAO의 변분·일반화 행렬 원리; 행렬과 전하 정의는 문제에서 지정."}],"verified":true,"estimatedDifficulty":"대학원 종합시험 수준; 비직교 세속식→두 에너지→계수비→S 정규화→전자수→순전하의 6단계","verification":{"method":"Cholesky 직교화 후 대칭 고유값 풀이; 원 일반화 방정식·S 노름·전자수 합을 재검사; Python/NumPy 독립 계산","result":"PASS; E=[np.float64(-12.083333333333334), np.float64(-7.500000000000001)] eV; Mulliken populations=[np.float64(1.9090909090909087), np.float64(0.09090909090909087)]; Q_A=-0.909090909091"},"questionId":50}];

function choose(i){if(busy||screen?.phase!=='question')return;selected=i;record.selected=i;save();app.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-checked',String(Number(b.dataset.choice)===i)));document.getElementById('submit').disabled=false}
function result(v){
 const groups=new Map();for(const q of v.review){const c=q.category;const g=groups.get(c)||[0,0];g[0]+=Number(q.isCorrect);g[1]++;groups.set(c,g)}
 app.innerHTML=header()+'<main class="result"><p class="eyebrow">THE CHALLENGE IS COMPLETE</p><div class="result-ai">AI 사용 시 무효</div><div class="result-head"><div><div class="score">'+v.score+'<small>/ 50</small></div><h1 class="grade">'+esc(v.grade)+'</h1><p class="result-caption">50개의 질문에 모두 답했습니다.<br>이 등급은 게임 내부의 연출이며 실제 지능이나 학문적 능력을 측정하지 않습니다.</p></div><table class="breakdown"><caption class="sr-only">분야별 정답 수</caption><tbody>'+[...groups].map(([c,[a,b]])=>'<tr><td>'+esc(c)+'</td><td>'+a+' / '+b+'</td></tr>').join('')+'</tbody></table></div><button class="primary" id="reset">처음부터 다시 도전<span class="arrow">↗</span></button><h2 class="review-title">Review the evidence.</h2><div class="review-toolbar"><span class="result-caption">제출한 모든 답안과 해설을 다시 확인하세요.</span><select id="review-filter" aria-label="복습 문항 필터"><option value="all">모든 문제</option><option value="wrong">틀린 문제만</option><option value="correct">맞힌 문제만</option></select></div><div id="reviews">'+v.review.map(q=>'<details class="review-item" data-correct="'+q.isCorrect+'"><summary><span class="review-dot '+(q.isCorrect?'':'miss')+'"></span><span>'+String(q.questionId).padStart(2,'0')+'</span><span>'+esc(q.questionId===1?'문제 1':q.category)+'</span><span style="margin-left:auto">'+(q.isCorrect?'CORRECT':'INCORRECT')+' ＋</span></summary><div class="review-body" data-id="'+q.questionId+'"></div></details>').join('')+'</div></main>'+footer();
 document.getElementById('reset').onclick=()=>document.getElementById('reset-dialog').showModal();
 document.getElementById('review-filter').onchange=e=>app.querySelectorAll('.review-item').forEach(d=>{d.hidden=e.target.value==='wrong'&&d.dataset.correct==='true'||e.target.value==='correct'&&d.dataset.correct==='false'});
 app.querySelectorAll('.review-item').forEach(d=>d.addEventListener('toggle',()=>{if(!d.open)return;const body=d.querySelector('.review-body');if(body.childNodes.length)return;const q=v.review[Number(body.dataset.id)-1];body.innerHTML='<div class="prose">'+prose(q.questionText)+'</div><div class="review-answer">'+q.options.map((o,i)=>circles[i]+' '+esc(o)+(i===q.correctAnswer?'　✓ 정답':'')+(i===q.selected?'　← 내 답안':'')).join('<br>')+'</div>'+explanationHtml(q);body.querySelector('details').open=true;math()}));
}
function draw(v){screen=v;if(v.phase==='complete')result(v);else question(v)}
async function perform(action,input={},fresh=false){
 if(busy)return;const epoch=++operationEpoch;busy=true;const active=document.activeElement;const btns=[...app.querySelectorAll('.primary')];btns.forEach(b=>b.disabled=true);
 try{
  const response=await transport(action,{...input,token:fresh?null:record?.token});
  if(epoch!==operationEpoch)return;
  record={token:response.token,selected:action==='resume'?record?.selected??null:null};
  selected=record.selected;save();draw(response.view);
  exitGuard.returned(document.visibilityState==='visible'&&document.hasFocus());
  if(action==='answer'){document.getElementById('feedback')?.scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('live').textContent=response.view.feedback.isCorrect?'정답입니다.':'오답입니다.'}
  else if(action!=='resume')window.scrollTo({top:0,behavior:'instant'});
 }catch(e){
  if(epoch!==operationEpoch)return;
  toast(e.message||'연결에 실패했습니다. 다시 시도해 주세요.');btns.forEach(b=>b.disabled=false);if(document.getElementById('submit'))document.getElementById('submit').disabled=selected===null;
  if(!screen&&record){app.innerHTML=header()+'<main class="error-view"><p class="eyebrow">PROGRESS RECOVERY</p><h1>기록을 불러오지 못했습니다.</h1><p>인터넷 연결을 확인하고 다시 시도하세요. 새로 시작하면 이 기기의 기존 진행 기록이 교체됩니다.</p><div class="cover-action"><button class="primary" id="retry">다시 불러오기<span>↗</span></button><button class="text-button" id="reset">새로 시작</button></div></main>';document.getElementById('retry').onclick=()=>perform('resume');document.getElementById('reset').onclick=()=>document.getElementById('reset-dialog').showModal()}
  active?.focus?.();
 }finally{if(epoch===operationEpoch)busy=false}
}
document.getElementById('cancel-reset').onclick=()=>document.getElementById('reset-dialog').close();
document.getElementById('confirm-reset').onclick=()=>{document.getElementById('reset-dialog').close();perform('start',{},true)};
document.addEventListener('keydown',e=>{if(screen?.phase!=='question'||e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(/^[1-5]$/.test(e.key)){e.preventDefault();choose(Number(e.key)-1);app.querySelector('[data-choice="'+(Number(e.key)-1)+'"]')?.focus()}if(['ArrowDown','ArrowUp'].includes(e.key)&&e.target.matches('[data-choice]')){e.preventDefault();const i=(Number(e.target.dataset.choice)+(e.key==='ArrowDown'?1:4))%5;choose(i);app.querySelector('[data-choice="'+i+'"]').focus()}});
window.addEventListener('storage',e=>{if(e.key===SAVE_KEY){toast('다른 탭에서 진행 기록이 바뀌었습니다. 최신 기록을 불러옵니다.');record=readSave();if(record)perform('resume');else home()}});
const exitGuard=createExitGuard({
 isActive:()=>screen?.phase==='question'||screen?.phase==='feedback',
 reset:()=>{
  operationEpoch++;busy=false;record=null;selected=null;screen=null;
  try{localStorage.removeItem(SAVE_KEY)}catch{}
  home();perform('start',{},true);
 }
});
window.addEventListener('blur',()=>exitGuard.leave('blur'));
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='hidden')exitGuard.leave('hidden');
 else exitGuard.returned(document.hasFocus());
});
window.addEventListener('focus',()=>exitGuard.returned(document.visibilityState==='visible'));
window.addEventListener('pagehide',()=>exitGuard.leave('pagehide'));
window.addEventListener('beforeunload',()=>exitGuard.leave('beforeunload'));
document.addEventListener('keydown',e=>{
 const capture=e.key==='PrintScreen'||((e.metaKey||e.ctrlKey)&&e.shiftKey&&['s','3','4','5'].includes(String(e.key).toLowerCase()));
 if(capture)exitGuard.leave('capture-key');
},true);
document.addEventListener('keyup',e=>{if(e.key==='PrintScreen')exitGuard.leave('capture-key')},true);

record=readSave();if(record)perform('resume');else home();
</script></body></html>
